name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    name: Node regression suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current grade curricula and legacy preservation
        run: node test/curriculum-regression.js
      - name: Role regression
        run: node test/role-regression.js
      - name: Automatic student workflow and eight-week simulation
        run: node test/student-automation-regression.js
      - name: Optional student reporting cycles
        run: node test/weekly-cycle-regression.js
      - name: Mobile backups and print recovery
        run: node test/mobile-export-regression.js
      - name: Background return preserves the current screen
        run: node test/visibility-regression.js
      - name: Learning feedback and lesson postponement
        run: node test/learning-feedback-regression.js
      - name: Student recall feedback interactions
        run: node test/result-feedback-ui-regression.js
      - name: Result-package regression
        run: node test/result-package-regression.js
      - name: Student-package integrity and startup recovery
        run: node test/data-integrity-regression.js
      - name: Cloud-sync resilience
        run: node test/cloud-sync-resilience.js
      - name: Firebase Analytics isolation and production-only collection
        run: node --experimental-vm-modules test/firebase-analytics-regression.cjs
      - name: Timetable JSON regression
        run: node test/timetable-json-regression.js
      - name: Past plan photo recovery
        run: node test/past-plan-recovery-regression.js
      - name: Confirmed cloud logout and optional memory level
        run: node test/logout-memory-regression.js
      - name: Logout editing, browser reset and reversible cloud rollback
        run: node test/logout-reset-regression.js
      - name: Dated school timetables and persistent AYT priority
        run: node test/ayt-timetable-regression.js

  photo-recovery-browser:
    name: Past plan recovery browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --prefix "$RUNNER_TEMP/yks-browser" --no-save playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/yks-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review and save a photographed plan on desktop and mobile
        run: NODE_PATH="$RUNNER_TEMP/yks-browser/node_modules" YKS_UI_ARTIFACTS="$RUNNER_TEMP/yks-photo-ui" node test/past-plan-recovery-browser.cjs
      - name: Logout failure, retry, multiple tabs and memory settings
        run: NODE_PATH="$RUNNER_TEMP/yks-browser/node_modules" YKS_UI_ARTIFACTS="$RUNNER_TEMP/yks-photo-ui" node test/logout-memory-browser.cjs
      - name: Grade enrollment on desktop and mobile
        run: NODE_PATH="$RUNNER_TEMP/yks-browser/node_modules" YKS_UI_ARTIFACTS="$RUNNER_TEMP/yks-photo-ui" node test/curriculum-browser.cjs
      - name: Keep synthetic review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-recovery-browser
          path: ${{ runner.temp }}/yks-photo-ui

  firestore-rules:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/firebase/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase test dependencies
        working-directory: test/firebase
        run: npm ci
      - name: Run Firestore security-rule checks
        run: test/firebase/node_modules/.bin/firebase emulators:exec --only firestore --project demo-yks-test "node test/firebase/firestore.test.mjs"
      - name: Verify save and print delivery with a fresh emulator
        run: test/firebase/node_modules/.bin/firebase emulators:exec --only firestore --project demo-yks-test "node test/firebase/save-print-flow.test.mjs"
