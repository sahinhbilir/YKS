  if (t.dataset.haritaonayvazgec !== undefined) { EK.haritaOnay = null; ciz(); return; }
  if (t.classList.contains('haritaNeden')) {
    EK.haritaOnay = { hb: +t.dataset.hb, neden: t.dataset.neden };
    ciz();
    return;
  }
  if (t.classList.contains('haritaOnayla')) {
    const si = EK.ogr, hb = +t.dataset.hb, neden = t.dataset.neden;
    const r = haftayiTelafiEt(si, hb, neden);
    EK.haritaAcik = null; EK.haritaOnay = null; EK.kirli = true; await kaydet(true); ciz();
    bilgiVer(((r.testErtelenen ? r.testErtelenen + ' test ertelendi' : '') +
             (r.testErtelenen && r.konuKaydirilan ? ' · ' : '') +
             (r.konuKaydirilan ? r.konuKaydirilan + ' konu anlatım olarak eklendi' : '')) || 'İşaretlendi.');
    return;
  }
  if (t.id === 'hepsiIzin') {
    D.ogr.forEach(o => { o.off = [5, 6]; });
    await kaydet(true); ciz(); return;
  }
  if (t.id === 'duzenleAc') {
    const hb = haftaBasi(), n = haftaSonucSayisi(EK.ogr, hb);
    if (n) { bilgiVer('Bu haftanın ' + n + ' sonucu girilmiş; düzeni değiştirilemez.'); return; }
    D.duzenleHafta = hb;
    await kaydet(true); ciz();
    bilgiVer('Düzenleme açıldı — ' + ggyy(hb) + ' haftası. İstediğiniz kadar değişiklik yapın; ' +
             'sayfa yenilense bile açık kalır, “düzenlemeyi bitir” diyene kadar kapanmaz.');
    return;
  }
  if (t.id === 'duzenleBitir') {
    const hb = duzenlenenHafta();
    delete D.duzenleHafta;
    EK.hafta = null;                         // bitince içinde bulunulan haftaya dön
    await kaydet(true); ciz();
    bilgiVer(ggyy(hb) + ' haftasının düzenlemesi kapatıldı.');
    return;
  }
  if (t.id === 'duzenleneneDon') { EK.hafta = duzenlenenHafta(); ciz(); return; }
  if (t.classList.contains('erteleDug')) {
    const si = EK.ogr, ki = +t.dataset.ki;
    const g = konuyuErtele(si, ki);
    EK.kirli = true; await kaydet(true); ciz();
    bilgiVer(kacis(konuAl(ki)[3]) + ' → ' + GUN_AD[haftaGunu(g)] + ' ' + ggyy(g) +
             '. Sonuç yazılmadı, konu hâlâ ilk tekrar olarak bekliyor.');
    return;
  }
  if (t.id === 'bekleyeniErtele') {
    const si = EK.ogr;
    const bek = (planHesapla(si, haftaBasi()).bekleyen || []).map(x => x.ki);
    if (!bek.length) return;
    let g = 0;
    bek.forEach(ki => { g = konuyuErtele(si, ki); });
    EK.kirli = true; await kaydet(true); ciz();
    bilgiVer(bek.length + ' konu ' + ggyy(g) + ' gününden itibaren yeniden planlandı.');
    return;
  }
  if (t.id === 'bekleyeniAl') {
    const si = EK.ogr, hb = haftaBasi();
    const bek = (planHesapla(si, hb).bekleyen || []).map(x => x.ki);
    if (!bek.length) return;
    const ov = elleAl(si, hb, true);
    ov.ek = (ov.ek || []).concat(bek.filter(k => (ov.ek || []).indexOf(k) < 0));
    EK.kirli = true; await kaydet(true); ciz();
    bilgiVer(bek.length + ' konu bu haftanın planına alındı.');
    return;
  }
  if (t.id === 'kurYapistirAc') {
    const alan = document.getElementById('yapistirAlan');
    if (alan) { alan.hidden = !alan.hidden; if (!alan.hidden) document.getElementById('yapistirMetin').focus(); }
    return;
  }
  if (t.id === 'yapistirYukle') {
    const kutu = document.getElementById('yapistirMetin');
    const metin = (kutu && kutu.value || '').trim();
    if (!metin) { alert('Önce yedek dosyasının içeriğini kutuya yapıştırın.'); return; }
    const sonuc = await metindenYukle(metin);
    if (sonuc) bilgiVer(sonuc);
    return;
  }
  if (t.dataset.sekme) { EK.sekme = t.dataset.sekme; PENCERE = null; pencereCiz(); ciz(); return; }
  if (t.dataset.hafta !== undefined) {
    const d = +t.dataset.hafta;
    EK.hafta = d === 0 ? null : haftaBasi() + d * 7;
    EK.girisAcik = {};
    ciz(); return;
  }
  if (t.id === 'planiSabitle') {
    const hb = haftaBasi();
    if (hb !== buHafta()) { bilgiVer('Yalnızca içinde bulunduğun haftanın planı kullanıma alınabilir.'); return; }
    if (!confirm('Bu haftanın planı sabitlenecek. Sonradan geçmiş konu eklesen veya tarih değişse bile bu haftanın içeriği değişmeyecek. Devam?')) return;
    const toplam = haftayiKullanimaAl(EK.ogr, hb);
    if (!toplam) { bilgiVer('Sabitlenecek çalışma yok.'); return; }
    await kaydet(true); ciz();
    bilgiVer('Plan kullanıma alındı; bu haftanın kaydı artık değişmeyecek.');
    return;
  }
  if (t.id === 'yazdirOnizle') {
    // Taslak görünümü hiçbir şeyi sabitlemez, kaydetmez, öğrenciyi aktifleştirmez —
    // sadece o an ekranda hesaplanan planı kâğıda döker. Bir taslağa
    // bakmak isteyen, sonradan başka bir şeyin (ör. geçmiş konu ekleme) bu haftayı
    // değiştirmesini engellemesin diye buradan gitmeli.
    await planYazdir(null);
    return;
  }
  if (t.id === 'yazdir') {
    const hb = haftaBasi(), zatenSabit = !!elleAl(EK.ogr, hb, false).sabit;
    const tamam = await planYazdir(null);
    if (!tamam || zatenSabit) return;
    const soru = ogrenciMi()
      ? 'Belge oluşturuldu. Bu planı kullanacaksan haftayı şimdi sabitlemek istiyor musun?'
      : 'Belge oluşturuldu. Öğrenciye teslim edilen plan bu mu? Onaylarsanız hafta sabitlenecek.';
    if (!confirm(soru)) return;
    haftayiKullanimaAl(EK.ogr, hb);
    await kaydet(true); ciz();
    bilgiVer('Plan sabitlendi; ekrandaki hafta kâğıtla aynı kalacak.');
    return;
  }
  if (t.dataset && t.dataset.yazdirsube !== undefined) {
    const su = t.dataset.yazdirsube;
    const liste = subeKullananlar(su);
    if (!liste.length) {
      alert(su + ' şubesinde “kullanıyor” olarak işaretli öğrenci yok. Önce tek tek çıktı verip işaretleyin ' +
            'ya da Öğrenciler sekmesinden kutucuklarını işaretleyin.');
      return;
    }
    const tamam = await planYazdir({ sube: su });
    if (!tamam) return;
    if (!confirm('Belge oluşturuldu. Bu planların öğrencilere teslim edildiğini onaylayıp haftaları sabitlemek istiyor musunuz?')) return;
    const hb3 = haftaBasi();
    liste.forEach(i => { haftayiKullanimaAl(i, hb3); });
    await kaydet(true); ciz();
    return;
  }
  if (t.id === 'tumYazdir') {
    const liste = kullananlar();
    if (!liste.length) { alert('Henüz kimseye çıktı vermediniz. Bir öğrencinin planını yazdırınca listeye eklenir.'); return; }
    const tamam = await planYazdir('hepsi');
    if (!tamam) return;
    if (!confirm('Belge oluşturuldu. Bu planların öğrencilere teslim edildiğini onaylayıp haftaları sabitlemek istiyor musunuz?')) return;
    const hb4 = haftaBasi();
    liste.forEach(i => { haftayiKullanimaAl(i, hb4); });
    await kaydet(true); ciz();
    return;
  }
  if (t.id === 'ogrEkle') {
    const ad = (document.getElementById('yAd').value || '').trim();
    if (!ad) { alert('Önce öğrencinin adını yazın.'); return; }
    if (ad.length > 120) { alert('Öğrenci adı en fazla 120 karakter olabilir.'); return; }
    const su = document.getElementById('ySube');
    let sube = su.value === '__yeni'
      ? (document.getElementById('ySubeYeni').value || '').trim()
      : su.value;
    if (!sube) { alert('Şube kodunu yazın.'); return; }
    const noGiris = document.getElementById('yNo').value.trim();
    const no = noGiris ? Number(noGiris) : (Math.max(0, ...D.ogr.map(o => +o.no || 0)) + 1);
    if (!Number.isInteger(no) || no < 1 || no > 9999) { alert('Öğrenci numarası 1–9999 arasında tam sayı olmalı.'); return; }
    if (D.ogr.some(o => !o.silindi && String(o.no) === String(no))) { alert('Bu öğrenci numarası zaten kullanılıyor.'); return; }
    D.ogr.push({
      no: no, ad: ad, alan: document.getElementById('yAlan').value, sube: sube,
      kap: Math.max(1, Math.min(12, +document.getElementById('yKap').value || 6)),
      off: [6], hedef: null, aktif: false, cikti: null,
      maddeler: [], rutin: { once: '', ara: '', sonra: '' }
    });
    await kaydet(true); ciz();
    bilgiVer(ad + ' listeye eklendi (' + sube + '). Çıktı verdiğinizde “kullanıyor” olarak işaretlenecek.');
    return;
  }
  if (t.id === 'topluSil') { EK.toplu = !EK.toplu; ciz(); return; }
  if (t.id === 'topluUygula') {
    const secili = [...document.querySelectorAll('.topluKutu:checked')].map(c => c.dataset.slot);
    if (!secili.length) { alert('Önce silmek istediğiniz kutuları işaretleyin.'); return; }
    if (!confirm(secili.length + ' kutu plandan kaldırılacak. Devam?')) return;
    const hb = haftaBasi();
    secili.forEach(k => plandanKaldir(EK.ogr, hb, k));
    EK.toplu = false;
    await kaydet(true); ciz(); return;
  }
  if (t.id === 'topluYariya') {
    const secili = [...document.querySelectorAll('.topluKutu:checked')].map(c => c.dataset.slot);
    if (!secili.length) { alert('Önce soru sayısını değiştirmek istediğiniz kutuları işaretleyin.'); return; }
    const hb = haftaBasi(), si = EK.ogr;
    const p = planHesapla(si, hb);
    const hepsi = p.gunler.flat();
    const ov = elleAl(si, hb, true);
    let n = 0;
    secili.forEach(kStr => {
      const x = hepsi.find(o => String(planSlotAnahtari(o)) === kStr);
      if (!x || x.anlatim) return;
      const yeni = Math.max(1, Math.round((x.soru || D.ayar.soru) / 2));
      if (x.serbest) { ov.serbest = ov.serbest || {}; if (ov.serbest[kStr]) ov.serbest[kStr].soru = yeni; }
      else { ov.soru = ov.soru || {}; ov.soru[kStr] = yeni; }
      n++;
    });
    EK.toplu = false;
    await kaydet(true); ciz();
    bilgiVer(n + ' kutunun soru sayısı yarıya indirildi.');
    return;
  }
  if (t.id === 'topluHepsi') {
    document.querySelectorAll('.topluKutu').forEach(c => { c.checked = true; });
    return;
  }
  if (t.id === 'csv') {
    const hb = haftaBasi();
    await indir('plan-' + dosyaAdiParcasi(D.ogr[EK.ogr].ad, 'ogrenci').toLocaleLowerCase('tr') +
      '-' + isoDan(hb) + '.csv', csvOlustur(EK.ogr, hb), 'csv');
    return;
  }
  if (t.id === 'sonucKaydet' || t.id === 'hepsiIyi') {
    const kayitlar = [], anlatimlar = [], tamamlananSlotlar = [];
    try {
      for (const el of document.querySelectorAll('.gDogru')) {
        const soruEl = el.parentElement.querySelector('.gSoru');
        const soru = Number(soruEl.value);
        let dogru = el.value === '' ? null : Number(el.value);
        if (dogru === null && t.id === 'hepsiIyi' && +el.dataset.gun <= bugunNo())
          dogru = Math.round(soru * (D.ayar.esik[1] + D.ayar.esik[2]) / 200);
        if (dogru === null) continue;
        const temiz = sonucKaydiDogrula(EK.ogr, { ki: +el.dataset.ki, gun: +el.dataset.gun, dogru: dogru, soru: soru });
        kayitlar.push(temiz);
        if (el.dataset.slot !== undefined)
          tamamlananSlotlar.push({ slot: el.dataset.slot, gun: temiz.gun });
      }
      for (const el of document.querySelectorAll('.gAnlatim:checked')) {
        const ki = +el.dataset.ki, gun = +el.dataset.gun;
        if (!Number.isInteger(ki) || ki < 0 || ki >= konuSayisi() || !konuAl(ki))
          throw new Error('Konu anlatımında geçersiz konu numarası var.');
        if (!Number.isInteger(gun) || gun > bugunNo() || gun >= gunNo(D.ayar.sinav))
          throw new Error('Konu anlatımı yalnızca bugün veya geçmiş geçerli bir gün için işaretlenebilir.');
        anlatimlar.push({ ki: ki, gun: gun });
      }
    } catch (e) { alert(e.message || e); return; }
    if (!kayitlar.length && !anlatimlar.length) { alert('Hiç doğru sayısı girilmemiş.'); return; }
    // Görünen plan hücresine sonuç girilmesi, bu planın gerçekten kullanıldığının
    // kesin kanıtıdır. FSRS kartları değişmeden önce haftayı anlık görüntü olarak sakla.
    if (tamamlananSlotlar.length) {
      const gorunenHb = haftaBasi(), ov = elleAl(EK.ogr, gorunenHb, false);
      if (!ov.sabit) haftayiKullanimaAl(EK.ogr, gorunenHb);
    }
    try { if (kayitlar.length) sonucIsle(EK.ogr, kayitlar); }
    catch (e) { alert(e.message || e); return; }
    tamamlananSlotlar.forEach(x => planSlotSonuclandi(EK.ogr, pazartesi(x.gun), x.slot));
    anlatimlar.forEach(x => anlatimTamam(EK.ogr, x.ki, x.gun));
    const anlSay = anlatimlar.length;
    if (!kayitlar.length) {
      await kaydet(true); ciz();
      bilgiVer(anlSay + ' konu anlatımı işaretlendi; ilk testleri ' + D.ayar.ilk + ' gün sonrasına yazıldı.');
      return;
    }
    const hb = haftaBasi();
    await kaydet(true);
    EK.hafta = hb + 7;          // sonuç girildi -> gelecek haftanın planı hazır
    EK.sekme = 'plan';
    ciz();
    return;
  }
  if (t.id === 'yeniKonu') {
    D.ekKonular = D.ekKonular || [];
    D.ekKonular.push([EK.ders === undefined ? 0 : EK.ders, 12, 'Kendi eklediğim konular', 'Yeni konu', 0, '']);
    await kaydet(true); ciz(); return;
  }
  if (t.id === 'bugunIsle') {
    const g = bugunNo(); let n = 0;
    document.querySelectorAll('.konuSec:checked').forEach(c => { D.islenis[+c.dataset.ki] = g; n++; });
    if (!n) { alert('Önce soldaki kutucuklardan konu seçin.'); return; }
    await kaydet(true); ciz(); return;
  }
  if (t.id === 'ayarKaydet') {
    const planBasi = document.getElementById('aPlan').value;
    const sinav = document.getElementById('aSinav').value;
    const oku = (id, min, max, tam) => {
      const n = Number(document.getElementById(id).value);
      if (!Number.isFinite(n) || n < min || n > max || (tam && !Number.isInteger(n)))
        throw new Error(id + ' alanı ' + min + '–' + max + ' arasında' + (tam ? ' tam sayı' : '') + ' olmalı.');
      return n;
    };
    let yeni;
    try {
      if (!isoTarihGecerli(planBasi) || !isoTarihGecerli(sinav)) throw new Error('Program başlangıcı ve YKS tarihi geçerli olmalı.');
      if (gunNo(planBasi) >= gunNo(sinav)) throw new Error('Program başlangıcı YKS tarihinden önce olmalı.');
      const esik = document.getElementById('aEsik').value.split(/[,;\s]+/).filter(Boolean).map(Number).sort((a, b) => a - b);
      if (esik.length !== 3 || esik.some(x => !Number.isFinite(x) || x <= 0 || x >= 100) ||
          !(esik[0] < esik[1] && esik[1] < esik[2])) throw new Error('Not eşikleri artan üç sayı olmalı; örn. 50, 70, 90.');
      yeni = {
        planBasi: planBasi, sinav: sinav,
        hedef: oku('aHedef', 0.80, 0.95, false), maks: oku('aMaks', 7, 365, true),
        ilk: oku('aIlk', 0, 7, true), relearn: oku('aRel', 1, 7, true),
        soru: oku('aSoru', 1, 60, true), telafiGunKap: oku('aTelafiKap', 1, 12, true),
        gecmisSerbest: document.getElementById('aGecmis').checked,
        tekEsik: oku('aTek', 0.70, 0.90, false), genisEsik: oku('aGenis', 2, 10, true), esik: esik
      };
      const ilr = document.getElementById('aIleri');
      if (ilr) yeni.ileriHafta = Math.max(0, Math.min(300, Number(ilr.value) || 0));
      const testEl = GELISTIRME_MODU ? document.getElementById('aTestTarih') : null;
      yeni.testTarih = testEl && testEl.value ? testEl.value : null;
      if (yeni.testTarih && !isoTarihGecerli(yeni.testTarih)) throw new Error('Test tarihi geçersiz.');
    } catch (e) { alert(e.message || e); return; }
    Object.assign(D.ayar, yeni);
    EK.hafta = null;
    await kaydet(true); ciz(); return;
  }
  if (t.id === 'testTarihSifirla') {
    D.ayar.testTarih = null;
    EK.hafta = null;
    await kaydet(true); ciz(); return;
  }
  if (t.dataset && t.dataset.kaydirtakvim !== undefined) {
    const n = +t.dataset.kaydirtakvim;
    if (!confirm('Bütün takvim ' + Math.abs(n) + ' hafta ' + (n > 0 ? 'ileri' : 'geri') +
                 ' kaydırılacak. Devam?')) return;
    takvimiKaydir(n);
    EK.hafta = null;
    await kaydet(true); ciz();
    bilgiVer('Takvim ' + Math.abs(n) + ' hafta ' + (n > 0 ? 'ileri' : 'geri') + ' kaydırıldı.');
    return;
  }
  if (t.id === 'sonucGonder') {
    const pk = sonucPaketi();
    if (!pk.kayit.length) { alert('Dışa aktarılacak sonuç yok. Önce “Sonuç gir” sekmesinden doğru sayılarınızı girin.'); return; }
    const o = D.ogr[0] || {};
    const tamam = await indir('sonuc-' + dosyaAdiParcasi(o.no, 'ogrenci') + '-' +
      isoDan(bugunNo()) + '.yks.json', JSON.stringify(pk), 'json');
    if (!tamam) { bilgiVer('Dosya oluşturulmadı; sonuçlar gönderilmemiş olarak kaldı.'); return; }
    bilgiVer(pk.kayit.length + ' güncel sonuç dışa aktarıldı. Dosyayı rehber öğretmeninize gönderin.');
    return;
  }
  if (t.id === 'yedekIndir') { await indir('yks-tekrar-yedek-' + isoDan(bugunNo()) + '.json', JSON.stringify(D), 'json'); return; }
  if (t.id === 'sifirla') {
    if (!confirm('Bütün sonuçlar, işleniş tarihleri ve öğrenci ayarları silinecek. Emin misiniz?')) return;
    D = varsayilan(); await kaydet(true); ciz(); return;
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'pAra' && PENCERE) { PENCERE.arama = ev.target.value; pencereCiz(); }
});

document.addEventListener('change', async ev => {
  const el = ev.target;
  if ((el.id === 'pSoru' || el.id === 'pAd') && PENCERE) {
    const hb = haftaBasi(), p = planHesapla(EK.ogr, hb);
    const x = p.gunler[PENCERE.g][PENCERE.s];
    if (x) {
      const ov = elleAl(EK.ogr, hb, true);
      if (x.serbest) {
        ov.serbest = ov.serbest || {};
        const kayit = ov.serbest[x.ki] || { ad: x.ad, ders: x.dersAd, soru: x.soru };
        if (el.id === 'pAd') kayit.ad = (el.value || '').trim() || kayit.ad;
        else kayit.soru = Math.max(1, Math.min(200, +el.value || D.ayar.soru));
        ov.serbest[x.ki] = kayit;
      } else {
      ov.soru = ov.soru || {};
      ov.soru[planSlotAnahtari(x)] = Math.max(1, Math.min(200, +el.value || D.ayar.soru));
      }
      await kaydet(true); ciz(); PENCERE.odak = false; pencereCiz();
    }
    return;
  }
  if ((el.id === 'pSerbestAd' || el.id === 'pSerbestDers' || el.id === 'pSerbestSoru') && PENCERE) {
    PENCERE.yaziAd = (document.getElementById('pSerbestAd') || {}).value || '';
    PENCERE.yaziDers = (document.getElementById('pSerbestDers') || {}).value || '';
    PENCERE.yaziSoru = Math.max(1, Math.min(200, +((document.getElementById('pSerbestSoru') || {}).value) || 20));
    return;
  }
  if (el.id === 'pSerbestAnlatim' && PENCERE) {
    PENCERE.yaziAnlatim = el.checked;
    PENCERE.odak = false; pencereCiz();
    return;
  }
  if (el.id === 'pKaynak' && PENCERE) { PENCERE.kaynak = el.value; PENCERE.odak = false; return; }
  if (el.id === 'ogrSec') { EK.ogr = +el.value; EK.girisAcik = {}; EK.haritaAcik = null; EK.haritaOnay = null; ciz(); return; }
  if (el.id === 'dersSec') { EK.ders = +el.value; ciz(); return; }
  if (el.classList.contains('ekKonuAd')) {
    const k = konuAl(+el.dataset.ki);
    if (k) k[3] = el.value.trim() || k[3];
    await kaydet(true); return;
  }
  if (el.classList.contains('isleniTarih')) {
    const ki = +el.dataset.ki;
    if (el.value) D.islenis[ki] = gunNo(el.value); else delete D.islenis[ki];
    await kaydet(true); return;
  }
  if (el.classList.contains('oAktif')) {
    const o2 = D.ogr[+el.dataset.i];
    o2.aktif = el.checked;
    if (el.checked && !o2.cikti) o2.cikti = bugunNo();
    if (el.checked && !o2.ilkAktif) o2.ilkAktif = bugunNo();
    await kaydet(true); ciz(); return;
  }
  if (el.id === 'ciktiVerildi') {
    const o2 = D.ogr[EK.ogr];
    if (el.checked) haftayiKullanimaAl(EK.ogr, haftaBasi());
    else o2.aktif = false;
    await kaydet(true); ciz();
    bilgiVer(el.checked ? o2.ad + ' “kullanıyor” listesine eklendi.' : o2.ad + ' listeden çıkarıldı.');
    return;
  }
  if (el.classList.contains('oKap')) { D.ogr[+el.dataset.i].kap = Math.max(1, Math.min(12, +el.value || 6)); await kaydet(true); ciz(); return; }
  if (el.classList.contains('oAlan')) { D.ogr[+el.dataset.i].alan = el.value; await kaydet(true); ciz(); return; }
  if (el.classList.contains('oAd')) {
    const ad = el.value.trim();
    if (!ad || ad.length > 120) { alert('Öğrenci adı 1–120 karakter olmalı.'); ciz(); return; }
    D.ogr[+el.dataset.i].ad = ad; await kaydet(true); return;
  }
  if (el.classList.contains('oNo')) {
    const i = +el.dataset.i, no = Number(el.value);
    if (!Number.isInteger(no) || no < 1 || no > 9999) { alert('Öğrenci numarası 1–9999 arasında tam sayı olmalı.'); ciz(); return; }
    if (D.ogr.some((o, j) => j !== i && !o.silindi && String(o.no) === String(no))) {
      alert('Bu öğrenci numarası zaten kullanılıyor.'); ciz(); return;
    }
    D.ogr[i].no = no; await kaydet(true); return;
  }
  if (el.classList.contains('oSube')) { D.ogr[+el.dataset.i].sube = el.value.trim() || D.ogr[+el.dataset.i].sube; await kaydet(true); ciz(); return; }
  if (el.id === 'ySube') {
    const y = document.getElementById('ySubeYeni');
    if (y) { y.style.display = el.value === '__yeni' ? '' : 'none'; if (el.value === '__yeni') y.focus(); }
    return;
  }
  if (el.classList.contains('oHedef')) { D.ogr[+el.dataset.i].hedef = el.value ? +el.value : null; await kaydet(true); ciz(); return; }
  if (el.classList.contains('oTelafiKap')) { D.ogr[+el.dataset.i].telafiGunKap = el.value ? Math.max(1, Math.min(12, +el.value)) : null; await kaydet(true); ciz(); return; }
  if (el.id === 'subeSec') { EK.sube = el.value; ciz(); return; }
  if (el.classList.contains('kpAd')) {
    const sube = EK.sube || (D.ogr[EK.ogr] || {}).sube;
    const anahtar = el.dataset.ders, i = +el.dataset.i;
    const adlar = dersDizisi(sube, anahtar).dizi.map(x => x.ad);
    const yeni = (el.value || '').trim();
    if (!yeni || yeni === adlar[i]) { ciz(); return; }
    adlar[i] = yeni;
    dersDizisiYaz(sube, anahtar, adlar);
    programDegistiTetikle(sube);
    EK.kirli = true; await kaydet(true); ciz();
    return;
  }
  if (el.id === 'donemBasi') {
    if (!isoTarihGecerli(el.value)) { alert('Dönem başlangıcı geçerli bir tarih olmalı.'); ciz(); return; }
    donemBasiniAyarla(isoDan(pazartesi(gunNo(el.value))), true);   // her zaman o haftanın Pazartesi'sine yuvarla
    await kaydet(true); ciz(); return;
  }
  if (el.id === 'haftaSec') {
    donemBasiniAyarla(isoDan(haftaBasi() - (+el.value - 1) * 7), true);
    await kaydet(true); ciz();
    bilgiVer('Bu hafta artık ' + el.value + '. hafta sayılıyor (dönem başı ' + ggyy(gunNo(D.ayar.donemBasi)) + ').');
    return;
  }
  if (el.classList.contains('konuAta')) {
    if (el.value) {
      const k = hucreyeKonuAta(EK.sube, haftaBasi(), +el.dataset.g, el.dataset.d, el.value);
      await kaydet(true); ciz();
      if (k) bilgiVer('“' + k.konu + '” ' + k.eski + '. haftadan ' + k.yeni + '. haftaya alındı; ' +
        el.dataset.d + ' dersinin kalan konuları ' + Math.abs(k.kayma) + ' hafta ' +
        (k.kayma > 0 ? 'ileri' : 'geri') + ' kaydı.');
      else bilgiVer('Konu bu güne yazıldı.');
    }
    return;
  }
  if (el.classList.contains('progHucre')) {
    const hb2 = haftaBasi();
    const pk2 = programAl(EK.sube, hb2);
    const p = pk2.tam ? pk2.prog : JSON.parse(JSON.stringify(pk2.prog));   // devralınan programı kopyalayıp bu haftaya yaz
    const g = +el.dataset.g;
    p.gunler[g] = p.gunler[g] || [];
    el.dataset.s.split(',').forEach(x => { p.gunler[g][+x] = el.value; });
    programYaz(EK.sube, hb2, p);
    programDegistiTetikle(EK.sube);
    await kaydet(true); ciz(); return;
  }
  if ((el.id === 'paketYukle' || el.id === 'kurYedek') && el.files && el.files[0]) {
    const bilgi = await metindenYukle(await el.files[0].text());
    if (bilgi) bilgiVer(bilgi);
    return;
  }
  if (el.id === 'sonucYukle' && el.files && el.files.length) {
    const rapor = [];
    for (const f of el.files) {
      try { rapor.push(sonucPaketiUygula(JSON.parse(await f.text()))); }
      catch (e) { rapor.push({ hata: f.name + ': ' + (e.message || e) }); }
    }
    await kaydet(true); ciz();
    bilgiVer(rapor.map(r => r.hata ? r.hata : r.ad + ': ' + r.eklenen + ' yeni sonuç' +
      (r.atlanan ? ' (' + r.atlanan + ' zaten vardı)' : '')).join(' · '));
    return;
  }
  if (el.id === 'yedekYukle' && el.files && el.files[0]) {
    const metin = await el.files[0].text();
    const onceki = D;
    try {
      const y = JSON.parse(metin);
      yedekDogrula(y);
      if (!confirm('Yedekteki veriler mevcut verilerin yerine geçecek. Devam?')) return;
      veriyiHazirla(y); await kaydet(true); ciz();
    } catch (e) { D = onceki; alert('Bu dosya yüklenemedi: ' + (e.message || e)); }
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && PENCERE) {
    ev.preventDefault();
    PENCERE = null;
    pencereCiz();
    return;
  }
  if (PENCERE && ev.key === 'Tab') {
    const pencere = document.querySelector('.pencere');
    if (!pencere) return;
    const odaklanabilir = Array.from(pencere.querySelectorAll(
      'button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )).filter(el => !el.hidden && el.getClientRects().length > 0);
    if (!odaklanabilir.length) { ev.preventDefault(); return; }
    const ilk = odaklanabilir[0], son = odaklanabilir[odaklanabilir.length - 1];
    if (!pencere.contains(document.activeElement)) {
      ev.preventDefault();
      ilk.focus();
    } else if (ev.shiftKey && document.activeElement === ilk) {
      ev.preventDefault();
      son.focus();
    } else if (!ev.shiftKey && document.activeElement === son) {
      ev.preventDefault();
      ilk.focus();
    }
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.closest) {
    const hucre = ev.target.closest('[data-hucre][role="button"]');
    const denetim = ev.target.closest('button,input,select,textarea,a');
    if (hucre && !denetim) {
      ev.preventDefault();
      hucre.click();
    }
  }
});

// --- sürükle & bırak
let SURUKLE = null;
document.addEventListener('dragstart', ev => {
  const td = ev.target.closest('td.dolu[data-hucre]');
  if (!td) return;
  SURUKLE = { g: +td.dataset.g, s: +td.dataset.s };
  td.classList.add('suruklenen');
  if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', 'kutu'); }
});
document.addEventListener('dragend', ev => {
  document.querySelectorAll('.suruklenen,.hedef').forEach(e => e.classList.remove('suruklenen', 'hedef'));
  SURUKLE = null;
});
document.addEventListener('dragover', ev => {
  const td = ev.target.closest('td[data-hucre]');
  if (!td || !SURUKLE) return;
  ev.preventDefault();
  if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.hedef').forEach(e => e.classList.remove('hedef'));
  td.classList.add('hedef');
});
document.addEventListener('drop', async ev => {
  const td = ev.target.closest('td[data-hucre]');
  if (!td || !SURUKLE) return;
  ev.preventDefault();
  const hedef = { g: +td.dataset.g, s: +td.dataset.s };
  const kaynak = SURUKLE;
  SURUKLE = null;
  document.querySelectorAll('.suruklenen,.hedef').forEach(e => e.classList.remove('suruklenen', 'hedef'));
  if (kaynak.g === hedef.g && kaynak.s === hedef.s) return;
  if (tasi(EK.ogr, haftaBasi(), kaynak, hedef)) { await kaydet(true); ciz(); }
});

// ---------------------------------------------------------------- başlangıç
(async function () {
  try {
    const s = sessionStorage.getItem('yks_ek');
    if (s) { const y = JSON.parse(s); EK.sekme = y.sekme || EK.sekme; EK.ogr = y.ogr || 0; sessionStorage.removeItem('yks_ek'); }
  } catch (e) { /* yok */ }
  EK.hafta = null;                     // uygulama her zaman içinde bulunulan haftayla açılır
  let acilisUyarilari = [];
  try { acilisUyarilari = await durumuYukle(); }
  catch (e) {
    console.error('[YKS Tekrar Defteri] Veri yüklenemedi; temiz başlangıca dönüldü.', e);
    D = null;
    try { veriyiHazirla(varsayilan()); }
    catch (e2) { D = varsayilan(); }
    acilisUyarilari = ['Kayıtlı veri yüklenemedi; hiçbir bozuk veya yarım veri kullanılmadı. Yedeğinizi Ayarlar’dan yeniden yükleyin.'];
  }
  // ders programı ve konu planı hazırsa gelecek haftaları kendiliğinden doldur:
  // aynı işlemi tekrar tekrar yapmak zararsız, çünkü işlenmiş konuya dokunulmuyor
  try {
    const n = ileriHaftaSayisi();
    if (n > 0 && D.rol && Object.keys(D.konuPlani || {}).length &&
        Object.keys(D.dersProgrami || {}).length) {
      const r = ileriDagit(ileriDagitBaslangic(), null, n);
      if (r.eklenen) { EK.kirli = true; await kaydet(true); }
    }
  } catch (e) { /* dağıtım başarısızsa uygulama yine de açılsın */ }
  ciz();
  if (acilisUyarilari && acilisUyarilari.length)
    bilgiVer(acilisUyarilari.length + ' veri tutarsızlığı bulundu — ayrıntı için tarayıcı konsoluna bakın.');
  yetenek('downloads'); yetenek('artifact');   // önbelleği ısıt: yazdır tıklaması beklemesin
})();
