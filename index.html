        'önemli değilse de öyle işaretlenip geçilebilir. ' +
        '<button class="dugme birincil" data-haritaGit="' + atlanan[0] + '">' + ggyy(atlanan[0]) + ' haftasını işaretle</button>' +
        (atlanan.length > 1 ? ' <span class="mini">· toplam ' + atlanan.length + ' hafta bekliyor</span>' : '') + '</div>'
      : '') +
    // Dönem başı ile öğrencinin fiilen katıldığı hafta arasında haftalar varsa (geç
    // başlangıç), bunu Haftalar Haritası hiç göstermez (o haftalar "henüz katılmamıştı"
    // sayılır) — burada isteğe bağlı bir tek seferlik "getir" düğmesiyle telafi edilebilir.
    (katilmadanOnceki > 0
      ? '<div class="uyari-serit"><b>Programa ' + katilmadanOnceki + ' hafta sonra katılmışsın.</b> ' +
        'Dönem başından beri işlenmiş ama sana hiç yazılmamış konular var. İstersen bunları plana ekleyebilirsin; ' +
        'bu konular daha önce işlendiği için unutulma riski daha yüksek sayılır ve bu haftaki bazı konulardan ' +
        '<b>önce</b> sıraya girebilir — sığan kadarı bu haftaya, sığmayanlar sonraki haftalara yayılır, mevcut ' +
        'planındaki konular kaybolmaz, sırası değişebilir. ' +
        '<button class="dugme birincil" id="katilmadanOnceGetir">Geçmiş konuları getir</button></div>'
      : '') +
    (o.aktif === false && !ogrenciMi() ? '<div class="uyari-serit">Bu öğrenciye programı henüz vermediniz; ' +
      'şube veya sınıf geneli eklemelerde ve toplu çıktıda atlanır. Çıktıyı verince yandaki ' +
      '<b>“çıktı verildi”</b> kutusunu işaretleyin. Yazdırma yalnızca belgeyi oluşturur; teslim edildiğini varsaymaz.</div>' : '') +
    '<div class="baslik"><h1>Haftalık plan</h1><p>' + kacis(o.alan) + ' · ' + kacis(o.sube) +
    ' · günde ' + (o.kap || 6) + ' konu testi · tatil ' + (o.tatil >= 0 ? GUN_AD[o.tatil].toLowerCase() : 'yok') +
    ' · hedef tutma %' + Math.round((o.hedef || D.ayar.hedef) * 100) + '</p>' +
    (ogrenciMi() ? '<p class="mini">Her hafta haftalık programınızı ' +
      '<a href="mailto:sahinbilir.rehberlik@gmail.com">sahinbilir.rehberlik@gmail.com</a> e posta olarak gönderin. ' +
      'Ayrıca eğer geçen hafta ders çalışmakta zorluk hissettiyseniz bunun hakkında kısa bir paragraf yazın.</p>' : '') +
    '</div>' +
    '<div class="arac">' + (ogrenciMi() ? '' : ogrSecici()) + haftaSecici() +
    (ogrenciMi() ? '' :
      '<label class="dugme ciktiEtiket' + (o.aktif !== false ? ' secili' : '') + '" title="İşaretlediğinizde öğrenci “kullanıyor” listesine girer">' +
      '<input type="checkbox" id="ciktiVerildi"' + (o.aktif !== false ? ' checked' : '') + '> çıktı verildi' +
      (o.cikti ? ' <span class="mini">· son çıktı ' + ggyy(o.cikti) + '</span>' : '') +
      (o.ilkAktif ? ' <span class="mini" title="Bu öğrenci ilk kez aktifleştirildiğinde kaydedilir, değişmez">· ilk aktif ' +
        ggyy(o.ilkAktif) + '</span>' : '') + '</label>') +
    '<span style="flex:1"></span>' +
    '<button class="dugme birincil" id="yazdir">Yazdır / PDF</button>' +
    (ogrenciMi() && hb === buHafta() && p.toplam && !(p.elle && p.elle.sabit)
      ? '<button class="dugme" id="planiSabitle" title="Bu haftayı kullanıma al; sonraki değişiklikler eski planı değiştirmesin">Planı kullanmaya başla</button>'
      : '') +
    '<button class="dugme" id="yazdirOnizle" title="Hiçbir şeyi kaydetmez ya da sabitlemez — yalnızca şu an ' +

      '<button class="dugme" data-yazdirSube="' + kacis(o.sube) + '">' + kacis(o.sube) + ' şubesi (' +

      '<button class="dugme" id="topluSil">Toplu sil</button>' +
      '<button class="dugme" id="csv">Excel (CSV)</button>') +

      ? '<button class="dugme" id="elleSifirla">Elle düzeni sıfırla</button>' : '') + '</div>' +
    '<div class="mini ozet-gizle" style="margin:-6px 0 12px">' +
    (ogrenciMi() ? 'Çözdükçe “Sonuç gir” sekmesinden doğru sayını yaz.'
                 : 'Bir kutuya tıklayıp konu arayabilir, soru sayısını yazabilir, ' +
                   'kutuları sürükleyerek başka güne taşıyabilirsiniz.') +
    (ilkGun(hb) > hb ? ' <span class="bugunSerit">· Bugün <b>' + GUN_AD[haftaGunu(bugunNo())] + ' ' + ggyy(bugunNo()) +

    (EK.toplu ? '<div class="uyari-serit">Düzenlemek/kaldırmak istediğiniz kutuları işaretleyin. ' +
      '<button class="dugme" id="topluHepsi">Hepsini seç</button> ' +
      '<button class="dugme" id="topluYariya">Seçilenlerin soru sayısını yarıya indir</button> ' +
      '<button class="dugme birincil" id="topluUygula">Seçilenleri kaldır</button></div>' : '') +
    planTablosu(si, hb, p) +
    '<div id="tumu"></div>';
}

function gorunumGiris() {
  const si = EK.ogr, hb = haftaBasi(), p = planHesapla(si, hb);
  let h = '<div class="baslik"><h1>Sonuç girişi</h1><p>Öğrencinin bu hafta çözdüğü testlerin doğru sayısını girin. ' +
    'Öğrenci çözemediyse doğru sayısı yerine <b>“yapamadı”</b> deyin — konu sonuç yazılmadan ' +
    'en yakın uygun güne taşınır, algoritma hakkında karar vermez.</p></div>' +
    '<div class="arac">' + ogrSecici() + haftaSecici() + '</div>';
  const bek = p.bekleyen || [];
  if (!p.toplam && !bek.length)
    return h + '<div class="uyari-serit">Bu hafta bu öğrenci için planlanmış konu yok.</div>';
  h += '<div class="kart" style="padding:16px 18px">';
  if (bek.length) {
    h += '<div class="gun-basi">Önceki haftalardan — sonucu girilmedi</div>';
    bek.forEach(x => {
      const genis = genisKonu(x.ki);
      h += '<div class="giris-satir"><span class="gun">' + kacis(konuDersAdi(x.ki)) + '</span>' +
        '<span>' + kacis(konuAl(x.ki)[3]) +
        ' <span class="mini">· ' + ggyy(x.due) + ' tarihli çıktıda</span>' +
        (genis ? '<div class="altUyari" data-ki="' + x.ki + '">' +
          '<b>' + kazanimSayisi(x.ki) + ' alt başlık.</b> Yanlışlar tek bir alt başlıkta toplanıyorsa ' +
          'o başlığı ayrı konu olarak açın.' +
          '<button class="dugme altKonuAc" data-ki="' + x.ki + '">Alt konu aç</button></div>' : '') +
        '</span>' +
        '<input type="number" min="0" max="199" placeholder="doğru" data-ki="' + x.ki + '" data-gun="' + x.due + '" class="gDogru">' +
        '<input type="number" min="1" max="200" value="' + D.ayar.soru + '" class="gSoru">' +
        '<button class="dugme mini erteleDug" data-ki="' + x.ki + '" ' +
        'title="Öğrenci çözemedi — sonuç yazmadan ileri al">yapamadı</button>' +
        '</div>';
    });
    if (p.toplam) h += '<div style="height:10px"></div>';
  }
  for (let g = 0; g < 7; g++) {
    if (!p.gunler[g].length) continue;
    h += '<div class="gun-basi">' + GUN_AD[g] + ' ' + gg(hb + g) + '</div>';
    p.gunler[g].forEach(x => {
      if (x.serbest) {
        h += '<div class="giris-satir"><span class="gun">' + kacis(dersKisaAd(x.dersAd)) + '</span>' +
          '<span>' + kacis(x.ad) + ' <span class="mini">· serbest çalışma, sonuç girilmez</span></span>' +
          '<span class="mini" style="text-align:center">' + x.soru + (x.birim === 'dakika' ? ' dakika' : ' soru') + '</span><span></span></div>';
        return;
      }
      if (x.anlatim) {
        const anlatimGunu = hb + g, anlatimGelecek = anlatimGunu > bugunNo();
        h += '<div class="giris-satir"><span class="gun">' + kacis(dersKisaAd(x.dersAd)) + '</span>' +
          '<span>' + kacis(x.ad) + ' <span class="mini">· konu anlatımı' +
          (x.kaynak ? ' (' + kacis(x.kaynak) + ')' : '') + '</span></span>' +
          '<label class="mini" style="grid-column:span 2;display:flex;align-items:center;gap:7px">' +
          '<input type="checkbox" class="gAnlatim" data-ki="' + x.ki + '" data-gun="' + anlatimGunu + '"' +
          (anlatimGelecek ? ' disabled' : '') + '>' +
          (anlatimGelecek ? 'bu gün henüz gelmedi' : 'anlatıldı / izledi — ilk test ' + D.ayar.ilk + ' gün sonra gelsin') +
          '</label></div>';
        return;
      }
      const genis = !x.serbest && genisKonu(x.ki);
      const gun = hb + g;
      // bu satırın TAM OLARAK bu gün için bir sonuç kaydı var mı? (sabitlenmiş olsun olmasın çalışır —
      // kartın "son" tarihine değil, o güne ait gerçek log kaydına bakar; aynı haftaya düşen yeni bir
      // tekrar farklı bir günde oturduğu için kendi günü boş kaldıkça hep düzenlenebilir kalır)
      const sonKayit = (D.log || []).filter(l => l[1] === si && l[2] === x.ki && l[0] === gun).slice(-1)[0];
      const cevaplandi = !!sonKayit;
      const girisAnahtari = x.ki + ':' + gun;
      if (cevaplandi && !EK.girisAcik[girisAnahtari]) {
        h += '<div class="giris-satir giris-kilitli"><span class="gun">' + kacis(dersKisaAd(x.dersAd)) + '</span>' +
          '<span>' + kacis(x.ad) + '</span>' +
          '<span class="mini" style="text-align:center">✓ cevaplandı · ' + sonKayit[3] + '/' + sonKayit[4] + '</span>' +
          '<button class="dugme" data-girisduzenle="1" data-ki="' + x.ki + '" data-gun="' + gun + '">Düzenle</button></div>';
        return;
      }
      h += '<div class="giris-satir"><span class="gun">' + kacis(dersKisaAd(x.dersAd)) + '</span>' +
        '<span>' + kacis(x.ad) +
        (x.kart ? ' <span class="mini">· önceki %' + x.kart.y + '</span>' : '') +
        (x.test > 1 ? ' <span class="rozet">' + x.test + ' test</span>' : '') +
        (genis ? '<div class="altUyari" data-ki="' + x.ki + '">' +
          '<b>' + kazanimSayisi(x.ki) + ' alt başlık.</b> Yanlışlar tek bir alt başlıkta toplanıyorsa ' +
          'o başlığı ayrı konu olarak açın; algoritma onu daha zor ve daha sık görülecek şekilde takip eder.' +
          '<button class="dugme altKonuAc" data-ki="' + x.ki + '">Alt konu aç</button></div>' : '') +
        '</span>' +
        '<input type="number" min="0" max="200" placeholder="doğru" data-ki="' + x.ki + '" data-gun="' + (hb + g) +
        '" data-slot="' + kacis(planSlotAnahtari(x)) + '" class="gDogru"' +
        (sonKayit ? ' value="' + sonKayit[3] + '"' : '') + '>' +
        '<input type="number" min="1" max="200" value="' + (sonKayit ? sonKayit[4] : (x.soru || D.ayar.soru)) + '" class="gSoru">' +
        (x.serbest ? '<span></span>' :
          '<button class="dugme mini erteleDug" data-ki="' + x.ki + '" ' +
          'title="Öğrenci çözemedi — sonuç yazmadan ileri al">yapamadı</button>') +
        '</div>';
    });
  }
  h += '<div style="display:flex;gap:10px;margin-top:16px"><button class="dugme birincil" id="sonucKaydet">Sonuçları kaydet</button>' +
    '<button class="dugme" id="hepsiIyi">Boşları “çözüldü, %' + Math.round((D.ayar.esik[1] + D.ayar.esik[2]) / 2) + '” say</button></div></div>';
  return h;
}

function gorunumKonular() {
  const hb = haftaBasi();
  const secDers = EK.ders === undefined ? 0 : EK.ders;
  const hepsi = [];
  for (let i = 0; i < konuSayisi(); i++) { const k = konuAl(i); if (k && !k[6]) hepsi.push({ k: k, i: i, kendi: i >= KATALOG.length }); }
  const satirlar = hepsi.filter(x => x.k[0] === secDers).sort((a, b) => (b.kendi ? 1 : 0) - (a.kendi ? 1 : 0));
  let h = '<div class="baslik"><h1>Konular</h1><p>İşlediğiniz konunun tarihini girin; o konu tüm sınıfın planına girer. ' +
    'ÖSYM 2026 kazanım listesinden çıkarılmış ' + KATALOG.length + ' konu' +
    ((D.ekKonular || []).length ? ' + kendi eklediğiniz ' + D.ekKonular.filter(k => !k[6]).length + ' konu' : '') + '.</p></div>' +
    '<div class="arac"><select id="dersSec">' + DERS.map((d, i) =>
      '<option value="' + i + '"' + (i === secDers ? ' selected' : '') + '>' + d + '</option>').join('') + '</select>' +
    '<button class="dugme" id="bugunIsle">Seçilenleri ' + ggyy(bugunNo()) + ' olarak işaretle</button>' +
    '<button class="dugme" id="yeniKonu">Bu derse yeni konu ekle</button></div>' +
    '<div class="kart sarma"><table><thead><tr><th style="width:26px"></th><th>Ünite</th><th>Konu</th><th>Sınıf</th>' +
    '<th>Kapsam</th><th>İşleniş tarihi</th><th class="sayisal">Sınıf ort.</th></tr></thead><tbody>';
  satirlar.forEach(x => {
    const t = D.islenis[x.i];
    const kayitlar = D.log.filter(l => l[2] === x.i);
    const ort = kayitlar.length ? Math.round(kayitlar.reduce((a, l) => a + l[3] / l[4], 0) / kayitlar.length * 100) : null;
    h += '<tr><td><input type="checkbox" class="konuSec" data-ki="' + x.i + '"></td>' +
      '<td class="mini">' + kacis(x.k[2]) + '</td><td>' +
      (x.kendi ? '<input class="ekKonuAd" data-ki="' + x.i + '" value="' + kacis(x.k[3]) + '" style="width:100%">' +
                 '<button class="ekKonuSil dugme" data-ki="' + x.i + '" style="padding:2px 7px;margin-top:4px">kaldır</button>'
               : kacis(x.k[3])) + '</td>' +
      '<td class="sayisal">' + (x.k[1] || '') + '</td>' +
      '<td><span class="rozet">' + (x.k[4] ? 'AYT' : 'TYT') + '</span></td>' +
      '<td><input type="date" class="isleniTarih" data-ki="' + x.i + '" value="' + (t ? isoDan(t) : '') + '"></td>' +
      '<td class="sayisal">' + (ort === null ? '—' : '%' + ort) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

// --- konu planı: derse göre, tüm dönem boyunca sıralı konu listesi — görüp elle düzeltmek için
function gorunumKonuPlani() {
  const subeler = ogrenciMi() ? [(D.ogr[EK.ogr] || {}).sube || 'benim'] : subeListesi();
  const sube = EK.sube && subeler.indexOf(EK.sube) >= 0 ? EK.sube : (subeler[0] || '');
  EK.sube = sube;
  let h = '<div class="baslik"><h1>Konu Planı</h1><p>Her dersin konuları, işleneceği sıraya göre. ' +
    'Sıra değiştirmek, yeniden adlandırmak, silmek ya da yeni konu eklemek için satırları kullanın — ' +
    'değişiklik gelecek haftaların planına hemen yansır; sonucu girilmiş konulara dokunulmaz.</p></div>';
  if (!sube) return h + '<div class="uyari-serit">Önce bir ders programı / konu planı yüklenmeli.</div>';
  h += '<div class="arac">' + (ogrenciMi() ? '' :
    '<select id="subeSec">' + subeler.map(s2 => '<option' + (s2 === sube ? ' selected' : '') + '>' + kacis(s2) + '</option>').join('') + '</select>') +
    '<span class="mini">' + kacis(sube) + ' — alanına göre gelen varsayılan plan; okulunuzun hızına göre düzenleyin.</span></div>';
  const dersler = konuPlaniDersleri(sube);
  if (!dersler.length) return h + '<div class="uyari-serit">Bu şube için henüz konu planı yok.</div>';
  dersler.forEach(anahtar => {
    const d = dersDizisi(sube, anahtar);
    h += '<div class="kart" style="padding:14px 16px;margin-bottom:16px"><div class="etiket">' +
      kacis(anahtar) + ' · ' + d.dizi.length + ' konu</div>' +
      '<div class="sarma"><table><tbody>';
    d.dizi.forEach((x, i) => {
      h += '<tr><td class="sayisal mini" style="width:34px">' + (i + 1) + '</td>' +
        '<td><input type="text" class="kpAd" data-ders="' + kacis(anahtar) + '" data-i="' + i +
        '" value="' + kacis(x.ad) + '" style="width:100%"></td>' +
        '<td class="mini sayisal" style="width:60px">' + x.hafta + '. hf</td>' +
        '<td style="white-space:nowrap;width:1%">' +
        '<button class="dugme mini kpYukari" data-ders="' + kacis(anahtar) + '" data-i="' + i + '"' +
        (i === 0 ? ' disabled' : '') + ' title="Yukarı taşı">▲</button> ' +
        '<button class="dugme mini kpAsagi" data-ders="' + kacis(anahtar) + '" data-i="' + i + '"' +
        (i === d.dizi.length - 1 ? ' disabled' : '') + ' title="Aşağı taşı">▼</button> ' +
        '<button class="dugme mini kpSil" data-ders="' + kacis(anahtar) + '" data-i="' + i + '" title="Sil">sil</button>' +
        '</td></tr>';
    });
    h += '</tbody></table></div>' +
      '<div class="arac" style="margin-top:10px">' +
      '<input type="text" class="kpYeniAd" data-ders="' + kacis(anahtar) + '" placeholder="Yeni konu adı" style="flex:1;min-width:180px">' +
      '<button class="dugme kpEkle" data-ders="' + kacis(anahtar) + '">+ konu ekle</button></div></div>';
  });
  return h;
}

    '<div class="arac" style="margin-bottom:12px">' +
    '<input id="yAd" placeholder="Ad Soyad" style="min-width:210px">' +
    '<input id="yNo" type="number" min="1" max="9999" placeholder="No" style="width:82px">' +

// bir haftanın Haftalar Haritası'ndaki durumunu hesaplar — haritanın kendisi ve haftalık
// plan ekranındaki proaktif uyarı (bkz. atlananHaftalar) aynı mantığı burada paylaşır,
// iki yerde birbirinden kayabilecek iki ayrı kopya olmasın diye.
function haftaHaritaDurumu(si, hb, baslangicHb, bugunHb) {
  const o = D.ogr[si];
  if (hb < baslangicHb) return { durum: 'gelecek', etiket: 'henüz katılmamıştı' };
  if (hb === bugunHb) return { durum: 'simdi', etiket: 'bu hafta' };
  if (hb > bugunHb) return { durum: 'gelecek', etiket: '' };
  const marked = (D.haftaDurum || {})[si + '|' + hb];
  if (marked) {
    // "onemsiz" kendi rengini alır (gri, atlandı); geri kalanı, o haftaya gerçekten
    // konu anlatımı eklenip eklenmediğine göre ayrılır — hangi neden metnine bakmak yerine
    // haftayiTelafiEt'in gerçekte ne yaptığını (marked.konu) kullanmak daha güvenilir.
    const durum = marked.neden === 'onemsiz' ? 'atlandi-onemsiz' : (marked.konu > 0 ? 'telafi-anlatim' : 'telafi');
    return { durum: durum, etiket: HAFTA_NEDEN_ETIKET[marked.neden] || 'telafi edildi' };
  }
  const sonuc = haftaSonucSayisi(si, hb);
  if (sonuc > 0) return { durum: 'tamam', etiket: sonuc + ' sonuç girildi' };
  // O hafta için kâğıt/çıktı verilmediyse (o.cikti o haftadan eskiyse), işlenmemiş
  // konular zaten kendiliğinden bir sonraki haftaya kaymıştır (bkz. sonucBekliyor) —
  // telafi kararı istemenin bir anlamı yok, ekranda zaten hiç "sıkışmış" bir şey yok.
  if (!(o.cikti && o.cikti >= hb)) return { durum: 'gelecek', etiket: 'otomatik ertelendi' };
  return { durum: 'atlandi', etiket: 'sonuç yok' };
}
// öğrenci dönem başından SONRA katıldıysa (programı ilk o zaman verildi), ondan önceki
// haftalar bu öğrenci için hiç var olmadı — "sonuç yok" diye kırmızı işaretlenmesin.
// o.cikti EN SON verilen çıktının tarihidir, her yazdırmada ileri kayar — "ilk katıldığı
// gün" için kullanılamaz (haftalık düzenli çıktı alan bir öğrencide sürekli "bu hafta
// katıldı" gösterirdi). o.ilkAktif bunun için ayrı tutulur, yalnızca İLK aktifleşmede
// yazılır. Yoksa (eski veri / hiç aktifleşmemiş) eski davranış korunur.
const haftaBaslangici = o => o.ilkAktif ? Math.max(pazartesi(gunNo(D.ayar.donemBasi)), pazartesi(o.ilkAktif))
                                        : pazartesi(gunNo(D.ayar.donemBasi));
// "sonuç yok, karar bekliyor" (atlandi) durumundaki haftaları listeler — Haftalar
// Haritası'na hiç gitmeden, haftalık plan ekranından da fark edilsin diye.
function atlananHaftalar(si) {
  const o = D.ogr[si];
  if (!o || !D.ayar.donemBasi) return [];
  const donemHb = pazartesi(gunNo(D.ayar.donemBasi));
  const sinavHb = pazartesi(gunNo(D.ayar.sinav));
  const bugunHb = buHafta();
  if (donemHb > sinavHb) return [];
  const baslangicHb = haftaBaslangici(o);
  const sonuc = [];
  for (let hb = donemHb; hb <= Math.min(bugunHb, sinavHb); hb += 7)
    if (haftaHaritaDurumu(si, hb, baslangicHb, bugunHb).durum === 'atlandi') sonuc.push(hb);
  return sonuc;
}
// dönem başı ile öğrencinin fiilen katıldığı hafta arasında kaç hafta olduğunu söyler
// (0 ise gecikme yok, eklenecek bir şey de yok) — hafif bir kontrol, konu çözümlemesi yapmaz.
function katilmadanOnceHaftaSayisi(si) {
  const o = D.ogr[si];
  if (!o || !D.ayar.donemBasi || o.telafiGecmisYapildi) return 0;
  const donemHb = pazartesi(gunNo(D.ayar.donemBasi));
  return Math.max(0, Math.round((haftaBaslangici(o) - donemHb) / 7));
}
// Öğrenci dönem başından SONRA katıldıysa, arada kalan haftaların konu planındaki
// konularını bu öğrenciye ÖZEL bir "işlendi" kaydı olarak yazar (D.ogrIslenis) —
// şubenin ya da aynı şubedeki diğer öğrencilerin kaydına dokunmadan. Konu adı -> ki
// çözümlemesi ve o haftanın hangi güne düştüğü, programUygula'nın da kullandığı AYNI
// haftaYerlesim/kullaniciKonusu fonksiyonlarıyla yapılır — burada yeni bir eşleştirme
// mantığı yok. Yazılan tarihler geçmişte kalsa da planHesapla bunu zaten olağan yoldan
// işler (işlendikten D.ayar.ilk gün sonra vade); sığmayan konular her zaman olduğu gibi
// sonraki haftalara devreder — kapasiteyi aşmama garantisi planHesapla'nın kendisinden
// gelir, burada ayrıca bir "N haftaya dağıt" mantığı yazılmadı.
function katilmadanOnceIsle(si) {
  const o = D.ogr[si];
  const n = katilmadanOnceHaftaSayisi(si);
  if (!n) return { hafta: 0, konu: 0 };
  const donemHb = pazartesi(gunNo(D.ayar.donemBasi));
  const baslangicHb = haftaBaslangici(o);
  D.ogrIslenis = D.ogrIslenis || {};
  D.ogrIslenis[si] = D.ogrIslenis[si] || {};
  const sayac = { bulundu: 0, yeni: 0 };
  let haftaSayisi = 0, konuSayisi = 0;
  for (let hb = donemHb; hb < baslangicHb; hb += 7) {
    const hafta = planHaftasi(o.sube, hb);
    const yer = haftaYerlesim(o.sube, hafta, hb);
    if (!yer.length) continue;
    let eklendi = 0;
    yer.forEach(y => {
      const ki = kullaniciKonusu(y.dersIdx, y.ad, sayac);
      D.konuDers[ki] = D.konuDers[ki] || y.dersAd;
      if (D.ogrIslenis[si][ki] === undefined) { D.ogrIslenis[si][ki] = hb + y.gi; eklendi++; }
    });
    if (eklendi) { haftaSayisi++; konuSayisi += eklendi; }
  }
  o.telafiGecmisYapildi = true;   // aynı öğrenci için tekrar tekrar önerilmesin
  return { hafta: haftaSayisi, konu: konuSayisi };
}

function gorunumHaritasi() {
  const si = EK.ogr;
  if (si === undefined || !D.ogr[si] || !D.ayar.donemBasi) {
    return '<div class="baslik"><h1>Haftalar Haritası</h1></div><div class="kart">' +
      (D.ogr.length ? 'Önce bir öğrenci seçin.' : 'Önce bir öğrenci ekleyin.') + '</div>';
  }
  const o = D.ogr[si];
  const donemHb = pazartesi(gunNo(D.ayar.donemBasi));
  const sinavG = gunNo(D.ayar.sinav);
  const sinavHb = pazartesi(sinavG);
  const bugunHb = buHafta();
  const baslangicHb = haftaBaslangici(o);
  let h = '<div class="baslik"><h1>Haftalar Haritası</h1><p>' + kacis(o.ad) +
    ' · dönem başından (' + ggyy(donemHb) + ') YKS haftasına kadar. ★ YKS haftası; kırmızı çerçeve o hafta ' +
    'hiç sonuç girilmediğini gösterir, üzerine tıklayıp nasıl geçtiğini işaretleyebilirsiniz.</p></div>' +
    (ogrenciMi() ? '' : '<div class="arac" style="margin-bottom:12px">' + ogrSecici() + '</div>');
  if (donemHb > sinavHb) return h + '<div class="kart">Dönem başı YKS tarihinden sonra görünüyor, Ayarlar’dan kontrol edin.</div>';
  h += '<div class="haritaIzgara">';
  for (let hb = donemHb; hb <= sinavHb; hb += 7) {
    const no = haftaNo(hb);
    const isYks = sinavG >= hb && sinavG <= hb + 6;
    const { durum, etiket } = haftaHaritaDurumu(si, hb, baslangicHb, bugunHb);
    const acilir = durum === 'atlandi';
    h += '<div class="haritaHucre ' + durum + (acilir ? ' tiklanabilir' : '') + '"' +
      (acilir ? ' data-haritaAc="' + hb + '"' : '') + '>' +
      (isYks ? '<span class="haritaYildiz" title="YKS haftası">★</span>' : '') +
      '<div class="haritaNo">' + no + '. hafta</div>' +
      '<div class="haritaTarih">' + ggyy(hb) + '</div>' +
      (etiket ? '<div class="haritaEtiket">' + etiket + '</div>' : '') + '</div>';
    if (EK.haritaAcik === hb) {
      const onay = EK.haritaOnay && EK.haritaOnay.hb === hb ? EK.haritaOnay.neden : null;
      h += '<div class="kart haritaPanel" style="grid-column:1/-1;padding:14px 16px">' +
        '<div class="etiket">' + ggyy(hb) + ' (' + no + '. hafta) nasıl geçti?</div>' +
        (onay
          ? '<p class="mini" style="max-width:70ch;margin:6px 0 12px">' + HAFTA_NEDEN_ACIKLAMA[onay] + '</p>' +
            '<div class="arac">' +
            '<button class="dugme birincil haritaOnayla" data-neden="' + onay + '" data-hb="' + hb + '">Uygula</button>' +
            '<button class="dugme" data-haritaOnayVazgec="1">Geri</button></div>'
          : '<p class="mini" style="max-width:70ch;margin:6px 0 12px">O hafta hiç sonuç girilmemiş. Öğrenci ' +
            'o hafta okula geldi mi, testleri çözdü mü — buna göre telafi ayarlanır: eski haftalardan devreden ' +
            'konuların testi bir hafta ertelenir; o haftanın hiç işlenmemiş yeni konuları ise okula gelinmediyse ' +
            'sonraki haftanın ilk 3 gününe konu anlatımı olarak eklenir.</p>' +
            '<div class="arac">' +
            '<button class="dugme haritaNeden" data-neden="geldi_cozmedi" data-hb="' + hb + '">Okula geldi, test çözmedi</button>' +
            '<button class="dugme haritaNeden" data-neden="gelmedi_cozmedi" data-hb="' + hb + '">Okula gelmedi, test de çözmedi</button>' +
            '<button class="dugme haritaNeden" data-neden="cozdu_gelmedi" data-hb="' + hb + '">Okula gelmedi, testleri çözdü</button>' +
            '<button class="dugme haritaNeden" data-neden="onemsiz" data-hb="' + hb + '" ' +
            'title="Hiçbir şey ertelenmez/eklenmez, sadece karara bağlanmış sayılır">Önemli değildi, atla</button>' +
            '<button class="dugme" data-haritaKapat="1">Vazgeç</button></div>') +
        '</div>';
    }
  }
  h += '</div>';
  return h;
}

function gorunumProgram() {
  // öğrenci tek şubeli ("benim"): henüz hiç program yüklemediyse de kendi şubesi görünür kalmalı,
  // yoksa ilk kurulumda seçilecek şube bulunamaz
  const subeler = ogrenciMi() ? [(D.ogr[EK.ogr] || {}).sube || 'benim']
    : subeListesi().filter(x => (D.dersProgrami || {})[x] || (D.programHafta || {})[x]);
  const sube = EK.sube && subeler.indexOf(EK.sube) >= 0 ? EK.sube : (subeler[0] || '');
  EK.sube = sube;
  const hb = haftaBasi();
  const pk = programAl(sube, hb);
  const prog = pk.prog;
  const haftaSayisi = planHaftaSayisi(sube);
  const hafta = planHaftasi(sube, hb);
  const takvim = haftaNo(hb);
  const plan = ((D.konuPlani || {})[sube] || [])[hafta - 1] || {};
  const secenek = ders => '<option value=""></option>' + okulDersAdlari().filter(d => d !== 'MATEMATİK').map(d =>

    'Konuyu değiştirdiğinizde o dersin kalan konuları da kayar; “dağıt” dediğinizde konular öğrencilerin planına ' +
    D.ayar.ilk + ' gün sonrası ilk test olacak şekilde düşer.</p></div>' +
    '<div class="kart" style="padding:14px 16px;margin-bottom:14px">' +
    '<div class="etiket">Programı AI ile aktar</div>' +
    '<p class="mini" style="max-width:70ch;margin:6px 0 10px">Her okulun ders programı görüntüsü farklı ' +
    'dizayn edildiği için burada otomatik okunmuyor. Bunun yerine: aşağıdaki metni kopyalayın, bir yapay zekâ ' +
    'sohbetine (ör. ChatGPT, Claude, Gemini) ders programınızın fotoğrafıyla birlikte yapıştırın; ' +
    'çıkan JSON çıktısını buraya yapıştırıp “Bu programı kullan” deyin.</p>' +
    '<div class="arac" style="margin-bottom:10px;padding:9px 10px;border:1px solid var(--cizgi);border-radius:8px">' +
    '<span class="mini"><b>Önce</b> kaç hafta ileri doldurulsun</span>' +
    '<input type="number" id="aIleri" min="0" max="300" value="' + ileriHaftaSayisi() + '" style="width:70px"> ' +
    '<button class="dugme mini" id="aIleriYksKadar">YKS’ye kadar (' + haftaSinavaKadar() + ' hafta)</button>' +
    '<span class="mini">— sonra aşağıda “bu programı kullan” dediğinizde o kadar hafta doldurulur.</span></div>' +
    '<div class="arac" style="margin-bottom:8px"><button class="dugme" id="dpPromptKopyala">Metni kopyala</button>' +
    '<span class="mini" id="dpKopyalandi" hidden>Kopyalandı ✓</span></div>' +
    '<textarea id="dpPromptMetin" rows="4" readonly style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;' +
    'font-size:11.5px;color:var(--soluk)">' + kacis(dersProgramiPromptMetni()) + '</textarea>' +
    '<div class="mini" style="margin:10px 0 4px">AI’dan gelen çıktıyı buraya yapıştırın:</div>' +
    '<textarea id="dpCiktiYapistir" rows="4" placeholder="{&quot;saatler&quot;:[...], &quot;gunler&quot;:[...]}" ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea>' +
    '<div class="arac" style="margin-top:8px"><button class="dugme birincil" id="dpCiktiUygula">Bu programı kullan</button>' +
    '<button class="dugme" id="bosTabloOlustur">Elle doldurmak için boş tablo oluştur</button></div></div>' +
    '<div class="arac">' +
    (ogrenciMi() ? '' : '<select id="subeSec">' + subeler.map(s2 => '<option' + (s2 === sube ? ' selected' : '') + '>' + kacis(s2) + '</option>').join('') + '</select>') +
    '<span class="mini">Bu hafta (' + ggyy(hb) + ') planın</span>' +
    '<select id="haftaSec">' + Array.from({ length: Math.max(haftaSayisi, hafta) }, (x, i) => i + 1).map(w => {
      const hp = ((D.konuPlani || {})[sube] || [])[w - 1] || {};
      const ilk = Object.keys(hp).length ? (hp[Object.keys(hp)[0]] || [''])[0] : '';
      return '<option value="' + w + '"' + (w === hafta ? ' selected' : '') + '>' + w + '. hafta' +
        (ilk ? ' · ' + kacis(ilk.slice(0, 26)) : '') + '</option>';
    }).join('') + '</select>' +
    '<span style="flex:1"></span>' +
    '<button class="dugme birincil" id="dagitimGeriAl" title="Bu haftaya yazılan işleniş tarihlerini siler; ' +
    'sonucu girilmiş konulara dokunmaz">Bu haftanın dağıtımını geri al</button></div>' +
    '<div class="arac" style="margin-top:-4px"><span class="mini" style="max-width:70ch">Kaç hafta ileri ' +
    'dağıtılacağını Ayarlar’dan değiştirebilirsiniz. Ders programı ve konu planı belli olduğu için gelecek ' +
    'haftalar şimdiden hesaplanabilir; işlenmiş konulara dokunulmaz.</span></div>' +
    '<div class="arac" style="margin-top:-4px">' +
    '<span class="mini">Dönem başı</span><input type="date" id="donemBasi" value="' + D.ayar.donemBasi + '">' +

    '<button class="dugme" data-kaydir="ileri">Planı 1 hafta ileri at</button></div>';
  h += pk.tam
    ? '<div class="programDurum tam">✓ <b>' + ggyy(hb) + '</b> haftasının ders programı yüklü.</div>'
    : '<div class="programDurum eksik"><b>Bu hafta (' + ggyy(hb) + ') için program yüklenmedi.</b> ' +

        ? ggyy(pk.kaynak) + ' haftasının programı gösteriliyor — dersler değiştiyse konular yanlış güne düşer.'

      (pk.yok ? ' Yukarıdaki “AI ile aktar” ya da “boş tablo oluştur” ile başlayın.'
              : ' Değişmediyse yeniden aktarmanıza gerek yok:' +

                'üç şube için birden</button>')) + '</div>';

    h += '<div class="mini" style="margin:6px 0 10px;padding:8px 10px;border:1px solid var(--cizgi);border-radius:8px">' +

      '. hafta</b> gösteriliyor. Yukarıdaki listeden doğru haftayı seçerseniz dönem başı ona göre ayarlanır.</div>';
  // aynı gün aynı dersten birden çok saat varsa tek hücre gibi davranılır
  const n = prog.saatler.length;
  const kutu = [];
  for (let si2 = 0; si2 < n; si2++) kutu.push(new Array(7).fill(null));
  for (let gi = 0; gi < 7; gi++) {
    const gorulen = {};
    for (let si2 = 0; si2 < n; si2++) {
      if (kutu[si2][gi]) continue;
      const ders = (prog.gunler[gi] || [])[si2] || '';
      if (!ders) { kutu[si2][gi] = { ders: '', span: 1, ilk: true, saatler: [si2] }; continue; }
      let uzunluk = 1;
      const saatler = [si2];
      while (si2 + uzunluk < n && ((prog.gunler[gi] || [])[si2 + uzunluk] || '') === ders) {
        saatler.push(si2 + uzunluk); uzunluk++;
      }
      const ilk = !gorulen[ders];
      gorulen[ders] = true;
      kutu[si2][gi] = { ders: ders, span: uzunluk, ilk: ilk, saatler: saatler };
      for (let k = 1; k < uzunluk; k++) kutu[si2 + k][gi] = { atla: true };
    }
  }
  h += '<div class="kart sarma" style="margin-bottom:18px"><table class="progTablo"><thead><tr><th>Saat</th>' +
    GUN_AD.map((g, gi) => '<th>' + g + '<br><span class="mini">' + gg(hb + gi) + '</span></th>').join('') + '</tr></thead><tbody>';
  prog.saatler.forEach((sa, si2) => {
    const bitis = kutu[si2].find(x => x && x.span > 1);
    h += '<tr><td class="mini">' + kacis(sa) + '</td>';
    for (let gi = 0; gi < 7; gi++) {
      const c = kutu[si2][gi];
      if (!c || c.atla) continue;
      const ders = c.ders;
      const dersIdx = ders ? dersEsle(ders) : -1;
      h += '<td' + (c.span > 1 ? ' rowspan="' + c.span + '"' : '') + '>' +
        '<select class="progHucre" data-g="' + gi + '" data-s="' + c.saatler.join(',') + '">' + secenek(ders) + '</select>';
      if (c.span > 1)
        h += '<div class="mini birlesik">' + c.span + ' ders saati · ' +
          kacis(prog.saatler[c.saatler[0]]) + '–' + kacis(prog.saatler[c.saatler[c.saatler.length - 1]]) + '</div>';
      if (dersIdx >= 0 && !c.ilk)
        h += '<div class="mini birlesik">aynı gün tekrar — konular yukarıda</div>';
      if (dersIdx >= 0 && c.ilk) {
        const atanan = hucreKonulari(sube, hb, gi, ders);
        const oneri = atanan.length ? [] : oneriKonulari(sube, hafta, gi, ders, hb);
        const anahtar = planDersAnahtari(sube, ders);
        const tumu = anahtar ? dersDizisi(sube, anahtar).dizi : [];
        h += '<div class="konuKutu">' +
          (atanan.length
            ? atanan.map(ki => '<div class="konuCip">' + kacis(konuAl(ki)[3]) +
                '<button class="cipSil" data-ki="' + ki + '" data-sube="' + kacis(sube) + '" title="Bu günden kaldır">×</button></div>').join('')
            : oneri.length
              ? oneri.map(ad => '<div class="konuCip oneri" title="Konu planından öneri — dağıtınca kesinleşir">' + kacis(ad) + '</div>').join('')
              : '<span class="mini">konu yok</span>');
        if (tumu.length) {
          const gruplar = {};
          tumu.forEach(x => { (gruplar[x.hafta] = gruplar[x.hafta] || []).push(x.ad); });
          h += '<select class="konuAta" data-g="' + gi + '" data-d="' + kacis(ders) + '">' +
            '<option value="">konu ekle / değiştir…</option>' +
            Object.keys(gruplar).map(w => '<optgroup label="' + w + '. hafta' + (+w === hafta ? ' (bu hafta)' : '') + '">' +
              gruplar[w].map(a => '<option value="' + kacis(a) + '">' + kacis(a) + '</option>').join('') +
              '</optgroup>').join('') + '</select>';
        }
        h += '</div>';
      }
      h += '</td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>' +
    '<p class="mini">Konuların adını, sırasını değiştirmek ya da yeni konu eklemek/silmek için ' +
    '<b>Konu Planı</b> sekmesini kullanın — buradaki tablo oradan gelir.</p>';
  return h;
}

  Object.keys(pk.subeIslenis || {}).forEach(k => { y.subeIslenis[pk.ogr.sube][cev(+k)] = pk.subeIslenis[k]; });
  y.ogrIslenis = { 0: {} };
  Object.keys(pk.ogrIslenis || {}).forEach(k => { y.ogrIslenis[0][cev(+k)] = pk.ogrIslenis[k]; });
  y.konuDers = {}; Object.keys(pk.konuDers || {}).forEach(k => { y.konuDers[cev(+k)] = pk.konuDers[k]; });
  y.konuKaynak = {}; Object.keys(pk.konuKaynak || {}).forEach(k => { y.konuKaynak[cev(+k)] = pk.konuKaynak[k]; });
  y.altKonu = {}; Object.keys(pk.altKonu || {}).forEach(k => { y.altKonu[cev(+k)] = cev(pk.altKonu[k]); });
  y.par = {}; if (pk.par && Object.keys(pk.par).length) y.par[0] = pk.par;

function sonucPaketi(sinir) {

             .map(l => [l[0], l[2], l[3], l[4], l[6]]) };

// öğretmen tarafında sonuç paketini işle
function sonucPaketiUygula(pk) {
  if (!pk || pk.tur !== 'yks-sonuc') throw new Error('Bu dosya bir sonuç paketi değil.');
  if (pk.surum !== PAKET_SURUM) throw new Error('Bu sonuç paketi bu uygulama sürümüyle uyumlu değil ' +
    '(paket sürümü: ' + (pk.surum === undefined ? 'belirtilmemiş' : pk.surum) + ', beklenen: ' + PAKET_SURUM +
    '). Öğrenciden güncel bir uygulama ile oluşturulmuş bir dosya isteyin.');
  if (pk.katalogImza && pk.katalogImza !== KATALOG_IMZA)
    throw new Error('Sonuç paketi farklı bir konu kataloğuyla oluşturulmuş.');
  if (!Array.isArray(pk.kayit)) throw new Error('Sonuç paketinde kayıt listesi yok.');
  if (pk.kayit.length > 50000) throw new Error('Sonuç paketi beklenenden büyük.');
  const noEslesme = pk.no === undefined || pk.no === null || pk.no === '' ? [] :
    D.ogr.map((o, i) => ({ o: o, i: i })).filter(x => !x.o.silindi && String(x.o.no) === String(pk.no));
  const adEslesme = pk.ad ? D.ogr.map((o, i) => ({ o: o, i: i })).filter(x => !x.o.silindi &&
    x.o.ad.toLocaleLowerCase('tr') === String(pk.ad).toLocaleLowerCase('tr') &&
    (!pk.sube || x.o.sube === pk.sube)) : [];
  const aday = noEslesme.length ? noEslesme : adEslesme;
  if (aday.length !== 1) throw new Error(aday.length ? 'Öğrenci eşleşmesi belirsiz; numara/şubeyi kontrol edin.' :
    (pk.ad || pk.no) + ' listede bulunamadı.');
  const si = aday[0].i;
  const varOlan = {};
  D.log.filter(l => l[1] === si).forEach(l => {
    const anahtar = l[0] + ':' + l[2];
    varOlan[anahtar] = Math.max(varOlan[anahtar] || 0, Number.isSafeInteger(+l[6]) ? +l[6] : 0);
  });
  const paketteki = new Map();
  pk.kayit.forEach((k, i) => {
    if (!Array.isArray(k) || k.length < 4) throw new Error('Geçersiz sonuç paketi kaydı: ' + (i + 1) + '. satır.');
    const ts = k[4] === undefined || k[4] === null ? null : +k[4];
    const temiz = sonucKaydiDogrula(si, {
      ki: k[1], gun: k[0], dogru: k[2], soru: k[3], guncellemeTs: ts
    });
    const anahtar = temiz.gun + ':' + temiz.ki;
    const onceki = paketteki.get(anahtar);
    if (!onceki || (temiz.guncellemeTs || 0) >= (onceki.guncellemeTs || 0)) paketteki.set(anahtar, temiz);
  });
  const yeni = Array.from(paketteki.values()).filter(k => {
    const oncekiTs = varOlan[k.gun + ':' + k.ki];
    return oncekiTs === undefined || (k.guncellemeTs !== null && k.guncellemeTs > oncekiTs);
  });
  if (yeni.length) sonucIsle(si, yeni);
  return { ad: D.ogr[si].ad, eklenen: yeni.length, atlanan: (pk.kayit || []).length - yeni.length };
}

// ---------------------------------------------------------------- dışa aktarma
function dosyaAdiParcasi(v, yedek) {
  const temiz = String(v === undefined || v === null ? '' : v).normalize('NFKC')
    .replace(/[<>:"/\\|?*\x00-\x1f]/g, '-')
    .replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^[.\-]+|[.\-]+$/g, '')
    .slice(0, 80);
  return temiz || (yedek || 'dosya');
}

function csvOlustur(si, hb) {
  const p = planHesapla(si, hb);
  const enCok = Math.max(8, ...p.gunler.map(g => g.length));
  const satir = [];
  satir.push([D.ogr[si].ad, ggyy(hb) + ' - ' + ggyy(hb + 6)]);
  satir.push([]);
  satir.push(['Sıra'].concat(GUN_AD.map((g, i) => g + ' ' + gg(hb + i) + (p.off.indexOf(haftaGunu(hb + i)) >= 0 ? ' (izin)' : ''))));
  for (let s = 0; s < enCok; s++) {
    const r = [String(s + 1)];
    for (let g = 0; g < 7; g++) {
      const x = p.gunler[g][s];
      r.push(x ? dersKisaAd(x.dersAd) + ' - ' + x.ad + ' (' + x.soru + ' soru)' : '');
    }
    satir.push(r);
  }
  return '\ufeff' + satir.map(r => r.map(h => '"' + String(h === undefined ? '' : h).replace(/"/g, '""') + '"').join(';')).join('\r\n');
}

function klasikIndir(adi, icerik, tur) {
  try {
    const mime = tur === 'json' ? 'application/json;charset=utf-8' :
      tur === 'html' ? 'text/html;charset=utf-8' : 'text/csv;charset=utf-8';
    const blob = new Blob([icerik], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = adi; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}

async function indir(adi, icerik, tur) {
  const d = await yetenek('downloads');
  if (!d) {
    const tamam = klasikIndir(adi, icerik, tur);
    if (!tamam)
      alert('Dosya indirilemedi. Planı kâğıda dökmek için “Yazdır” düğmesini kullanabilirsiniz.');
    return tamam;
  }
  try { await d.save({ filename: adi, data: icerik }); return true; }
  catch (e) {
    if (e && e.code === 'extension_not_enabled' && tur === 'csv') {
      try { await d.save({ filename: adi.replace(/\.csv$/, '.txt'), data: icerik }); return true; } catch (e2) { e = e2; }
    }
    if (e && e.code === 'declined') return false;
    const tamam = klasikIndir(adi, icerik, tur);
    if (!tamam) alert('İndirilemedi: ' + (e && e.code || 'bilinmeyen hata'));
    return tamam;
  }
}

// bazı PDF'lerde Türkçe harfler metin katmanında eksik gelir; karşılaştırmayı iskelet üzerinden yaparız
const dersAdiUyar = (a, b) => {
  const x = iskelet(a), y = iskelet(b);
  if (!x || !y) return false;
  return x === y || x.indexOf(y) === 0 || y.indexOf(x) === 0;
};
const iskelet = t => String(t).toLocaleUpperCase('tr').replace(/[ÇĞİÖŞÜIı\s.\-]/g, '');
const KISALTMA = { TYT: 1, AYT: 1, YDT: 1, YKS: 1 };
function dersBaslik(ad) {
  return String(ad || '').toLocaleLowerCase('tr').split(/\s+/).filter(Boolean).map(w => {
    const b = w.toLocaleUpperCase('tr');
    if (KISALTMA[b]) return b;
    if (w === 've' || w === 'ile') return w;
    return w.charAt(0).toLocaleUpperCase('tr') + w.slice(1);
  }).join(' ');
}

};
function dersKisaAd(ad) {
  const t = String(ad || '').replace(/\s*\([^)]*\)/g, '').trim();

// haftalık planda görünecek ders adı: önce Excel'deki karşılığı, yoksa programdaki ad
function dersGosterAdi(sube, dersAdi) {

    if (k) bulunan = k;

// AI'dan dönen (muhtemelen ```json ... ``` gibi sarmalanmış) metni ayrıştırır ve doğrular
function dersProgramiJsonAyristir(metin) {
  let t = String(metin || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/i, '').trim();
  const bas = t.indexOf('{'), son = t.lastIndexOf('}');
  if (bas >= 0 && son > bas) t = t.slice(bas, son + 1);
  let y;
  try { y = JSON.parse(t); }
  catch (e) { return { hata: 'Bu metin geçerli bir JSON değil. AI’nın çıktısını olduğu gibi, baştan sona yapıştırdığınızdan emin olun.' }; }
  if (!y || !Array.isArray(y.saatler) || !y.saatler.length) return { hata: '“saatler” listesi bulunamadı ya da boş.' };
  if (!Array.isArray(y.gunler) || y.gunler.length !== 7) return { hata: '“gunler” tam olarak 7 gün içermeli (Pazartesi–Pazar).' };
  const saatler = y.saatler.map(s => String(s || '').trim());
  const gunler = y.gunler.map(g => {
    const dizi = (Array.isArray(g) ? g : []).map(x => String(x || '').trim().toLocaleUpperCase('tr'));
    while (dizi.length < saatler.length) dizi.push('');
    return dizi.slice(0, saatler.length);
  });
  return { tablo: { saatler: saatler, gunler: gunler } };
}
// --- haftalık konuları ders programına göre dağıt
function haftaNo(hb) {
  // dönem başı Pazartesi olmayan bir tarihse (elle girilmiş ya da eski varsayılan),
  // hafta bölümü kaymasın diye her zaman o haftanın Pazartesi'sine yuvarlanır
  const d = pazartesi(D.ayar.donemBasi ? gunNo(D.ayar.donemBasi) : gunNo(D.ayar.planBasi));
  return Math.floor((hb - d) / 7) + 1;
}
// haftaNo'nun tersi: 1 tabanlı bir plan haftası numarasından o haftanın takvim Pazartesi'sini üretir
function haftaTakvimi(hafta) {
  const d = pazartesi(D.ayar.donemBasi ? gunNo(D.ayar.donemBasi) : gunNo(D.ayar.planBasi));
  return d + (hafta - 1) * 7;
}
function planHaftaSayisi(sube) { return (((D.konuPlani || {})[sube]) || []).length; }
// --- ders programı haftadan haftaya değişebilir: her hafta ayrı saklanır
const BOS_PROGRAM = () => ({ saatler: [], gunler: [[], [], [], [], [], [], []] });
function programKayitlari(sube) {
  const h = (D.programHafta || {})[sube] || {};
  return Object.keys(h).map(Number).sort((a, b) => a - b);
}
// hb haftasında geçerli program: o haftanınki, yoksa ondan önceki en yakın hafta, o da yoksa eski tek program
function programAl(sube, hb) {
  const h = (D.programHafta || {})[sube] || {};
  if (h[hb]) return { prog: h[hb], kaynak: hb, tam: true };
  const onceki = programKayitlari(sube).filter(x => x < hb);
  if (onceki.length) { const k = onceki[onceki.length - 1]; return { prog: h[k], kaynak: k, tam: false }; }
  const eski = (D.dersProgrami || {})[sube];
  if (eski) return { prog: eski, kaynak: null, tam: false };
  return { prog: BOS_PROGRAM(), kaynak: null, tam: false, yok: true };
}
function programYaz(sube, hb, tablo) {
  D.programHafta = D.programHafta || {};
  D.programHafta[sube] = D.programHafta[sube] || {};
  D.programHafta[sube][hb] = tablo;
  D.dersProgrami = D.dersProgrami || {};
  D.dersProgrami[sube] = tablo;          // eski alan da güncel kalsın
}
// takvim haftasına karşılık gelen plan haftası (plan dışına taşmaz)
function planHaftasi(sube, hb) {
  const n = planHaftaSayisi(sube) || 1;
  return Math.min(n, Math.max(1, haftaNo(hb)));
}
// donemBasi ve donemElle'yi HER ZAMAN birlikte yazan tek kapı. Bu ikisi ayrı ayrı
// güncellenirse (yeni bir çağrı noktası elleMi'yi unutursa) donemHizala() az sonra
// tarihi sessizce "bugün"e sıfırlar — geçmişte gerçekten olmuş bir hata buydu.
// Kullanıcının açıkça verdiği HER tarih (Ayarlar'dan elle giriş, hafta numarası
// seçimi, öğrenci kurulum sihirbazı, "planı ileri at" düğmesi) elleMi=true ile
// buradan geçer; yalnızca varsayılan/otomatik hizalama yolları (varsayilan(),
// donemHizala()'nın kendisi) bu fonksiyonu atlayıp doğrudan yazar.
function donemBasiniAyarla(tarih, elleMi) {
  D.ayar.donemBasi = tarih;
  D.ayar.donemElle = !!elleMi;
}
// dönem başı plan aralığının dışındaysa bu haftayı 1. hafta say (kullanıcı elle ayarlamadıysa)
function donemHizala() {
  if (D.ayar.donemElle) return false;
  const hb = haftaBasi();
  let n = 1;
  Object.keys(D.konuPlani || {}).forEach(s => { n = Math.max(n, planHaftaSayisi(s)); });
  const h = haftaNo(hb);
  if (h >= 1 && h <= n) return false;
  D.ayar.donemBasi = isoDan(hb);
  return true;
}
// bir dersin plandaki bütün konuları, hafta bilgisiyle
function planDersAnahtari(sube, dersAdi) {
  const plan = (D.konuPlani || {})[sube] || [];
  const say = {};
  plan.forEach(h => Object.keys(h).forEach(k => { say[k] = 1; }));
  const anahtarlar = Object.keys(say);
  const tam = anahtarlar.find(k => dersAdiUyar(k, dersAdi));
  if (tam) return tam;
  const di = dersEsle(dersAdi);
  return anahtarlar.find(k => dersEsle(k) === di) || null;
}
function dersDizisi(sube, anahtar) {
  const plan = (D.konuPlani || {})[sube] || [];
  const dizi = [], boy = [];
  plan.forEach((h, i) => {
    const liste = (h && h[anahtar]) || [];
    boy.push(liste.length);
    liste.forEach(a => dizi.push({ ad: a, hafta: i + 1 }));
  });
  return { dizi: dizi, boy: boy };
}
// bir dersin tüm konu sırasını verilen isim listesiyle baştan yazar (yeniden sıralanmış,
// silinmiş ya da eklenmiş olabilir). Mevcut haftalık boyut örüntüsü (boy) korunur; taşan
// kısım ortalama hafta boyuyla yeni haftalara eklenir, kısalan haftalar boşaltılır.
function dersDizisiYaz(sube, anahtar, yeniAdlar) {
  D.konuPlani = D.konuPlani || {};
  const plan = D.konuPlani[sube] || (D.konuPlani[sube] = []);
  const boy = dersDizisi(sube, anahtar).boy;
  const dolu = boy.filter(x => x);
  const ort = Math.max(1, Math.round(dolu.reduce((a, c) => a + c, 0) / Math.max(1, dolu.length)));
  let q = 0;
  const uzunluk = Math.max(plan.length, boy.length);
  for (let w = 0; w < uzunluk; w++) {
    const n = boy[w] !== undefined ? boy[w] : (q < yeniAdlar.length ? ort : 0);
    const dilim = yeniAdlar.slice(q, q + n); q += n;
    plan[w] = plan[w] || {};
    if (dilim.length) plan[w][anahtar] = dilim; else delete plan[w][anahtar];
  }
  while (q < yeniAdlar.length) {
    const dilim = yeniAdlar.slice(q, q + ort); q += ort;
    const h = {}; h[anahtar] = dilim; plan.push(h);
  }
}
// öğrencinin/şubenin planındaki bütün ders anahtarları, katalog ders sırasına göre
function konuPlaniDersleri(sube) {
  const plan = (D.konuPlani || {})[sube] || [];
  const gorulen = {};
  plan.forEach(h => Object.keys(h || {}).forEach(k => { gorulen[k] = 1; }));
  return Object.keys(gorulen).sort((a, b) => dersEsle(a) - dersEsle(b) || a.localeCompare(b, 'tr'));
}
// bir dersin konu sırasını, seçilen konu o haftaya gelecek şekilde yeniden dizer
function planYenidenDiz(sube, anahtar, hafta, ad) {
  D.konuPlani = D.konuPlani || {};
  const plan = D.konuPlani[sube] || (D.konuPlani[sube] = []);
  const d = dersDizisi(sube, anahtar), dizi = d.dizi, boy = d.boy;
  const t = iskelet(ad);
  const idx = dizi.findIndex(x => iskelet(x.ad) === t);
  if (idx < 0) return null;
  const eski = dizi[idx].hafta;
  if (eski === hafta) return null;
  let once = dizi.slice(0, idx).map(x => x.ad);
  let kalan = dizi.slice(idx).map(x => x.ad);
  if (hafta === 1) { kalan = kalan.concat(once); once = []; }
  let p = 0;
  for (let w = 0; w < hafta - 1; w++) {
    const n = boy[w] || 0;
    const dilim = once.slice(p, p + n); p += n;
    plan[w] = plan[w] || {};
    if (dilim.length) plan[w][anahtar] = dilim; else delete plan[w][anahtar];
  }
  if (p < once.length && hafta > 1) {
    plan[hafta - 2] = plan[hafta - 2] || {};
    plan[hafta - 2][anahtar] = (plan[hafta - 2][anahtar] || []).concat(once.slice(p));
  }
  const dolu = boy.filter(x => x);
  const ortBoy = Math.max(1, Math.round(dolu.reduce((a, c) => a + c, 0) / Math.max(1, dolu.length)));
  let q = 0;
  for (let w = hafta - 1; w < plan.length; w++) {
    const n = boy[w] !== undefined ? boy[w] : ortBoy;
    const dilim = kalan.slice(q, q + n); q += n;
    plan[w] = plan[w] || {};
    if (dilim.length) plan[w][anahtar] = dilim; else delete plan[w][anahtar];
  }
  while (q < kalan.length) {
    const dilim = kalan.slice(q, q + ortBoy); q += ortBoy;
    const yeniHafta = {}; yeniHafta[anahtar] = dilim; plan.push(yeniHafta);
  }
  return { eski: eski, yeni: hafta, kayma: hafta - eski, konu: dizi[idx].ad };
}
// bütün dersleri birlikte kaydırır: yon=+1 bu haftayı boşaltıp planı ileri atar, -1 bir hafta öne çeker
function planHaftaKaydir(sube, hafta, yon) {
  D.konuPlani = D.konuPlani || {};
  const plan = D.konuPlani[sube] || (D.konuPlani[sube] = []);
  while (plan.length < hafta) plan.push({});
  if (yon > 0) { plan.splice(hafta - 1, 0, {}); return 'ileri'; }
  const cikan = plan.splice(hafta - 1, 1)[0] || {};
  if (hafta > 1) {
    plan[hafta - 2] = plan[hafta - 2] || {};
    Object.keys(cikan).forEach(k => {
      plan[hafta - 2][k] = (plan[hafta - 2][k] || []).concat(cikan[k]);
    });
  }
  return 'geri';
}
function konuBul(dersIdx, ad) {
  const t = iskelet(ad);
  let ayniDers = -1, baskaDers = -1;
  for (let i = 0; i < konuSayisi(); i++) {
    const k = konuAl(i);
    if (!k || k[6]) continue;
    const ik = iskelet(k[3]);
    const esit = ik === t || (t.length > 8 && (ik.indexOf(t) === 0 || t.indexOf(ik) === 0));
    if (!esit) continue;
    if (k[0] === dersIdx) { ayniDers = i; break; }
    if (baskaDers < 0) baskaDers = i;
  }
  return ayniDers >= 0 ? ayniDers : baskaDers;
}
function kullaniciKonusu(dersIdx, ad, sayac) {
  D.ekKonular = D.ekKonular || [];
  const v = konuBul(dersIdx, ad);
  if (v >= 0) { if (sayac) sayac.bulundu++; return v; }
  D.ekKonular.push([dersIdx, 12, 'Ders programından', ad, 0, '']);
  if (sayac) sayac.yeni++;
  return KATALOG.length + D.ekKonular.length - 1;
}
// --- o haftanın konularının hangi güne düşeceği (hem önizleme hem dağıtım bunu kullanır)
function haftaYerlesim(sube, hafta, hb) {
  const prog = hb !== undefined ? programAl(sube, hb).prog : (D.dersProgrami || {})[sube];
  const plan = ((D.konuPlani || {})[sube] || [])[hafta - 1];
  const out = [];
  if (!prog || !prog.saatler || !prog.saatler.length || !plan) return out;
  Object.keys(plan).forEach(dersAd => {
    const dersIdx = dersEsle(dersAd);
    if (dersIdx < 0) return;
    let gunler = [];
    for (let g = 0; g < 7; g++)
      if ((prog.gunler[g] || []).some(d => d && dersAdiUyar(d, dersAd))) gunler.push(g);
    if (!gunler.length)
      for (let g = 0; g < 7; g++)
        if ((prog.gunler[g] || []).some(d => d && dersEsle(d) === dersIdx)) gunler.push(g);
    if (!gunler.length) return;
    (plan[dersAd] || []).forEach((ad, i) => {
      if (!ad) return;
      out.push({ gi: gunler[Math.min(i, gunler.length - 1)], dersAd: dersAd, dersIdx: dersIdx, ad: ad });
    });
  });
  return out;
}
function programUygula(hb, tekSube) {
  const rapor = [];
  const sayac = { bulundu: 0, yeni: 0 };
  let haftaGosterge = 1;
  D.subeIslenis = D.subeIslenis || {};
  D.konuKaynak = D.konuKaynak || {};
  D.konuDers = D.konuDers || {};
  Object.keys(D.dersProgrami || {}).filter(s => !tekSube || s === tekSube).forEach(sube => {
    const hafta = planHaftasi(sube, hb);
    haftaGosterge = hafta;
    const yer = haftaYerlesim(sube, hafta, hb);
    if (!yer.length) { rapor.push(sube + ': bu hafta için konu planı yok'); return; }
    D.subeIslenis[sube] = D.subeIslenis[sube] || {};
    let sayi = 0;
    yer.forEach(y => {
      const ki = kullaniciKonusu(y.dersIdx, y.ad, sayac);
      D.konuKaynak[ki] = iskelet(y.dersAd);
      D.konuDers[ki] = y.dersAd;
      if (D.subeIslenis[sube][ki] === undefined) { D.subeIslenis[sube][ki] = hb + y.gi; sayi++; }
    });
    rapor.push(sube + ': ' + sayi + ' konu');
  });
  return { hafta: haftaGosterge, rapor: rapor, bulundu: sayac.bulundu, yeni: sayac.yeni };
}

// --- bir haftanın dağıtımını geri al
// Yalnızca o haftaya yazılmış işleniş tarihlerini siler; sonucu girilmiş
// (kartı olan veya kayda geçmiş) konuya dokunmaz — geçmişi bozmamak için.
function dagitimiGeriAl(hb, sube) {
  const hs = hb + 6;
  const rapor = [];
  Object.keys(D.subeIslenis || {}).filter(su => !sube || su === sube).forEach(su => {
    const m = D.subeIslenis[su] || {};
    let silinen = 0, korunan = 0;
    Object.keys(m).forEach(a => {
      const ki = +a;
      if (m[ki] < hb || m[ki] > hs) return;                  // başka haftanın işlenişi
      const sonucVar = (D.log || []).some(l => l[2] === ki && D.ogr[l[1]] && D.ogr[l[1]].sube === su) ||
                       Object.keys(D.kart).some(k => {
                         const par = k.split(':');
                         return +par[1] === ki && D.ogr[+par[0]] && D.ogr[+par[0]].sube === su;
                       });
      if (sonucVar) { korunan++; return; }
      delete m[ki];
      silinen++;
    });
    if (silinen || korunan) rapor.push(su + ': ' + silinen + ' konu geri alındı' +
      (korunan ? ' · ' + korunan + ' konu sonucu girildiği için korundu' : ''));
  });
  return rapor;
}

// --- konu planını gelecek haftalara da yay
// Ders programı ve konu planı belli olduğuna göre dönemin tamamı şimdiden hesaplanabilir:
// her hafta için o haftanın çizelgesi (yoksa en yakın önceki hafta) kullanılır, konu planının
// o haftaki konuları dersin geçtiği günlere yazılır. Zaten işlenmiş konuya dokunulmaz,
// bu yüzden kaç kez çalıştırılırsa çalıştırılsın aynı sonucu verir.
function ileriDagit(hb0, sube, haftaSayisi) {
  const n = Math.max(0, haftaSayisi === undefined ? 8 : haftaSayisi);
  const say = () => Object.keys(D.subeIslenis || {})
    .reduce((a, su) => a + Object.keys(D.subeIslenis[su] || {}).length, 0);
  const once = say();
  let sonHafta = 0;
  for (let k = 0; k < n; k++) {
    const s = programUygula(hb0 + k * 7, sube);
    sonHafta = s.hafta;
  }
  return { eklenen: say() - once, hafta: n, sonPlanHaftasi: sonHafta };
}

// Konu planındaki adları bu öğrencinin gerçek konu kimlikleriyle eşleştirir. Bu yalnızca
// hedef konuyu bulmak içindir; konu planı ve işleniş tarihleri burada asla değiştirilmez.
function ogrenciIslenisTarihi(si, ki) {
  const o = D.ogr[si] || {}, og = (D.ogrIslenis || {})[si] || {};
  const su = (D.subeIslenis || {})[o.sube] || {};
  if (Number.isInteger(og[ki])) return og[ki];
  if (Number.isInteger(su[ki])) return su[ki];
  return Number.isInteger((D.islenis || {})[ki]) ? D.islenis[ki] : null;
}

function ogrenciPlanKonusuKimligi(si, sube, anahtar, ad, hedefHafta) {
  const aranan = iskelet(ad), hedef = haftaTakvimi(hedefHafta), ids = {};
  const ekle = m => Object.keys(m || {}).forEach(k => { ids[k] = 1; });
  ekle((D.ogrIslenis || {})[si]);
  ekle((D.subeIslenis || {})[sube]);
  ekle(D.islenis);
  Object.keys(D.kart || {}).forEach(k => {
    const p = k.split(':'); if (+p[0] === si) ids[p[1]] = 1;
  });
  const aday = [];
  Object.keys(ids).forEach(k => {
    const ki = +k, konu = konuAl(ki), tarih = ogrenciIslenisTarihi(si, ki);
    if (!konu || konu[6] || iskelet(konu[3]) !== aranan || !Number.isInteger(tarih)) return;
    const ders = (D.konuDers && D.konuDers[ki]) || konuDersAdi(ki);
    if (planDersAnahtari(sube, ders) !== anahtar) return;
    aday.push({ ki: ki, tarih: tarih, uzaklik: Math.abs(pazartesi(tarih) - hedef) });
  });
  aday.sort((a, b) => a.uzaklik - b.uzaklik || a.ki - b.ki);
  return aday[0] || null;
}

function dersKonuKonumu(si, anahtar, ki) {
  const o = D.ogr[si], konu = konuAl(ki), dizi = o ? dersDizisi(o.sube, anahtar).dizi : [];
  if (!konu || !dizi.length) return null;
  const ad = iskelet(konu[3]), tarih = ogrenciIslenisTarihi(si, ki);
  const aday = dizi.map((x, i) => ({ x: x, i: i })).filter(a => iskelet(a.x.ad) === ad);
  if (!aday.length) return null;
  aday.sort((a, b) => !Number.isInteger(tarih) ? a.i - b.i :
    Math.abs(haftaTakvimi(a.x.hafta) - pazartesi(tarih)) -
    Math.abs(haftaTakvimi(b.x.hafta) - pazartesi(tarih)));
  return { dizi: dizi, index: aday[0].i };
}

function planKonusuYedekKimligi(anahtar, ad) {
  const aranan = iskelet(ad), dersIdx = dersEsle(anahtar), aday = [];
  for (let ki = 0; ki < konuSayisi(); ki++) {
    const konu = konuAl(ki);
    if (!konu || konu[6] || iskelet(konu[3]) !== aranan) continue;
    const atanmis = D.konuDers && D.konuDers[ki];
    if (atanmis === anahtar) aday.push({ ki: ki, oncelik: 0 });
    else if (konu[0] === dersIdx) aday.push({ ki: ki, oncelik: 1 });
  }
  aday.sort((a, b) => a.oncelik - b.oncelik || a.ki - b.ki);
  return aday.length ? aday[0].ki : null;
}

function dersSirasiOnizleme(si, dersAdi, ki, yon) {
  const o = D.ogr[si], anahtar = o && planDersAnahtari(o.sube, dersAdi);
  if (!o || !anahtar || !Number.isInteger(ki) || (yon !== -1 && yon !== 1))
    return { gizle: true, hata: 'Konu güvenle belirlenemedi.' };
  const konum = dersKonuKonumu(si, anahtar, ki);
  if (!konum) return { gizle: true, hata: 'Konu ders planında bulunamadı.' };
  const hedefIndex = konum.index + yon;
  if (hedefIndex < 0 || hedefIndex >= konum.dizi.length)
    return { hata: yon < 0 ? 'Bu zaten dersin ilk konusu.' : 'Bu zaten dersin son konusu.' };
  const hedef = konum.dizi[hedefIndex];
  const kimlik = ogrenciPlanKonusuKimligi(si, o.sube, anahtar, hedef.ad, hedef.hafta);
  const hedefKi = kimlik ? kimlik.ki : planKonusuYedekKimligi(anahtar, hedef.ad);
  if (!Number.isInteger(hedefKi)) return { hata: 'Hedef konu katalogda bulunamadı.' };
  return { anahtar: anahtar, hedefAd: hedef.ad, hedefKi: hedefKi };
}

function ayniGunAyniKonuVar(p, g, s, hedefKi) {
  return (p.gunler[g] || []).some((x, i) => i !== s && !x.serbest && !x.anlatim && x.ki === hedefKi);
}

// Yalnızca seçilen test hücresinin konusunu değiştirir. Kaynak hücrenin ayrı kimliği
// korunur; bu nedenle önceki konu başka bir günde zaten varsa bile ikinci kez seçilebilir.
// Konu planı, işleniş tarihleri ve diğer test hücreleri değişmez.
function dersSirasiKaydir(si, hb, g, s, yon) {
  const p = planHesapla(si, hb), mevcut = (p.gunler[g] || [])[s];
  if (!mevcut || mevcut.serbest || mevcut.anlatim ||
      (mevcut.kart && !mevcut.degisim && !mevcut.slotEk))
    return { hata: 'Yalnızca sonucu girilmemiş bir konu testi değiştirilebilir.' };
  const onizleme = dersSirasiOnizleme(si, mevcut.dersAd || konuDersAdi(mevcut.ki), mevcut.ki, yon);
  if (onizleme.hata || onizleme.gizle) return { hata: onizleme.hata || 'Hedef konu bulunamadı.' };
  if (ayniGunAyniKonuVar(p, g, s, onizleme.hedefKi))
    return { hata: 'Aynı konu bu günde zaten var. İkinci testi başka bir güne taşıyın veya mevcut testi silin.' };
  const slot = planSlotAnahtari(mevcut), eskiAd = mevcut.ad;
  const gecerliSlot = (typeof slot === 'string' && /^K\d+$/.test(slot)) || Number.isInteger(+slot);
  if (!gecerliSlot) return { hata: 'Seçilen test hücresinin kimliği bulunamadı.' };
  dondur(si, hb, p);
  const ov = elleAl(si, hb, true);
  ov.degisim = ov.degisim || {};
  ov.konuSlot = ov.konuSlot || {};
  if (typeof slot === 'string' && ov.konuSlot[slot]) {
    ov.konuSlot[slot].ki = onizleme.hedefKi;
  } else if (Number.isInteger(+slot)) {
    const kaynakKi = +slot;
    if (kaynakKi === onizleme.hedefKi) delete ov.degisim[kaynakKi];
    else ov.degisim[kaynakKi] = onizleme.hedefKi;
  }
  return { ders: onizleme.anahtar, eski: eskiAd, yeni: onizleme.hedefAd,
           mesaj: 'Yalnızca seçilen test “' + eskiAd + '” yerine “' + onizleme.hedefAd + '” oldu.' };
}

function sonrakiKonuyuEkle(si, hb, g, s) {
  const p = planHesapla(si, hb), mevcut = (p.gunler[g] || [])[s];
  if (!mevcut || mevcut.serbest || mevcut.anlatim)
    return { hata: 'Yanına konu eklenecek test bulunamadı.' };
  const onizleme = dersSirasiOnizleme(si, mevcut.dersAd || konuDersAdi(mevcut.ki), mevcut.ki, 1);
  if (onizleme.hata || onizleme.gizle) return { hata: onizleme.hata || 'Sonraki konu bulunamadı.' };
  if (ayniGunAyniKonuVar(p, g, -1, onizleme.hedefKi))
    return { hata: 'Sonraki konu bu günde zaten var.' };
  dondur(si, hb, p);
  const ov = elleAl(si, hb, true);
  ov.konuSlot = ov.konuSlot || {};
  let n = 1; while (ov.konuSlot['K' + n]) n++;
  const id = 'K' + n;
  Object.keys(ov.yer || {}).forEach(k => {
    const yer = ov.yer[k]; if (yer && yer[0] === g && yer[1] > s) yer[1]++;
  });
  ov.konuSlot[id] = { ki: onizleme.hedefKi };
  ov.yer[id] = [g, s + 1];
  return { ders: onizleme.anahtar, yeni: onizleme.hedefAd,
           mesaj: '“' + onizleme.hedefAd + '” aynı güne ayrı bir test olarak eklendi.' };
}

function planSlotSonuclandi(si, hb, slot) {
  const ov = elleAl(si, hb, false);
  // Kullanıma alınmış haftanın hücresi sonuç girilince silinmez; tarihsel plan kâğıdın
  // aynısı olarak kalır. Sonuç durumu zaten D.log üzerinden ayrıca gösterilir.
  if (ov.sabit) return;
  if (typeof slot === 'string' && /^K\d+$/.test(slot) && ov.konuSlot && ov.konuSlot[slot]) {
    delete ov.konuSlot[slot];
    if (ov.yer) delete ov.yer[slot];
    if (ov.soru) delete ov.soru[slot];
    return;
  }
  const kaynakKi = Number(slot);
  if (!Number.isInteger(kaynakKi) || !ov.degisim || ov.degisim[kaynakKi] === undefined) return;
  delete ov.degisim[kaynakKi];
  if ((ov.sil || []).indexOf(kaynakKi) < 0) (ov.sil = ov.sil || []).push(kaynakKi);
  if (ov.yer) delete ov.yer[kaynakKi];
  if (ov.soru) delete ov.soru[kaynakKi];
}

// --- bir hücrede (gün, ders) o hafta işlenen konular
function hucreKonulari(sube, hb, gi, dersAdi) {
  const isl = (D.subeIslenis || {})[sube] || {};
  const dersIdx = dersEsle(dersAdi);
  const kaynak = D.konuKaynak || {};
  const out = [];
  Object.keys(isl).forEach(a => {
    const ki = +a, k = konuAl(ki);
    if (!k || k[6] || isl[ki] !== hb + gi) return;
    if (kaynak[ki]) { if (dersAdiUyar(kaynak[ki], dersAdi)) out.push(ki); }
    else if (k[0] === dersIdx) out.push(ki);
  });
  return out;
}
// --- hücrenin konu planından gelen önerisi (henüz dağıtılmamışsa)
function oneriKonulari(sube, hafta, gi, dersAdi, hb) {
  const dersIdx = dersEsle(dersAdi);
  const yer = haftaYerlesim(sube, hafta, hb).filter(y => y.gi === gi);
  const tam = yer.filter(y => dersAdiUyar(y.dersAd, dersAdi)).map(y => y.ad);
  if (tam.length) return tam;
  return yer.filter(y => y.dersIdx === dersIdx).map(y => y.ad);
}
function konuGuneAta(sube, hb, gi, dersAdi, ad) {
  D.subeIslenis = D.subeIslenis || {};
  D.subeIslenis[sube] = D.subeIslenis[sube] || {};
  D.konuKaynak = D.konuKaynak || {};
  D.konuDers = D.konuDers || {};
  const ki = kullaniciKonusu(dersEsle(dersAdi), ad);
  D.konuKaynak[ki] = iskelet(dersAdi);
  D.konuDers[ki] = dersGosterAdi(sube, dersAdi);
  D.subeIslenis[sube][ki] = hb + gi;
  return ki;
}
// eski kayıtlar için: iskeletten okunabilir ders adını üret
function dersAdlariniTazele() {
  D.konuDers = D.konuDers || {};
  const kaynak = D.konuKaynak || {};
  let n = 0;
  Object.keys(kaynak).forEach(a => {
    if (D.konuDers[a]) return;
    D.konuDers[a] = dersGosterAdi(null, kaynak[a]);
    n++;
  });
  return n;
}
// hücreye konu atarken planı da o konuya göre yeniden dizer
function hucreyeKonuAta(sube, hb, gi, dersAdi, ad) {
  const hafta = planHaftasi(sube, hb);
  const anahtar = planDersAnahtari(sube, dersAdi);
  const kaydirma = anahtar ? planYenidenDiz(sube, anahtar, hafta, ad) : null;
  if (kaydirma) {
    // bu haftanın eski atamalarını temizle, yeni plana göre kur
    const isl = D.subeIslenis[sube] || {};
    Object.keys(isl).forEach(a => {
      const ki = +a;
      if (isl[ki] < hb || isl[ki] > hb + 6) return;
      if (D.konuKaynak && D.konuKaynak[ki] && !dersAdiUyar(D.konuKaynak[ki], dersAdi)) return;
      if (!(D.konuKaynak && D.konuKaynak[ki]) && konuAl(ki) && konuAl(ki)[0] !== dersEsle(dersAdi)) return;
      delete isl[ki];
    });
    haftaYerlesim(sube, hafta, hb).filter(y => dersAdiUyar(y.dersAd, dersAdi)).forEach(y => {
      konuGuneAta(sube, hb, y.gi, dersAdi, y.ad);
    });
  } else {
    konuGuneAta(sube, hb, gi, dersAdi, ad);
  }
  return kaydirma;
}

// yedek / öğrenci paketi yükleme — hem dosyadan hem yapıştırmadan aynı yol
async function metindenYukle(metin) {
  let y;
  try { y = JSON.parse(String(metin || '').trim()); }
  catch (e) {
    alert('Bu içerik okunamadı. Yedek dosyasının tamamı yapıştırılmalı — { ile başlayıp } ile biter.\n\n(' +
          (e.message || e) + ')');
    return null;
  }
  const onceki = D;
  try {
    if (y && y.tur === 'yks-ogrenci-paketi') {
      veriyiHazirla(paketiYukle(y));
      EK.ogr = 0; EK.sekme = 'plan'; EK.hafta = null;
      await kaydet(true); ciz();
      return 'Hoş geldin ' + D.ogr[0].ad + ' — planın hazır.';
    }
    if (y && y.ayar && y.ogr) {
      veriyiHazirla(y); if (!D.rol) D.rol = 'rehber';
      EK.hafta = null; EK.sekme = 'plan';
      // yedekten gelen veride gelecek haftalar boş olabilir; hemen doldur
      let ek = 0;
      try {
        const n = ileriHaftaSayisi();
        if (n > 0 && Object.keys(D.konuPlani || {}).length && Object.keys(D.dersProgrami || {}).length)
          ek = ileriDagit(ileriDagitBaslangic(), null, n).eklenen;
      } catch (e) { /* dolduramazsa yedek yine de yüklensin */ }
      await kaydet(true); ciz();
      return 'Yedek yüklendi: ' + D.ogr.length + ' öğrenci, ' +
             Object.keys(D.konuPlani || {}).length + ' konu planı' +
             (ek ? ' · gelecek haftalara ' + ek + ' konu yerleştirildi' : '') + '.';
    }
    alert('Bu dosya tanındı ama içinde öğrenci verisi yok. Doğru yedeği seçtiğinizden emin olun.');
    return null;
  } catch (e) {
    D = onceki;
    alert('Yükleme sırasında hata: ' + (e.message || e));
    return null;
  }
}

async function planYazdir(kapsam) {
  const hb = haftaBasi();
  let liste, etiket;
  if (kapsam === 'hepsi') { liste = kullananlar(); etiket = 'tum-sinif'; }
  else if (kapsam && kapsam.sube !== undefined) {
    liste = subeKullananlar(kapsam.sube);
    etiket = 'sube-' + dosyaAdiParcasi(kapsam.sube, 'sube');
  } else { liste = [EK.ogr]; etiket = dosyaAdiParcasi(D.ogr[EK.ogr].ad, 'ogrenci').toLocaleLowerCase('tr'); }
  if (!liste.length) { alert('Bu kapsamda çıktı alacak öğrenci yok.'); return false; }
  const belge = yazdirBelgesi(liste, hb);
  const d = await yetenek('downloads');
  if (!d) { // çevrimdışı kopya: doğrudan yazdır
    const w = window.open('', '_blank');
    if (w) { w.document.write(belge); w.document.close(); return true; }
    const tamam = klasikIndir('plan-' + isoDan(hb) + '.html', belge, 'html');
    if (!tamam)
      alert('Yazdırma açılamadı.');
    return tamam;
  }
  const ad = etiket + '-' + isoDan(hb) + '.html';
  try {
    await d.save({ filename: ad, data: belge });
    bilgiVer(liste.length + ' sayfa indirildi. Açıp Ctrl+P deyin — A4 yatay, her öğrenci bir sayfa.');
    return true;
  } catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && e.code === 'extension_not_enabled') {
      alert('Bu hesapta HTML indirme kapalı görünüyor. Ayarlar → Yedek indir ile veriyi alıp bilgisayarda açabilirsiniz.');
      return false;
    }
    const tamam = klasikIndir(ad, belge, 'html');
    if (!tamam) alert('İndirilemedi: ' + (e && e.code || 'bilinmeyen'));
    return tamam;
  }
}

  const v = document.createElement('div');

  v.setAttribute('role', 'status');
  v.setAttribute('aria-live', 'polite');
  v.textContent = metin;
  document.body.appendChild(v);
  setTimeout(function () { v.remove(); }, 5000);
}
