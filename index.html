<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>YKS Tekrar Defteri</title>
<style id="stil">
:root{
  --zemin:#F5F6F8; --kagit:#FFFFFF; --murekkep:#16202B; --soluk:#5A6675; --cizgi:#DCE0E6;
  --vurgu:#1D5B7A; --vurgu-yumusak:#E6EFF4; --vurgu-koyu:#164A63;
  --iyi:#2E7D5B; --uyari:#A9701A; --kritik:#AE4038;
  --golge:0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --zemin:#0F141A; --kagit:#171E26; --murekkep:#E7ECF2; --soluk:#93A0AF; --cizgi:#2A333E;
    --vurgu:#6FB6D8; --vurgu-yumusak:#1B2C36; --vurgu-koyu:#8FCBE6;
    --iyi:#63BE95; --uyari:#D5A24E; --kritik:#E0817A;
    --golge:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --zemin:#0F141A; --kagit:#171E26; --murekkep:#E7ECF2; --soluk:#93A0AF; --cizgi:#2A333E;
  --vurgu:#6FB6D8; --vurgu-yumusak:#1B2C36; --vurgu-koyu:#8FCBE6;
  --iyi:#63BE95; --uyari:#D5A24E; --kritik:#E0817A;
  --golge:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--zemin);color:var(--murekkep);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"IBM Plex Serif","IBM Plex Sans",Georgia,serif;font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}

.kabuk{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.ray{background:var(--kagit);border-right:1px solid var(--cizgi);padding:18px 12px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px}
.marka{font-family:"IBM Plex Serif",serif;font-size:17px;font-weight:600;padding:2px 10px 14px;letter-spacing:-.01em}
.marka small{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:10px;font-weight:500;color:var(--soluk);
  letter-spacing:.06em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.ray button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border:0;border-radius:7px;
  background:transparent;cursor:pointer;font-size:14px;font-weight:500;color:var(--soluk)}
.ray button:hover{background:var(--vurgu-yumusak);color:var(--murekkep)}
.ray button[aria-current="page"]{background:var(--vurgu-yumusak);color:var(--vurgu);font-weight:600}
.ray .bosluk{flex:1}
.durum{font-size:11.5px;color:var(--soluk);padding:8px 11px;border-top:1px solid var(--cizgi);line-height:1.45}
.durum b{color:var(--murekkep);font-weight:600}

main{padding:26px 30px 60px;max-width:1180px}
.baslik{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.baslik h1{font-size:24px}
.baslik p{margin:0;color:var(--soluk);font-size:13.5px}

.arac{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.dugme{border:1px solid var(--cizgi);background:var(--kagit);border-radius:7px;padding:8px 13px;cursor:pointer;
  font-size:13.5px;font-weight:500;box-shadow:var(--golge)}
.dugme:hover{border-color:var(--vurgu)}
.dugme.birincil{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
:root[data-theme="dark"] .dugme.birincil,
:root:not([data-theme="light"]) .dugme.birincil{color:#0F141A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .dugme.birincil{color:#fff}}
.dugme:disabled{opacity:.45;cursor:default}
select,input[type=date],input[type=number],input[type=text]{border:1px solid var(--cizgi);background:var(--kagit);
  border-radius:7px;padding:7px 9px;font-size:13.5px}
select.genis{min-width:230px;font-weight:600}
.etiket{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk);font-weight:600}

.kart{background:var(--kagit);border:1px solid var(--cizgi);border-radius:10px;box-shadow:var(--golge)}
.kutular{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kutu{padding:13px 15px}
.kutu .sayi{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
.kutu .ad{font-size:11.5px;color:var(--soluk);letter-spacing:.04em;text-transform:uppercase;font-weight:600}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soluk);
  padding:9px 10px;border-bottom:1px solid var(--cizgi)}
td{padding:8px 10px;border-bottom:1px solid var(--cizgi)}
tbody tr:last-child td{border-bottom:0}
.sayisal{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;text-align:right}
.sarma{overflow-x:auto}

.rozet{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid var(--cizgi);color:var(--soluk)}
.rozet.iyi{color:var(--iyi);border-color:currentColor}
.rozet.uyari{color:var(--uyari);border-color:currentColor}
.rozet.kritik{color:var(--kritik);border-color:currentColor}

/* ---- plan tablosu (ekranda ve kâğıtta aynı) ---- */
.sayfa{background:var(--kagit);border:1px solid var(--cizgi);border-radius:10px;padding:18px;box-shadow:var(--golge)}
.sayfa-ust{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.sayfa-ust .isim{font-family:"IBM Plex Serif",serif;font-size:19px;font-weight:600}
.sayfa-ust .tarihler{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
table.plan{table-layout:fixed;border:1px solid var(--murekkep)}
table.plan th,table.plan td{border:1px solid var(--cizgi);vertical-align:top;padding:6px 7px}
table.plan th{text-transform:none;letter-spacing:0;color:var(--murekkep);text-align:center;font-size:12px;
  border-bottom:1px solid var(--murekkep);font-weight:600}
table.plan th.tatil{color:var(--soluk);font-weight:500}
table.plan td.sira{width:34px;text-align:center;vertical-align:middle;font-weight:600;color:var(--soluk);
  font-family:"IBM Plex Mono",monospace}
table.plan td .d{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk);font-weight:600}
table.plan td .k{font-size:12.5px;line-height:1.35;margin-top:1px}
table.plan td .n{font-size:10.5px;color:var(--soluk);margin-top:3px;font-variant-numeric:tabular-nums}
table.plan td.dolu{background:var(--kagit)}
.ozet{margin-top:12px;font-size:13px;color:var(--soluk)}
.plan-duzen{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}
.anlasma{border:1px solid var(--murekkep);border-radius:4px;padding:9px 10px;font-size:11px;line-height:1.35}
.a-baslik{font-weight:700;font-size:11px;letter-spacing:.04em;text-align:center;border-bottom:1px solid var(--cizgi);
  padding-bottom:5px;margin-bottom:6px}
.a-giris{color:var(--soluk);margin-bottom:5px}
.a-maddeler{margin:0;padding-left:16px}
.a-maddeler li{margin-bottom:4px}
.a-yazma{margin-top:6px}
.a-yazma i{display:block;border-bottom:1px dotted var(--cizgi);height:18px}
.a-imza{margin-top:10px;border-top:1px solid var(--cizgi);padding-top:8px}
.rutin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.r-kutu{border:1px solid var(--cizgi);border-radius:4px;padding:7px 9px;min-height:64px}
.r-baslik{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--vurgu);margin-bottom:5px}
.r-metin{font-size:11.5px;line-height:1.4}
.r-cizgi{border-bottom:1px dotted var(--cizgi);height:15px}
.dugme.mini{padding:4px 9px;font-size:12px;white-space:nowrap}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#yapistirMetin{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
textarea{border:1px solid var(--cizgi);background:var(--kagit);border-radius:7px;padding:8px 9px;font-size:13px;
  font-family:inherit;resize:vertical}
@media (max-width:820px){.ikili{grid-template-columns:1fr}.plan-duzen{grid-template-columns:1fr}}

.giris-satir{display:grid;grid-template-columns:74px 1fr 92px 92px auto;gap:10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--cizgi)}
.giris-satir .gun{font-size:11.5px;color:var(--soluk);font-variant-numeric:tabular-nums}
.giris-satir input{width:100%;text-align:center}
.giris-kilitli{opacity:.62}
.giris-kilitli .dugme{padding:5px 10px;font-size:12px}
.gun-basi{margin:16px 0 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--vurgu);font-weight:600}

.uyari-serit{background:var(--vurgu-yumusak);border:1px solid var(--cizgi);border-left:3px solid var(--vurgu);
  padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px}
.mini{font-size:12.5px;color:var(--soluk)}
tr.pasif td{opacity:.45}
tr.pasif td:first-child{opacity:1}
.gunSec{display:flex;gap:2px}
.progTablo td{vertical-align:top;min-width:150px}
.progTablo select.progHucre{width:100%;font-size:11.5px;font-weight:600}
.konuKutu{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.konuCip{display:flex;align-items:flex-start;gap:4px;background:var(--vurgu-yumusak);border-radius:5px;
  padding:3px 5px;font-size:11.5px;line-height:1.25}
.konuCip.oneri{background:transparent;border:1px dashed var(--cizgi);color:var(--soluk);font-style:italic}
.birlesik{margin:3px 0 0;color:var(--soluk)}
.progTablo td{vertical-align:top}
.ciktiEtiket{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ciktiEtiket.secili{background:var(--vurgu-yumusak);border-color:var(--vurgu)}
.plan th.gecti{color:var(--soluk)}
.plan th.bugun{color:var(--vurgu)}
.plan td.gecti{background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--zemin) 7px,var(--zemin) 14px);
  opacity:.62;cursor:not-allowed}
.gunDugme.gecmis{opacity:.34;cursor:not-allowed;text-decoration:line-through}
.plan-liste{display:none}
@media (max-width:760px){
  .sayfa .sarma{display:none}
  .plan-liste{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .pl-gun{border:1px solid var(--cizgi);border-radius:9px;overflow:hidden}
  .pl-gun.bugun{border-color:var(--vurgu)}
  .pl-gun.gecti{opacity:.55}
  .pl-bas{display:flex;align-items:baseline;gap:9px;padding:9px 12px;background:var(--vurgu-yumusak);
    font-size:13.5px;flex-wrap:wrap}
  .pl-bas span{color:var(--soluk);font-variant-numeric:tabular-nums}
  .pl-bas em{font-style:normal;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--vurgu);font-weight:700}
  .pl-yuk{margin-left:auto;font-size:11.5px}
  .pl-oge{padding:10px 12px;border-top:1px solid var(--cizgi)}
  .pl-oge .d{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soluk);font-weight:600}
  .pl-oge .k{font-size:15px;line-height:1.35;margin-top:2px}
  .pl-oge .n{font-size:11.5px;color:var(--soluk);margin-top:3px}
  .pl-bos{padding:10px 12px;border-top:1px solid var(--cizgi);color:var(--soluk);font-size:13px}
  .plan-duzen{grid-template-columns:1fr}
  .kabuk{grid-template-columns:1fr}
  .ray{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;
    border-bottom:1px solid var(--cizgi);padding:10px}
  .ray .marka,.ray .durum{display:none}
  .ray button{width:auto;white-space:nowrap}
  main{padding:16px 14px 50px}
  .rutin{grid-template-columns:1fr}
  .ikili{grid-template-columns:1fr}
}
.kurulum{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:30px 0}
.kur-kutu{max-width:680px;width:100%}
.kur-kutu h1{font-size:34px;margin:8px 0 6px}
.kur-oz{color:var(--soluk);margin-bottom:22px}
.kur-secim{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kur-kart{text-align:left;background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;
  padding:20px 22px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
.kur-kart:hover{border-color:var(--vurgu)}
.kur-kart:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
.kur-kart b{font-size:18px}
.kur-kart span{font-size:14px;color:var(--soluk);line-height:1.5}
.kur-alt{margin-top:20px;padding-top:18px;border-top:1px solid var(--cizgi);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:620px){.kur-secim{grid-template-columns:1fr}}
.turDugme{padding:5px 14px}
.turDugme.secili{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.plan td.dolu.anlatim{background:var(--vurgu-yumusak)}
.plan td.dolu.anlatim .n b{color:var(--vurgu)}
.altUyari{margin-top:6px;padding:8px 11px;border-radius:8px;background:var(--vurgu-yumusak);
  font-size:12px;line-height:1.5;color:var(--soluk);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.altUyari b{color:var(--murekkep)}
.altUyari .dugme{padding:3px 10px;font-size:12px;white-space:nowrap;margin-left:auto}
.gunYuk{font-size:10px;font-weight:600;color:var(--soluk);letter-spacing:.03em}
.gunYuk.asti{color:var(--uyari,#B0362B)}
.programDurum{font-size:12.5px;margin:8px 0 12px;padding:9px 12px;border-radius:8px;line-height:1.5}
.programDurum.tam{background:var(--vurgu-yumusak);color:var(--soluk)}
.programDurum.eksik{background:var(--zemin);color:var(--soluk);border:1px solid var(--cizgi)}
.haritaIzgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.haritaHucre{position:relative;border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:var(--kagit)}
.haritaHucre.gelecek{opacity:.55}
.haritaHucre.simdi{border-color:var(--vurgu);box-shadow:0 0 0 1px var(--vurgu) inset}
.haritaHucre.tamam{background:var(--vurgu-yumusak)}
.haritaHucre.telafi{border-color:var(--uyari)}
.haritaHucre.telafi-anlatim{border-color:var(--vurgu)}
.haritaHucre.atlandi{border-color:var(--kritik)}
.haritaHucre.atlandi-onemsiz{border-color:var(--soluk);opacity:.75}
.haritaHucre.tiklanabilir{cursor:pointer}
.haritaHucre.tiklanabilir:hover{border-color:var(--murekkep)}
.haritaYildiz{position:absolute;top:6px;right:8px;color:var(--uyari);font-size:13px}
.haritaNo{font-size:12.5px;font-weight:600}
.haritaTarih{font-size:11px;color:var(--soluk);margin-top:1px}
.haritaEtiket{font-size:11px;margin-top:5px}
.haritaHucre.tamam .haritaEtiket{color:var(--iyi)}
.haritaHucre.atlandi .haritaEtiket{color:var(--kritik)}
.haritaHucre.atlandi-onemsiz .haritaEtiket{color:var(--soluk)}
.haritaHucre.telafi .haritaEtiket{color:var(--uyari)}
.haritaHucre.telafi-anlatim .haritaEtiket{color:var(--vurgu)}
.haritaHucre.simdi .haritaEtiket{color:var(--vurgu)}
.haritaPanel{margin:-2px 0 8px}
.bugunSerit{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soluk)}
.bugunSerit b{color:var(--vurgu)}
.cipSil{border:0;background:transparent;color:var(--soluk);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;margin-left:auto}
.cipSil:hover{color:var(--kritik)}
.konuAta{font-size:11px;padding:3px 5px}
.gunDugme{width:24px;height:26px;border:1px solid var(--cizgi);background:var(--kagit);border-radius:5px;
  cursor:pointer;font-size:11px;font-weight:600;color:var(--soluk);padding:0}
.gunDugme.kapali{background:var(--vurgu-yumusak);border-color:var(--vurgu);color:var(--vurgu)}
#tumu{display:none}
.topluEtiket{display:block;font-size:10px;color:var(--vurgu);font-weight:600;margin-bottom:2px;cursor:pointer}
.bildirim{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--murekkep);color:var(--kagit);
  padding:11px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:80;max-width:min(560px,92vw)}
table.plan td[data-hucre]{cursor:pointer}
table.plan td[data-hucre]:hover{outline:2px solid var(--vurgu);outline-offset:-2px}
[data-hucre]:focus-visible{outline:3px solid var(--vurgu);outline-offset:-3px}
table.plan td.bos:hover::after{content:'+ konu ekle';font-size:11px;color:var(--vurgu);display:block;padding:2px}
table.plan td.suruklenen{opacity:.35}
table.plan td.hedef{outline:2px dashed var(--vurgu);outline-offset:-2px;background:var(--vurgu-yumusak)}
.ortu{position:fixed;inset:0;background:rgba(16,21,26,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 16px;z-index:50}
.pencere{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.28);
  width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.p-ust{padding:12px 14px;border-bottom:1px solid var(--cizgi);font-size:13.5px;position:relative}
.kapat{position:absolute;right:8px;top:7px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;
  color:var(--soluk);padding:2px 8px;border-radius:6px}
.kapat:hover{background:var(--vurgu-yumusak);color:var(--murekkep)}
.p-konu{padding:12px 14px;border-bottom:1px solid var(--cizgi);background:var(--vurgu-yumusak)}
.p-ad{font-family:"IBM Plex Serif",serif;font-size:16px;font-weight:600;margin:1px 0 2px}
.p-satir{display:flex;align-items:center;gap:10px;margin-top:9px}
.p-satir label{font-size:12px;font-weight:600;color:var(--soluk);min-width:110px}
.p-satir input[type=number]{width:80px}
.p-dugmeler{margin-top:11px}
.p-gunler{padding:10px 14px;border-bottom:1px solid var(--cizgi);display:flex;align-items:center;gap:12px}
.p-gunler .etiket{white-space:nowrap}
.kapsamDugme{padding:5px 9px;font-size:12px}
.kapsamDugme.secili{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
:root[data-theme="dark"] .kapsamDugme.secili{color:#0F141A}
.p-yaz{padding:11px 14px;border-bottom:1px solid var(--cizgi)}
.p-yaz input[type=text],.p-yaz input:not([type]),.p-yaz #pSerbestAd{width:100%;margin-top:5px}
.p-yaz .p-satir{margin-top:7px}
.p-yaz select{flex:1}
.p-yaz input[type=number]{width:74px}
.p-adGiris{width:100%;font-family:"IBM Plex Serif",serif;font-size:15px;font-weight:600;margin:2px 0}
.p-ara{padding:10px 14px;border-bottom:1px solid var(--cizgi)}
.p-ara input{width:100%}
.p-liste{overflow-y:auto;padding:6px}
.p-oge{display:grid;grid-template-columns:88px 1fr;gap:2px 10px;width:100%;text-align:left;border:0;background:transparent;
  padding:7px 9px;border-radius:7px;cursor:pointer}
.p-oge:hover{background:var(--vurgu-yumusak)}
.p-oge .p-ders{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk);font-weight:600;padding-top:2px}
.p-oge .p-baslik{font-size:13.5px;font-weight:500}
.p-oge .mini{grid-column:2}
.sekme-mobil{display:none}

@media (max-width:820px){

    if (!o.rutin || typeof o.rutin !== 'object' || Array.isArray(o.rutin)) o.rutin = {};
    ['once', 'ara', 'sonra'].forEach(k => { if (typeof o.rutin[k] !== 'string') o.rutin[k] = ''; });
    if (!Array.isArray(o.off)) o.off = (o.tatil === undefined || o.tatil === null || o.tatil < 0) ? [] : [o.tatil];
    delete o.tatil;
  });
  // v10: Daha önce "sabit" işaretlenmiş haftaları gerçek birer plan anlığına çevir.
  // Eski sürümlerde yalnızca hücre konumları tutuluyordu; sonradan eklenen adaylar bu
  // haftalara sızabiliyordu. `planHesapla`, plan anlığı olmayan eski sabit kayıtlarda
  // yalnızca `yer` içindeki üyeleri kullanarak güvenli bir geriye-uyum görünümü üretir.
  if (eskiSurum < 10) {
    Object.keys(D.elle || {}).forEach(a => {
      const par = a.split('|'), si = +par[0], hb = +par[1], ov = D.elle[a];
      if (!ov || !ov.sabit || ov.plan || !Number.isInteger(si) || !D.ogr[si] || !Number.isInteger(hb)) return;
      try { planAnliginiKaydet(si, hb, planHesapla(si, hb)); }
      catch (e) { console.warn('[YKS Tekrar Defteri] Eski sabit hafta dönüştürülemedi:', a, e); }
    });
  }
  dersAdlariniTazele();
  donemHizala();
  return tutarlilikUyarilari();
}

async function durumuYukle() {

  adaylar.sort((a, b) => (+b.veri.rev || 0) - (+a.veri.rev || 0) || (+b.veri.ts || 0) - (+a.veri.ts || 0));
  const gecersiz = [];

}
// --- teşhis: "olmaması gereken" durumları arar, HİÇBİR VERİYİ DEĞİŞTİRMEZ — yalnızca
// konsola yazar ve açılışta kısa bir bildirim gösterir. donemHizala()'nın aksine burada
// otomatik bir "düzeltme" YOK: geçmişte gerçek veriyi bozan birkaç hatanın (cikti/ilkAktif
// karışıklığı, dönem başı sıkışması gibi) ortak belirtisi hep buradaki türden bir tutarsızlıktı,
// ama fark edilmesi hep bir kullanıcı şikâyetini bekledi. Bunları sessizce göz ardı etmek
// yerine görünür kılmak, "gerçek yedekle test et" alışkanlığının açılışta otomatik çalışan hâli.
function tutarlilikUyarilari() {
  const uyari = [];
  const donemG = gunNo(D.ayar.donemBasi);
  const sinavG = gunNo(D.ayar.sinav);
  if (donemG > sinavG) uyari.push('Dönem başı (' + ggyy(donemG) + ') YKS tarihinden (' + ggyy(sinavG) + ') sonra görünüyor.');

  const erken = t => typeof t === 'number' && t < donemG;
  if (Object.keys(D.islenis || {}).some(k => erken(D.islenis[k])))
    uyari.push('Genel "işlendi" kayıtlarından en az biri dönem başından önceki bir tarihte.');
  Object.keys(D.subeIslenis || {}).forEach(su => {
    if (Object.keys(D.subeIslenis[su] || {}).some(k => erken(D.subeIslenis[su][k])))
      uyari.push('"' + su + '" şubesinin işlendi kayıtlarından en az biri dönem başından önceki bir tarihte.');
  });
  Object.keys(D.ogrIslenis || {}).forEach(si => {
    if (Object.keys(D.ogrIslenis[si] || {}).some(k => erken(D.ogrIslenis[si][k])))
      uyari.push('Bir öğrencinin işlendi kayıtlarından en az biri dönem başından önceki bir tarihte.');
  });

  const kartSorunlu = Object.keys(D.kart || {}).filter(k => {
    const c = D.kart[k];
    return typeof c.due === 'number' && typeof c.son === 'number' && c.due < c.son;
  });
  if (kartSorunlu.length) uyari.push(kartSorunlu.length + ' kartın bir sonraki tekrar tarihi, son görülme tarihinden önce görünüyor.');

  // h < 1 (dönem henüz başlamadı) kasıtlı ve desteklenen bir durum — donemElle=true ile
  // ileri tarihli bir dönem kurulduğunda tam olarak beklenen hâl budur, uyarılmaz.
  // h > n (konu planı bitmiş, hâlâ o haftadayız) ise gerçekten dikkat gerektirir: ya plan
  // dönemin geri kalanını kapsamıyor ya da dönem başı yanlışlıkla çok geride kalmış.
  Object.keys(D.konuPlani || {}).forEach(su => {
    const n = planHaftaSayisi(su);
    if (!n) return;
    if (!(D.ogr || []).some(o => !o.silindi && o.sube === su)) return;    // öğrencisiz şube uyarıyı gereksiz kirletmesin
    const h = haftaNo(buHafta());
    if (h > n) uyari.push('"' + su + '" şubesi: içinde bulunulan hafta (' + h + '. hafta) konu planının (' +
      n + ' hafta) sonunu geçmiş — içerik son haftaya sıkışıyor olabilir.');
  });

  return uyari;
}

async function kaydetGercek(sessiz) {

  let json;

  catch (e) {
    EK.kirli = true; EK.son = 'kaydedilemedi — veri JSON’a çevrilemedi'; rayCiz(); return false;
  }

  let yerelBasarili = false, bulutBasarili = false, yerelHata = null, bulutHata = null;

          await a.publish(tamBelge(JSON.parse(json)));
          bulutBasarili = true; bulutHata = null;

    }
  }

  const kalici = yerelBasarili || bulutBasarili;
  EK.kirli = !kalici;
  const saat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  if (yerelBasarili && bulutBasarili) EK.son = 'kaydedildi · ' + saat;
  else if (yerelBasarili && bulutHata && bulutHata.code === 'conflict')
    EK.son = 'cihazda kayıtlı · bulut çakışması, yedek alın';
  else if (yerelBasarili && bulutHata && (bulutHata.code === 'not_writer' || bulutHata.code === 'not_granted'))
    EK.son = 'cihazda kayıtlı · buluta yazma izni yok';
  else if (yerelBasarili) EK.son = a ? 'cihazda kayıtlı · bulut kaydı başarısız' : 'cihazda kaydedildi · ' + saat;
  else if (bulutBasarili) EK.son = 'bulutta kayıtlı · cihaz depolaması kapalı';
  else EK.son = 'KAYDEDİLEMEDİ · yedek indirin';
  if (!kalici) console.error('[YKS Tekrar Defteri] Kayıt başarısız', { yerelHata: yerelHata, bulutHata: bulutHata });
  rayCiz();
  if (!sessiz) ciz();
  return kalici;
}

function alanUygun(si, ki) {

const buHafta = () => pazartesi(bugunNo());
// ileri doldurma ufku: ayar yoksa, null'sa ya da bozuksa 8 hafta
function ileriHaftaSayisi() {
  const v = D && D.ayar ? D.ayar.ileriHafta : undefined;
  const n = (v === undefined || v === null || isNaN(+v)) ? 8 : +v;
  return Math.max(0, Math.min(300, n));
}
// ileri doldurmanın başlayacağı hafta: bugünün haftası, ama dönem başından ÖNCE olamaz.
// Aksi hâlde (program dönem başlamadan önce girilirse) bugünün haftası ve dönem başı
// arasındaki her takvim haftası planHaftasi() tarafından aynı 1. plan haftasına
// sıkıştırılır; programUygula bir konuyu yalnızca BİR KEZ işler, o yüzden ilk sıkışan
// hafta içeriği alır, aradaki haftalar boş kalır (dönem başına kadar) — bu düzeltme
// doldurmayı hiçbir zaman dönem başından daha erken başlatmayarak bunu önler.
function ileriDagitBaslangic() {
  return Math.max(buHafta(), pazartesi(gunNo(D.ayar.donemBasi)));
}
// YKS tarihine kadar kaç hafta kaldığı — "sınava kadar doldur" kısayolu için
function haftaSinavaKadar() {
  return Math.max(1, Math.ceil((gunNo(D.ayar.sinav) - buHafta()) / 7));
}
// ders programı herhangi bir şekilde değiştiğinde (hücre, PDF, boş tablo, devralma,
// yeni öğrenci kurulumu) gelecek haftaları hemen yeniden doldur — sayfa yenilenmesini beklemesin.
// Önce bu haftadan itibaren HENÜZ SONUÇLANMAMIŞ yerleşimler geri alınır (dagitimiGeriAl zaten
// kartı/kaydı olan konuya dokunmaz), sonra (belki değişmiş) programla yeniden dağıtılır —
// yoksa eski programla bir kez yerleşmiş konu yeni program yüklense de asla taşınmaz.
function programDegistiTetikle(sube) {
  try {
    if (Object.keys(D.konuPlani || {}).length && Object.keys(D.dersProgrami || {}).length) {
      const n = Math.max(1, ileriHaftaSayisi());
      const hb0 = ileriDagitBaslangic();
      for (let k = 0; k < n; k++) dagitimiGeriAl(hb0 + k * 7, sube);
      ileriDagit(hb0, sube || null, n);
    }
  } catch (e) { /* dolduramazsa program yine de kaydedilmiş olsun */ }
}
function haftaBasi() {
  const b = buHafta();
  // düzenleme açıkken ekran o haftada açılır; kapanınca yine içinde bulunulan haftaya döner
  if ((EK.hafta === null || EK.hafta === undefined) && duzenlenenHafta() !== null) return duzenlenenHafta();
  if (EK.hafta === null || EK.hafta === undefined) return b;
  if (Math.abs(EK.hafta - b) > 400) { EK.hafta = null; return b; }   // saçma bir haftada kalmayalım
  return EK.hafta;
}
// bu hafta içindeysek geçmiş günlere iş yazılamaz: ilk yazılabilir gün
function ilkGun(hb) {
  if (D.ayar.gecmisSerbest || duzenlemeAcik(hb)) return hb;
  const b = bugunNo();
  return (b > hb && b <= hb + 6) ? b : hb;
}
// O haftaya ait girilmiş sonuç sayısı. Bir tane bile varsa hafta gerçekten dokunulmazdır:
// FSRS o sonuçlara göre sonraki tarihleri hesapladı, düzeni değiştirmek geçmişi çarpıtır.
function haftaSonucSayisi(si, hb) {
  return (D.log || []).filter(l => l[1] === si && l[0] >= hb && l[0] <= hb + 6).length;
}
// Düzenleme kipi. EK yerine D içinde tutulur: sayfa yenilense, uygulama kapanıp
// açılsa bile açık kalır — yalnızca "düzenlemeyi bitir" denince kapanır.
const duzenlenenHafta = () => (D && D.duzenleHafta !== undefined && D.duzenleHafta !== null)
  ? D.duzenleHafta : null;
const duzenlemeAcik = hb => duzenlenenHafta() === hb && !haftaSonucSayisi(EK.ogr, hb);
const gunGecti = (hb, g) => !D.ayar.gecmisSerbest && !duzenlemeAcik(hb) && (hb + g) < bugunNo();
const bugunMu = (hb, g) => (hb + g) === bugunNo();

const TR_HARF = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'i': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u' };
const norm = t => String(t).toLocaleLowerCase('tr').replace(/[çğıiöşüâîû]/g, c => TR_HARF[c] || c);

// tüm takvimi n hafta kaydırır (işleniş, kartlar, kayıtlar, elle düzen, ders programı, ayarlar)
function takvimiKaydir(hafta) {
  const g = hafta * 7;
  if (!g) return;
  const yeni = {};
  Object.keys(D.islenis || {}).forEach(k => { yeni[k] = D.islenis[k] + g; });
  D.islenis = yeni;
  Object.keys(D.subeIslenis || {}).forEach(su => {
    const y = {};
    Object.keys(D.subeIslenis[su]).forEach(k => { y[k] = D.subeIslenis[su][k] + g; });
    D.subeIslenis[su] = y;
  });
  Object.keys(D.kart || {}).forEach(k => {
    const c = D.kart[k];
    if (typeof c.son === 'number') c.son += g;
    if (typeof c.due === 'number') c.due += g;
  });
  (D.log || []).forEach(l => { l[0] += g; });
  const elleYeni = {};
  Object.keys(D.elle || {}).forEach(k => {
    const par = k.split('|');
    elleYeni[par[0] + '|' + (+par[1] + g)] = D.elle[k];
  });
  D.elle = elleYeni;
  Object.keys(D.programHafta || {}).forEach(su => {
    const y = {};
    Object.keys(D.programHafta[su]).forEach(k => { y[+k + g] = D.programHafta[su][k]; });
    D.programHafta[su] = y;
  });
  (D.ogr || []).forEach(o => { if (typeof o.cikti === 'number') o.cikti += g; });
  if (D.ayar.planBasi) D.ayar.planBasi = isoDan(gunNo(D.ayar.planBasi) + g);
  // Bu, kullanıcının "planı ileri/geri al" düğmesiyle bilerek verdiği bir karardır
  // (ör. sınıf bir hafta ara verdi) — otomatik bir tahmin değil, o yüzden elleMi=true:
  // donemHizala() bu kaydırmayı sonradan sessizce geri almasın.
  if (D.ayar.donemBasi) donemBasiniAyarla(isoDan(gunNo(D.ayar.donemBasi) + g), true);
}

function elleAl(si, hb, olustur) {
  const a = si + '|' + hb;
  // yalnızca gerçekten yazılacaksa D.elle'i oluştur — okuma amaçlı çağrılar (olustur
  // verilmemiş) D'ye hiç dokunmamalı; planHesapla gibi "salt okunur" sayılan fonksiyonlar
  // buradan geçiyor, kayıt tutan bir konteyner boş bile olsa sessizce oluşturulmamalı.
  if (olustur && (!D.elle || !D.elle[a])) {
    D.elle = D.elle || {};
    D.elle[a] = D.elle[a] || { ek: [], sil: [], yer: {}, soru: {}, degisim: {}, konuSlot: {} };
  }
  return (D.elle || {})[a] || { ek: [], sil: [], yer: {}, soru: {}, degisim: {}, konuSlot: {} };
}

const planSlotAnahtari = x => x && x.slotKi !== undefined ? x.slotKi : x && x.ki;

// Kullanıma alınmış bir hafta artık canlı hesap değil, tarihsel kayıttır. Planın tamamını
// saklamak; yalnızca hücre koordinatlarını saklamaktan farklı olarak sonradan işlenen,
// içe aktarılan veya telafi için eklenen konuların eski kâğıda sızmasını engeller.
function planAnliginiKaydet(si, hb, p) {
  const ov = elleAl(si, hb, true);
  ov.plan = {
    surum: 2,
    slotlar: (p.gunler || [[], [], [], [], [], [], []]).map(liste =>
      liste.map(x => String(planSlotAnahtari(x)))),
    off: (p.off || []).slice(), kap: p.kap,
    devreden: p.devreden || 0, tasan: (p.tasan || []).slice()
  };
  return ov.plan;
}

function bosHaftaPlani(si, ov, kayitYok) {
  const o = D.ogr[si] || {}, kap = Math.max(1, o.kap || 6), gunler = [[], [], [], [], [], [], []];
  return { gunler: gunler, devreden: 0, tasan: [], toplam: 0, bekleyen: [], testToplam: 0,
           gunYuk: [0, 0, 0, 0, 0, 0, 0], kap: kap, off: Array.isArray(o.off) ? o.off.slice() : [],
           elle: ov, kayitYok: !!kayitYok };
}

function sabitPlandaKonuVar(si, ki) {
  return Object.keys(D.elle || {}).some(a => {
    const par = a.split('|'), ov = D.elle[a];
    if (+par[0] !== si || !ov || !ov.sabit) return false;
    if (ov.plan && Array.isArray(ov.plan.slotlar)) {
      return ov.plan.slotlar.some(liste => Array.isArray(liste) && liste.some(slot => {
        if (ov.konuSlot && ov.konuSlot[slot]) return +(ov.konuSlot[slot] || {}).ki === ki;
        if (ov.degisim && ov.degisim[slot] !== undefined) return +ov.degisim[slot] === ki;
        return +slot === ki;
      }));
    }
    // v9 ve daha eski sabit haftalar için geriye uyum: değiştirilmiş/eklenmiş hücrenin
    // gerçek konu kimliğini de kontrol et, yalnızca kaynak slot kimliğini değil.
    if (ov.yer && ov.yer[ki] !== undefined && (!ov.degisim || ov.degisim[ki] === undefined)) return true;
    if (Object.keys(ov.degisim || {}).some(k => +(ov.degisim || {})[k] === ki && ov.yer && ov.yer[k] !== undefined)) return true;
    return Object.keys(ov.konuSlot || {}).some(k => +(ov.konuSlot[k] || {}).ki === ki && ov.yer && ov.yer[k] !== undefined);
  });
}

// --- yapılamayan konunun ertelenmesi (sonuç girilmeden tarih kaydırma)
const erteleAl = (si, ki) => (D.ertele || {})[si + ':' + ki];
function erteleSil(si, ki) { if (D.ertele) delete D.ertele[si + ':' + ki]; }

// baslangic gününden itibaren öğrencinin tatil günü olmayan ilk gün
function ilkUygunGun(si, baslangic) {
  const off = Array.isArray(D.ogr[si].off) ? D.ogr[si].off : [];
  let g = baslangic;

// konuyu sonuç yazmadan ileri al; nereye düştüğünü döndürür

}

// Konunun çıktısı verilmiş ama sonucu girilmemiş mi?
// Kart yoksa hiç sonuç girilmemiştir. Vadesi bu haftadan önceye düşüyorsa ve öğrenciye
// o vadeyi kapsayan hafta için çıktı verilmişse, konu kâğıda çıkmış demektir —
// sonucu girilmeden yeniden planlanmaz, "sonuç bekleyen" listesinde durur.
function sonucBekliyor(si, ki, kart, due, hb) {
  if (kart) return false;                       // sonuç girilmiş, normal akış
  if (due >= hb) return false;                  // vadesi bu hafta veya sonrası
  const ert = erteleAl(si, ki);
  if (ert !== undefined && ert >= hb) return false;   // elle ileri alınmış, bekleyen değil
  // Tek yetkili kaynak gerçek plan anlığıdır. Konunun işleniş tarihi öğrencinin katılımından
  // önce olsa veya izin gününe denk gelse bile, sabit planda gerçekten yer aldıysa artık
  // sonuç bekliyordur. Tarih sezgileri burada kullanılırsa telafi konuları yeniden yazılır.
  return sabitPlandaKonuVar(si, ki);
}

// --- haftalar haritası: atlanmış bir haftanın telafisi
// Bir haftanın bütün konularını olduğu gibi "hedef+7"ye yığmak sonraki haftanın
// kapasitesini (günde en fazla `kap` birim) taşırabilir — planHesapla'nın sıralı
// yerleştirme algoritması dolan bir güne rastlayınca geri dönüp boşluk doldurmaz,
// üstüne üstlük fazlalığı sessizce düşürür ("tasan"). Bu yüzden telafi konuları tek
// tek, o güne kadar zaten ne kadar yük birikmiş olduğunu izleyerek, gerekirse birden
// çok haftaya yayılacak şekilde yerleştirilir — asla dolu bir güne zorlanmaz.
function telafiGunuYuku(si, gun, yukTakip) {
  if (yukTakip[gun] === undefined) {
    const hb = pazartesi(gun);
    yukTakip[gun] = (planHesapla(si, hb).gunYuk || [])[gun - hb] || 0;
  }
  return yukTakip[gun];
}
function telafiGunBul(si, baslangic, yukTakip, agirlik) {
  const kap = Math.max(1, D.ogr[si].kap || 6);
  let g = ilkUygunGun(si, baslangic);
  for (let i = 0; i < 120; i++) {                     // en fazla ~4 ay ileriye kadar bak
    if (telafiGunuYuku(si, g, yukTakip) + agirlik <= kap) { yukTakip[g] += agirlik; return g; }
    g = ilkUygunGun(si, g + 1);
  }
  yukTakip[g] = (yukTakip[g] || 0) + agirlik;
  return g;
}
// öğrencinin/şubenin günlük telafi-anlatımı sınırı: bazı öğrenciler bir günde çok sayıda
// "konu anlatımı" kaldıramaz, bazıları daha hızlı toparlamak ister — öğrenciye özel
// ayarlanmadıysa genel varsayılan kullanılır.
function telafiAnlatimSiniri(si) {
  const o = D.ogr[si] || {};
  const ozel = o.telafiGunKap;
  return Math.max(1, (ozel === undefined || ozel === null ? D.ayar.telafiGunKap : ozel) || 2);
}
// telafi anlatımlarını hangi HAFTAYA yazacağımızı bulur — GÜN içindeki dağılımı artık
// planHesapla'nın kendisi yapıyor (bkz. anlatimSiniriGun orada), günde en fazla N tane
// kuralına uyarak. Burada yalnızca bir haftanın toplam anlatım kapasitesini (kullanılabilir
// gün sayısı × günlük sınır) aşmayacak şekilde haftalar arasında taşma kontrolü yapılır.
function telafiAnlatimHaftaBul(si, baslangicHb, haftaTakip, siniri) {
  const off = Array.isArray(D.ogr[si].off) ? D.ogr[si].off : [];
  const kullanilabilirGun = Math.max(1, 7 - off.length);
  let hb2 = pazartesi(baslangicHb);
  for (let i = 0; i < 26; i++) {                     // ~6 ay ileriye kadar bak
    if (haftaTakip[hb2] === undefined)
      haftaTakip[hb2] = Object.keys(elleAl(si, hb2).anlatim || {}).length;
    if (haftaTakip[hb2] < kullanilabilirGun * siniri) { haftaTakip[hb2]++; return hb2; }
    hb2 += 7;
  }
  haftaTakip[hb2] = (haftaTakip[hb2] || 0) + 1;
  return hb2;
}

const HAFTA_NEDEN_ETIKET = {
  geldi_cozmedi: 'okula geldi, testleri kaldı',
  gelmedi_cozmedi: 'okula gelmedi, telafi anlatımı eklendi',
  cozdu_gelmedi: 'test çözdü, yeni konular telafiye eklendi',
  onemsiz: 'önemsiz sayıldı, atlandı'
};
const HAFTA_NEDEN_ACIKLAMA = {
  geldi_cozmedi: 'Okula geldi, sadece testler çözülmedi. O haftanın ve devreden eski haftaların testleri bir hafta sonrasına ertelenecek.',
  gelmedi_cozmedi: 'Okula gelmedi, hiçbir şey yapılmadı. Devreden eski haftaların testleri ertelenecek; o haftanın hiç işlenmemiş yeni konuları sonraki haftaya “konu anlatımı” olarak eklenecek — öğrenci anlatıldı/izledi dedikten sonra ilk testleri normal akışa girer.',
  cozdu_gelmedi: 'Okula gelmedi ama testleri kendi çözdü. Devreden eski konulara dokunulmayacak; o haftanın hiç işlenmemiş yeni konuları sonraki haftaya “konu anlatımı” olarak eklenecek — öğrenci anlatıldı/izledi dedikten sonra ilk testleri normal akışa girer.',
  onemsiz: 'Hiçbir şey ertelenmez, hiçbir konu telafiye eklenmez — bu hafta sadece “karara bağlandı” olarak işaretlenip haritada gri görünür, bir daha sormaz.'
};

// bir haftayı "yapılamadı" olarak işaretleyip nedene göre telafi eder:
// - geldi_cozmedi: konu okulda işlenmiş, sadece testler bir hafta sonrasına kayar
// - gelmedi_cozmedi: eski (devreden) haftaların testleri kayar; o haftanın YENİ
//   konuları hiç işlenmemiş sayılır, sonraki haftanın ilk 3 gününe sıkıştırılmış
//   konu anlatımı olarak taşınır
// - cozdu_gelmedi: eski haftalardan devreden konular normal çözülür (dokunulmaz),
//   yalnızca o haftanın YENİ konuları (hiç işlenmemiş) telafiye taşınır
function haftayiTelafiEt(si, hb, neden) {
  const hs = hb + 6;
  const o = D.ogr[si];
  D.subeIslenis = D.subeIslenis || {};
  D.ogrIslenis = D.ogrIslenis || {};
  D.ogrIslenis[si] = D.ogrIslenis[si] || {};
  const suIsl = D.subeIslenis[o.sube] || {};
  const ogIsl = D.ogrIslenis[si];
  const islenisAl = ki => (ogIsl[ki] !== undefined ? ogIsl[ki] : suIsl[ki] !== undefined ? suIsl[ki] : D.islenis[ki]);
  const aday = {};
  for (const a in D.islenis) aday[+a] = 1;
  for (const a in suIsl) aday[+a] = 1;
  for (const a in ogIsl) aday[+a] = 1;
  for (const a in D.kart) { const par = a.split(':'); if (+par[0] === si) aday[+par[1]] = 1; }
  const ilkBuHafta = [], devirBuHafta = [];
  for (const anahtar in aday) {
    const ki = +anahtar;
    const kk = konuAl(ki);
    if (!kk || kk[6]) continue;
    if (!alanUygun(si, ki)) continue;
    const t = islenisAl(ki);
    if (t === undefined) continue;
    const kart = D.kart[si + ':' + ki];
    if (t >= hb && t <= hs && !kart) { ilkBuHafta.push(ki); continue; }        // bu hafta ilk kez işlenmiş, henüz test yazılmamış
    const due = kart ? kart.due : t + D.ayar.ilk;
    if (t < hb && due >= hb && due <= hs) devirBuHafta.push({ ki: ki, kart: kart, due: due });  // önceki haftalardan devreden tekrar
  }
  const yukTakip = {};
  let testErtelenen = 0, konuKaydirilan = 0;
  if (neden === 'geldi_cozmedi' || neden === 'gelmedi_cozmedi') {
    devirBuHafta.sort((a, b) => a.due - b.due);
    devirBuHafta.forEach(x => {
      const agirlik = !x.kart || x.kart.y < D.ayar.esik[1] ? 2 : 1;
      const hedef = telafiGunBul(si, hb + 7, yukTakip, agirlik);
      if (x.kart) x.kart.due = hedef; else konuyuErtele(si, x.ki, hedef);
      testErtelenen++;
    });
  }
  if (neden === 'geldi_cozmedi') {
    ilkBuHafta.forEach(ki => {
      const hedef = telafiGunBul(si, hb + 7, yukTakip, 2);
      konuyuErtele(si, ki, hedef);
      testErtelenen++;
    });
  } else if (neden === 'gelmedi_cozmedi' || neden === 'cozdu_gelmedi') {
    // konuyu doğrudan "işlenmiş" saymak yerine, öğrencinin göreceği gerçek bir
    // "KONU ANLATIMI" satırı olarak ekle — "anlatıldı/izledi" işaretlenince zaten
    // D.ogrIslenis'e yazılıp ilk testi normal akışa girer (anlatimTamam).
    // Önce TÜM konuların hedef gününü belirleyip anlatim kaydını yazıyoruz, ancak
    // ondan SONRA etkilenen haftaları donduruyoruz — tek tek anlatimEkle çağırıp o an
    // dondurursak, henüz sırası gelmemiş bir sonraki konu için bu hafta hâlâ "eski
    // işlendiği haftadaki" gibi görünüp yanlışlıkla dondurulmuş halde kopya kalabiliyordu.
    const etkilenenHaftalar = {};
    const haftaTakip = {};
    const anlatimSiniri = telafiAnlatimSiniri(si);
    ilkBuHafta.forEach(ki => {
      const hb2 = telafiAnlatimHaftaBul(si, hb + 7, haftaTakip, anlatimSiniri);
      const ov2 = elleAl(si, hb2, true);
      ov2.anlatim = ov2.anlatim || {};
      ov2.anlatim[ki] = { kaynak: 'telafi' };
      ov2.sil = (ov2.sil || []).filter(k => k !== ki);
      etkilenenHaftalar[hb2] = true;
      konuKaydirilan++;
    });
    // Gün içindeki dağılımı (en fazla N anlatım/gün, olabildiğince yakın güne) artık
    // planHesapla'nın kendisi yapıyor — burada yalnızca hangi haftaya yazıldığını
    // dondurmak yeterli.
    Object.keys(etkilenenHaftalar).map(Number).forEach(hb2 => dondur(si, hb2, planHesapla(si, hb2)));
  }
  D.haftaDurum = D.haftaDurum || {};
  D.haftaDurum[si + '|' + hb] = { neden: neden, tarih: bugunNo(), test: testErtelenen, konu: konuKaydirilan };
  return { testErtelenen: testErtelenen, konuKaydirilan: konuKaydirilan };
}

function planHesapla(si, hb, derinlik) {
  derinlik = derinlik || 0;
  const hs = hb + 6, o = D.ogr[si];
  const ov = elleAl(si, hb);
  // Tarihsel bir hafta için kullanılmış plan kaydı yoksa bugünkü aday havuzuyla geçmişi
  // yeniden yazma. Öğretmen açıkça düzenleme kipini açarsa eski veriyi onarmak için canlı
  // hesap yine kullanılabilir; normal görüntüleme ise "kayıt yok" olarak kalır.
  if (hb < buHafta() && !ov.sabit && !duzenlemeAcik(hb)) return bosHaftaPlani(si, ov, true);
  // gelecek haftaya bakılıyorsa: önceki haftada yer bulamamış konular buraya devreder
  let devir = [];
  if (hb > buHafta() && derinlik < 4) {
    const onceki = planHesapla(si, hb - 7, derinlik + 1);
    devir = onceki.tasan || [];
  }
  const kap = Math.max(1, (ov.sabit && ov.plan && ov.plan.kap) || o.kap || 6);
  const off = ov.sabit && ov.plan && Array.isArray(ov.plan.off) ? ov.plan.off.slice()
            : Array.isArray(o.off) ? o.off : [];
  // Sabit haftada `yer` yalnızca konum değil, üyelik sınırıdır. Bu sınır uygulanmazsa
  // sonradan eklenen her yeni aday eski kâğıda sızar.
  const sabitli = !!ov.sabit;
  const suIsl = (D.subeIslenis || {})[o.sube] || {};
  const ogIsl = (D.ogrIslenis || {})[si] || {};
  const islenisAl = ki => (ogIsl[ki] !== undefined ? ogIsl[ki]
                        : suIsl[ki] !== undefined ? suIsl[ki] : D.islenis[ki]);
  const aday = {};
  for (const a in D.islenis) aday[+a] = 1;
  for (const a in suIsl) aday[+a] = 1;
  for (const a in ogIsl) aday[+a] = 1;
  for (const a in D.kart) { const par = a.split(':'); if (+par[0] === si) aday[+par[1]] = 1; }
  if (sabitli) Object.keys(ov.yer || {}).forEach(k => { if (Number.isInteger(+k)) aday[+k] = 1; });
  // bir konu BAŞKA bir haftada "konu anlatımı" olarak bekliyorsa (telafi vb.), o hafta
  // gelene kadar buradaki eski işleniş tarihinden ötürü ikinci kez normal aday olarak
  // çıkmasın — yoksa hem kendi anlatım haftasında hem burada aynı anda görünür (kopya)
  const digerHaftaAnlatimKi = {};
  Object.keys(D.elle || {}).forEach(a => {
    const par = a.split('|');
    if (+par[0] !== si || +par[1] === hb) return;
    const ov2 = D.elle[a];
    if (ov2.anlatim) Object.keys(ov2.anlatim).forEach(k => { digerHaftaAnlatimKi[k] = 1; });
  });
  const liste = [], bekleyen = [];
  const oncekiHaftaSabit = hb > buHafta() && !!elleAl(si, hb - 7, false).sabit;
  for (const anahtar in aday) {
    const ki = +anahtar;
    const kk = konuAl(ki);
    const pinli = !!(ov.yer && ov.yer[ki] !== undefined);
    if (!kk || (kk[6] && !pinli)) continue;
    if (!pinli && !alanUygun(si, ki)) continue;
    const kart = D.kart[si + ':' + ki];
    // bu hafta zaten dondurulmuşsa (yer atanmışsa) konu, güncel vadesi ne olursa olsun
    // burada görünmeye devam eder — dondurulmuş bir hafta verilmiş kâğıdın tıpatıp aynısı kalmalı
    if (sabitli && !pinli) continue;
    if (!pinli && digerHaftaAnlatimKi[ki]) continue;
    let due;
    if (kart) due = kart.due;
    else if (islenisAl(ki) !== undefined) { const t = islenisAl(ki); if (t > hs && !pinli) continue; due = t + D.ayar.ilk; }
    else if (pinli) due = hb;
    else continue;
    const ert = erteleAl(si, ki);            // "yapamadı" denmişse vade oraya kayar
    if (ert !== undefined && ert > due) due = ert;
    // gelecek haftalara bakarken, vadesi daha önceki bir haftaya düşen konu buraya taşınmaz —
    // sonucu girilmeden sonraki tarihi belli olmaz. Yalnızca yer bulamayıp devredenler gelir.
    if (!pinli && hb > buHafta() && due < hb && devir.indexOf(ki) < 0 && !oncekiHaftaSabit) continue;
    // çıktısı verilmiş ama sonucu girilmemiş konu: yeni haftaya taşınmaz, sonucu beklenir.
    // (elle "bu haftaya al" denmişse ov.ek içindedir, aşağıda yine eklenir; kendi dondurulmuş
    // haftasındaysa zaten kendi kâğıdıdır, bekleyene düşmez)
    if (!pinli && sonucBekliyor(si, ki, kart, due, hb) && (ov.ek || []).indexOf(ki) < 0) {
      bekleyen.push({ ki: ki, due: due });
      continue;
    }
    if (due <= hs || pinli) liste.push({ ki: ki, due: due, ders: konuAl(ki)[0], kart: kart });
  }
  liste.sort((a, b) => a.due - b.due || a.ki - b.ki);
  const sayac = {};
  liste.forEach(x => { sayac[x.ders] = (sayac[x.ders] || 0) + 1; x.dsira = sayac[x.ders]; });
  liste.sort((a, b) => a.due - b.due || a.dsira - b.dsira || a.ki - b.ki);

  let ogeler = liste.filter(x => (ov.sil || []).indexOf(x.ki) < 0);
  (ov.ek || []).forEach(ki => {
    if ((!sabitli || (ov.yer && ov.yer[ki] !== undefined)) && !ogeler.some(x => x.ki === ki))
      ogeler.push({ ki: ki, due: hb, ders: konuAl(ki)[0], kart: D.kart[si + ':' + ki], ek: true });
  });
  // Bir test hücresinin konusu değiştirildiyse hücrenin kimliği (slotKi) aynı kalır;
  // yalnızca o hücrede çözülecek gerçek konu (ki) değişir. Aynı konu farklı hücrelerde
  // tekrar edebilir; yer, soru sayısı ve silme işlemleri bu yüzden konuya değil hücreye bağlıdır.
  const degisim = ov.degisim || {};
  ogeler = ogeler.map(x => {
    const hedef = Number(degisim[x.ki]);
    if (!Number.isInteger(hedef) || !konuAl(hedef) || konuAl(hedef)[6] || hedef === x.ki) return x;
    return Object.assign({}, x, { slotKi: x.ki, ki: hedef, ders: konuAl(hedef)[0],
      kart: D.kart[si + ':' + hedef], degisim: true });
  });
  const anl = ov.anlatim || {};
  const anlKi = Object.keys(anl).map(Number).filter(ki => !sabitli || (ov.yer && ov.yer[ki] !== undefined));
  if (anlKi.length) ogeler = ogeler.filter(x => anlKi.indexOf(x.ki) < 0);   // aynı hafta hem anlatım hem test olmasın
  anlKi.forEach(ki => {
    if (!konuAl(ki) || konuAl(ki)[6]) return;
    ogeler.push({ ki: ki, due: hb, ders: konuAl(ki)[0], kart: null, anlatim: true, ek: true });
  });
  const sb = ov.serbest || {};
  Object.keys(sb).forEach(id => {
    if (sabitli && (!ov.yer || ov.yer[id] === undefined)) return;
    ogeler.push({ ki: id, due: hb, ders: -1, kart: null, serbest: true, ek: true });
  });
  const konuSlot = ov.konuSlot || {};
  Object.keys(konuSlot).forEach(id => {
    if (sabitli && (!ov.yer || ov.yer[id] === undefined)) return;
    const ki = Number((konuSlot[id] || {}).ki);
    if (!Number.isInteger(ki) || !konuAl(ki) || konuAl(ki)[6]) return;
    ogeler.push({ ki: ki, slotKi: id, due: hb, ders: konuAl(ki)[0], kart: D.kart[si + ':' + ki],
      ek: true, slotEk: true });
  });
  ogeler.forEach(x => {
    if (x.serbest) {
      const k = sb[x.ki] || {};
      x.ad = k.ad || 'Serbest çalışma';
      x.dersAd = k.ders || 'Serbest';
      x.soru = k.soru || D.ayar.soru;
      x.test = Math.max(1, Math.round(x.soru / D.ayar.soru));
      x.mod = 'serbest';
      x.kopya = !!k.kopya;
      x.birim = k.birim || '';
    } else if (x.anlatim) {
      const bilgi = anl[x.ki] || {};
      x.ad = konuAl(x.ki)[3];
      x.dersAd = (D.konuDers && D.konuDers[x.ki]) || KISA[konuAl(x.ki)[0]];
      x.kaynak = bilgi.kaynak || '';
      x.test = 1; x.soru = 0; x.mod = 'anlatim'; x.R = null;
    } else {
      x.ad = konuAl(x.ki)[3];
      x.dersAd = (D.konuDers && D.konuDers[x.ki]) || KISA[konuAl(x.ki)[0]];
      // ilk kez görülüyorsa 2 test (varsayılan); daha sonra R >= eşik ise koruma modu (1 test),
      // altındaysa hedefli pekiştirme (2 test)
      const olcumGun = Math.max(x.due, ilkGun(hb));
      x.R = x.kart ? hatirlama(Math.max(0, olcumGun - x.kart.son), x.kart.s) : null;
      const zayifSonuc = x.kart && x.kart.y < D.ayar.esik[1];
      x.test = !x.kart ? 2 : ((x.R < D.ayar.tekEsik || zayifSonuc) ? 2 : 1);
      x.mod = !x.kart ? 'ilk' : (x.test === 1 ? 'koruma' : 'pekiştirme');
      x.neden = !x.kart || x.test === 1 ? '' : (x.R < D.ayar.tekEsik ? 'hatırlama düştü' : 'önceki sonuç zayıf');
      const slot = planSlotAnahtari(x);
      const elleSoru = ov.soru && ov.soru[slot];
      x.soru = elleSoru || x.test * D.ayar.soru;
      if (elleSoru) x.test = Math.max(1, Math.round(elleSoru / D.ayar.soru));
    }
    x.pin = (ov.yer && ov.yer[planSlotAnahtari(x)]) || null;
  });
  // dondurulmuş (verilmiş) bir konu bu hafta içinde cevaplandıysa VE algoritmanın bulduğu
  // bir sonraki vade de aynı haftaya düşüyorsa (kısa aralık), o yeni tekrar için sabitlenmemiş,
  // ayrı bir satır aç — yoksa cevaplanan slotun sabit kalması bir sonraki tekrarı tamamen gizler
  if (!ov.sabit) ogeler.slice().forEach(x => {
    if (x.serbest || x.anlatim || x.degisim || x.slotEk || !x.pin || !x.kart) return;
    if (!(x.kart.son >= hb && x.kart.son <= hs)) return;
    if (!(x.due > x.kart.son && x.due <= hs)) return;
    ogeler.push(Object.assign({}, x, { pin: null }));
  });

  const gunler = [[], [], [], [], [], [], []];
  const yuk = dizi => dizi.reduce((a, y) => a + (y.test || 1), 0);
  // "konu anlatımı" kısa bir video/okuma — tam bir test gibi günün soru kapasitesini
  // (kap) paylaşmaz, kendi ayrı günlük sınırı vardır (Ayarlar / öğrenci bazlı).
  const anlatimSayisi = dizi => dizi.reduce((a, y) => a + (y.anlatim ? 1 : 0), 0);
  const anlatimSiniriGun = telafiAnlatimSiniri(si);
  // sabitlenmiş öğe bugüne çekilmez: kâğıtta hangi gün yazıyorsa orada kalır
  ogeler.filter(x => x.pin).sort((a, b) => a.pin[0] - b.pin[0] || a.pin[1] - b.pin[1]).forEach(x => {
    const g = Math.min(6, Math.max(0, x.pin[0]));
    const dizi = gunler[g];
    dizi.splice(Math.max(0, Math.min(x.pin[1], dizi.length)), 0, x);
  });
  const enErken = ilkGun(hb);
  // anlatım ve test iki AYRI kapasite havuzu kullanır (biri anlatimSiniriGun, diğeri kap),
  // bu yüzden ilerlemeyi de ayrı takip etmek gerekir — yoksa bir test öğesinin kendi kap
  // sıkışıklığı yüzünden ilerlettiği ortak işaretçi, hâlâ boş günü olan anlatımı da
  // gereksiz yere ileri iter (iki havuz bağımsız, birinin dolması diğerini bağlamamalı).
  let devreden = 0, ilerle = enErken, ilerleAnlatim = enErken;
  const tasan = [];
  // ogeler dizi sırası liste'nin due/dsira/ki sırasıyla başlar, ama ek/anlatim/serbest
  // öğeleri SONRADAN eklenir — due'ları en küçük (hb) olsa bile dizide en sonda dururlar.
  // ilerle tek, paylaşılan bir "geri gidilemez" işaretçi olduğundan, dizi sırasına göre
  // işlenirse bu geç eklenen ama erken vadeli öğeler, kendilerinden ÖNCE işlenmiş daha geç
  // vadeli öğelerin ilerlettiği günden başlamak zorunda kalır — boş duran erken günler
  // (ör. bugünün hemen ertesi) atlanıp haftalarca sonrasına düşebilirler. Yerleştirmeden
  // önce gerçek vade sırasına göre sıralamak bunu düzeltir.
  ogeler.filter(x => !x.pin).sort((a, b) => a.due - b.due || (a.dsira || 0) - (b.dsira || 0) ||
    String(a.ki).localeCompare(String(b.ki))).forEach(x => {
    let g = Math.max(x.due, enErken, x.anlatim ? ilerleAnlatim : ilerle);
    while (g <= hs && (off.indexOf(haftaGunu(g)) >= 0 ||
           (x.anlatim ? anlatimSayisi(gunler[g - hb]) >= anlatimSiniriGun
                      : yuk(gunler[g - hb]) + (x.test || 1) > kap))) g++;
    if (g > hs) { devreden++; if (!x.serbest) tasan.push(x.ki); return; }
    gunler[g - hb].push(x);
    if (x.anlatim) ilerleAnlatim = g; else ilerle = g;
  });
  const yerlesen = gunler.reduce((a, d) => a + d.length, 0);
  bekleyen.sort((a, b) => a.due - b.due || a.ki - b.ki);
  const sonTasan = sabitli && ov.plan && Array.isArray(ov.plan.tasan) ? ov.plan.tasan.slice() : tasan;
  const sonDevreden = sabitli && ov.plan ? (ov.plan.devreden || 0) : devreden;
  return { gunler: gunler, devreden: sonDevreden, tasan: sonTasan, toplam: yerlesen, bekleyen: bekleyen,
           testToplam: gunler.reduce((a, d) => a + yuk(d), 0),
           gunYuk: gunler.map(yuk), kap: kap, off: off, elle: ov };
}

// bir haftanın yerleşimini sabitler (elle taşımadan sonra plan kaymasın)
// haftayı olduğu gibi sabitler (çıktı verildiğinde kâğıt ile ekran ayrışmasın)
function haftayiSabitle(si, hb) {
  const p = planHesapla(si, hb);
  if (!p.toplam) return 0;
  dondur(si, hb, p);
  const ov = elleAl(si, hb, true);
  ov.sabit = bugunNo();
  planAnliginiKaydet(si, hb, p);
  return p.toplam;
}

// "Plan kullanılıyor" durumunun bütün eşlik eden alanlarını tek yerden yaz. Öğrenci,
// tek öğretmen çıktısı ve toplu çıktı aynı kurala tabi olsun; biri unutulup diğeri
// güncellendiğinde haftanın yeniden akmaya başlaması mümkün olmasın.
function haftayiKullanimaAl(si, hb) {
  const toplam = haftayiSabitle(si, hb);
  if (!toplam) return 0;
  const o = D.ogr[si], bugun = bugunNo();
  o.aktif = true;
  o.cikti = bugun;
  if (!o.ilkAktif) o.ilkAktif = bugun;
  return toplam;
}

function dondur(si, hb, p) {
  const ov = elleAl(si, hb, true);
  ov.yer = {};
  ov.soru = ov.soru || {};
  p.gunler.forEach((liste, g) => liste.forEach((x, i) => {
    const slot = planSlotAnahtari(x);
    ov.yer[slot] = [g, i];
    // soru/test sayısını da dondur — sonradan "test başına soru" ayarı değişse bile
    // verilmiş (yazdırılmış) bir haftanın rakamları kağıttakiyle aynı kalsın
    if (!x.serbest && !x.anlatim) ov.soru[slot] = x.soru;
  }));
}

function sonucKaydiDogrula(si, r) {
  if (!Number.isInteger(si) || !D.ogr[si] || D.ogr[si].silindi) throw new Error('Sonuç için geçerli bir öğrenci bulunamadı.');
  const ki = +r.ki, gun = +r.gun, dogru = +r.dogru, soru = +r.soru;
  if (!Number.isInteger(ki) || ki < 0 || ki >= konuSayisi() || !konuAl(ki)) throw new Error('Sonuçta geçersiz konu numarası var.');
  if (!Number.isInteger(gun) || gun > bugunNo()) throw new Error('Sonuç tarihi bugün veya daha eski, geçerli bir gün olmalı.');
  if (gun >= gunNo(D.ayar.sinav)) throw new Error('YKS tarihine veya sonrasına sonuç girilemez.');
  if (!Number.isInteger(soru) || soru < 1 || soru > 200) throw new Error('Soru sayısı 1–200 arasında tam sayı olmalı.');
  if (!Number.isInteger(dogru) || dogru < 0 || dogru > soru) throw new Error('Doğru sayısı 0 ile soru sayısı arasında olmalı.');
  let guncellemeTs = null;
  if (r.guncellemeTs !== undefined && r.guncellemeTs !== null) {
    guncellemeTs = +r.guncellemeTs;
    if (!Number.isSafeInteger(guncellemeTs) || guncellemeTs <= 0)
      throw new Error('Sonuçta geçersiz güncelleme zamanı var.');
  }
  return { ki: ki, gun: gun, dogru: dogru, soru: soru, guncellemeTs: guncellemeTs };
}

function kartiYenidenHesapla(si, ki) {
  const anahtar = si + ':' + ki;
  if (!D.ogr[si] || !konuAl(ki)) { delete D.kart[anahtar]; return null; }
  const o = D.ogr[si], dr = o.hedef || D.ayar.hedef, sinavG = gunNo(D.ayar.sinav);
  const kayitlar = D.log.filter(l => l[1] === si && l[2] === ki)
    .sort((a, b) => a[0] - b[0] || (+a[6] || 0) - (+b[6] || 0));
  let kart = null;
  kayitlar.forEach(l => {
    const yuzde = l[3] / l[4] * 100;
    const not = Number.isInteger(+l[5]) && +l[5] >= 1 && +l[5] <= 4 ? +l[5] : notVer(yuzde, D.ayar.esik);
    const gecen = kart ? Math.max(0, l[0] - kart.son) : 0;
    const y = tekrarla(kart, not, gecen, dr, D.ayar.maks, D.ayar.relearn, parametreAl(si, ki));
    kart = { s: y.s, d: y.d, son: l[0], due: Math.min(l[0] + y.ivl, sinavG - 1),
             n: (kart ? kart.n : 0) + 1, y: Math.round(yuzde) };
  });
  if (kart) D.kart[anahtar] = kart; else delete D.kart[anahtar];
  return kart;
}

function sonucIsle(si, kayitlar) {
  if (!Array.isArray(kayitlar)) throw new Error('Sonuç kayıtları liste biçiminde değil.');
  const tekil = new Map();
  kayitlar.forEach(r => {
    const temiz = sonucKaydiDogrula(si, r);
    tekil.set(temiz.gun + ':' + temiz.ki, temiz);       // aynı pakette son değer kazanır
  });
  const yeni = Array.from(tekil.values());
  if (!yeni.length) return 0;
  const degisen = new Set(yeni.map(r => r.ki));
  const degisenGun = new Set(yeni.map(r => r.gun + ':' + r.ki));
  D.log = D.log.filter(l => l[1] !== si || !degisenGun.has(l[0] + ':' + l[2]));
  const enYeni = D.log.reduce((m, l) => Math.max(m, Number.isSafeInteger(+l[6]) ? +l[6] : 0), 0);
  const zaman = Math.max(Date.now(), enYeni + 1);
  yeni.sort((a, b) => a.gun - b.gun || a.ki - b.ki).forEach((r, i) => {
    const yuzde = r.dogru / r.soru * 100;
    D.log.push([r.gun, si, r.ki, r.dogru, r.soru, notVer(yuzde, D.ayar.esik), r.guncellemeTs || zaman + i]);
    erteleSil(si, r.ki);
  });
  degisen.forEach(ki => kartiYenidenHesapla(si, ki));
  return yeni.length;
}

const kacis = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const ogrSecici = () => {
  const gruplar = {};
  canliOgrenciler().forEach(i => { (gruplar[D.ogr[i].sube] = gruplar[D.ogr[i].sube] || []).push(i); });
  return '<select class="genis" id="ogrSec">' + Object.keys(gruplar).sort().map(su =>
    '<optgroup label="' + kacis(su) + '">' + gruplar[su].map(i =>
      '<option value="' + i + '"' + (i === EK.ogr ? ' selected' : '') + '>' + kacis(D.ogr[i].ad) +
      ' · ' + kacis(D.ogr[i].alan) + (D.ogr[i].aktif === false ? ' · çıktı verilmedi' : '') + '</option>').join('') +
    '</optgroup>').join('') + '</select>';
};
const haftaSecici = () => {
  const hb = haftaBasi();
  return '<button class="dugme" data-hafta="-1">◀</button>' +
    '<span class="sayisal" style="min-width:172px;display:inline-block;text-align:center;font-weight:600">' +
    ggyy(hb) + ' – ' + ggyy(hb + 6) + '</span>' +
    '<button class="dugme" data-hafta="1">▶</button>' +
    (hb !== buHafta() ? '<button class="dugme birincil" data-hafta="0">bu haftaya dön</button>' : '');
};

function planListesi(si, hb, p) {
  let h = '<div class="plan-liste">';
  for (let g = 0; g < 7; g++) {
    const izin = p.off.indexOf(haftaGunu(hb + g)) >= 0;
    const liste = p.gunler[g];
    if (!liste.length && !izin) continue;
    const gecti = gunGecti(hb, g), bugun = bugunMu(hb, g);
    h += '<div class="pl-gun' + (gecti ? ' gecti' : '') + (bugun ? ' bugun' : '') + '">' +
      '<div class="pl-bas"><b>' + GUN_AD[g] + '</b><span>' + gg(hb + g) + '</span>' +
      (bugun ? '<em>bugün</em>' : gecti ? '<em>geçti</em>' : '') +
      (izin ? '<em>izin</em>' : '<span class="pl-yuk">' + (p.gunYuk[g] || 0) + '/' + p.kap + ' test</span>') +
      '</div>' +
      (liste.length ? liste.map((x, i) => '<div class="pl-oge"' +
          (gecti ? '' : ' data-hucre="1" data-g="' + g + '" data-s="' + i +
            '" role="button" tabindex="0" aria-label="' + kacis(GUN_AD[g] + ' ' + x.ad + ' çalışmasını düzenle') + '"') + '>' +
          '<div class="d">' + kacis(dersKisaAd(x.dersAd)) + '</div>' +
          '<div class="k">' + kacis(x.ad) + '</div>' +
          '<div class="n">' + (x.anlatim ? 'KONU ANLATIMI' + (x.kaynak ? ' · ' + kacis(x.kaynak) : '')
            : (x.test > 1 ? x.test + ' test · ' : '') + x.soru + (x.birim === 'dakika' ? ' dakika' : ' soru')) + '</div></div>').join('')
        : '<div class="pl-bos">' + (izin ? 'izin günü' : 'boş') + '</div>') + '</div>';
  }
  return h + '</div>';
}

function planTablosu(si, hb, p, tumu) {
  const enCok = Math.max(8, ...p.gunler.map(g => g.length));
  let h = '<div class="sayfa' + (tumu ? ' tumu-sayfa' : '') + '"><div class="sayfa-ust">' +
    '<div class="isim">' + kacis(D.ogr[si].ad) + '</div>' +
    '<div class="tarihler">' + ggyy(hb) + ' – ' + ggyy(hb + 6) + '</div></div>' +
    '<div class="sarma"><table class="plan"><thead><tr><th style="width:34px">Sıra</th>';
  for (let g = 0; g < 7; g++) {
    const tatil = p.off.indexOf(haftaGunu(hb + g)) >= 0;
    const gecti = !tumu && gunGecti(hb, g), bugun = !tumu && bugunMu(hb, g);
    h += '<th class="' + (tatil ? 'tatil ' : '') + (gecti ? 'gecti ' : '') + (bugun ? 'bugun' : '') + '">' +
      GUN_AD[g].toUpperCase() + '<br>' + gg(hb + g) +
      (tatil ? ' · izin' : '') + (bugun ? ' · bugün' : gecti ? ' · geçti' : '') + '</th>';
  }
  h += '</tr></thead><tbody>';
  for (let s2 = 0; s2 < enCok; s2++) {
    h += '<tr><td class="sira">' + (s2 + 1) + '</td>';
    for (let g = 0; g < 7; g++) {
      const x = p.gunler[g][s2];
      const gecti = !tumu && gunGecti(hb, g);
      const hucreEtiketi = x
        ? GUN_AD[g] + ' ' + x.ad + ' çalışmasını düzenle'
        : GUN_AD[g] + ' ' + (s2 + 1) + '. boş sıraya çalışma ekle';
      const kilit = (tumu || gecti) ? '' : ' data-hucre="1" data-g="' + g + '" data-s="' + s2 +
        '" role="button" tabindex="0" aria-label="' + kacis(hucreEtiketi) + '"';
      if (!x) { h += '<td class="bos' + (gecti ? ' gecti' : '') + '"' + kilit + '></td>'; continue; }
      // bu hücre, kartın zaten cevaplandığı hafta içindeki sabitlenmiş (tarihsel) satırsa, o cevabın
      // kaydedildiği anki deneme numarasını göster (n); aksi hâlde önümüzdeki denemenin numarasını (n+1)
      const cevaplanmisHucre = x.kart && x.pin && x.kart.son >= hb && x.kart.son <= hb + 6;
      const bilgi = x.anlatim ? ('konu anlatımı' + (x.kaynak ? ' · ' + x.kaynak : ''))
        : x.serbest ? (x.kopya ? 'ek çözüm' : 'serbest çalışma')
        : (x.kart ? (x.kart.n + (cevaplanmisHucre ? 0 : 1)) + '. tekrar · önceki %' + x.kart.y : 'ilk tekrar') + (x.ek ? ' · elle eklendi' : '');
      const modEk = (!x.serbest && x.R !== null && x.R !== undefined)
        ? ' · %' + Math.round(x.R * 100) + ' hatırlama' : '';
      h += '<td class="dolu' + (gecti ? ' gecti' : '') + (x.anlatim ? ' anlatim' : '') + '"' + kilit +
        (tumu || EK.toplu || gecti ? '' : ' draggable="true"') + '>' +
        (!tumu && EK.toplu ? '<label class="topluEtiket"><input type="checkbox" class="topluKutu" data-slot="' +
          kacis(planSlotAnahtari(x)) + '"> seç</label>' : '') +
        '<div class="d">' + kacis(dersKisaAd(x.dersAd)) + '</div><div class="k">' + kacis(x.ad) + '</div>' +
        '<div class="n"><b>' + (x.anlatim ? 'ANLATIM' : (x.test > 1 ? x.test + ' test · ' : '') + x.soru + (x.birim === 'dakika' ? ' dakika' : ' soru')) +
        '</b> · ' + kacis(bilgi + modEk) + '</div></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if (!tumu) h += planListesi(si, hb, p);

  const a = D.anlasma || {};
  if (a.aktif !== false) {
    const o = D.ogr[si];
    const maddeler = (a.maddeler || []).concat(o.maddeler || []);
    h = h.replace('<div class="sarma"><table class="plan">', '<div class="plan-duzen"><div><div class="sarma"><table class="plan">');
    h += '</div><aside class="anlasma">' +
      '<div class="a-baslik">' + kacis(a.baslik || 'ANLAŞMA') + '</div>' +
      '<div class="a-giris">' + kacis(a.giris || '') + '</div>' +
      '<ol class="a-maddeler">' + maddeler.map(m => '<li>' + kacis(m) + '</li>').join('') + '</ol>' +
      '<div class="a-yazma" aria-label="Öğrencinin yazacağı sözler"><i></i><i></i><i></i></div>' +
      '<div class="a-imza" style="text-align:center;padding-bottom:36px">İmza</div>' +
      '</aside></div>';
    const b = D.rutinBasliklari || ['Ders çalışmadan önce', 'Ders arası', 'Ders çalıştıktan sonra'];
    const r = o.rutin || {};
    const metin = [r.once, r.ara, r.sonra];
    h += '<div class="rutin">' + b.map((ad, i) =>
      '<div class="r-kutu"><div class="r-baslik">' + kacis(ad) + '</div>' +
      (metin[i] ? '<div class="r-metin">' + kacis(metin[i]).replace(/\n/g, '<br>') + '</div>'
                : '<div class="r-cizgi"></div><div class="r-cizgi"></div><div class="r-cizgi"></div>') +
      '</div>').join('') + '</div>';
  }
  h += '</div>';
  return h;
}

// ---------------------------------------------------------------- konu penceresi
let PENCERE = null;   // {g, s, ki}
let PENCERE_ONCESI = null;

const kullanan = i => D.ogr[i].aktif !== false;
const kullananlar = () => D.ogr.map((o, i) => i).filter(i => !D.ogr[i].silindi && kullanan(i));
const canliOgrenciler = () => D.ogr.map((o, i) => i).filter(i => !D.ogr[i].silindi);
const subeKullananlar = su => kullananlar().filter(i => D.ogr[i].sube === su);
function subeListesi() {
  const k = {};
  (D.ogr || []).forEach(o => { if (!o.silindi && o.sube) k[o.sube] = 1; });
  Object.keys(D.dersProgrami || {}).forEach(x => { k[x] = 1; });
  Object.keys(D.programHafta || {}).forEach(x => { k[x] = 1; });
  return Object.keys(k).sort();
}

function hedefOgrenciler() {
  const kap = PENCERE && PENCERE.kapsam;
  if (kap === 'sube') { const su = D.ogr[EK.ogr].sube; return kullananlar().filter(i => D.ogr[i].sube === su); }
  if (kap === 'hepsi') return kullananlar();
  return [EK.ogr];
}

// Bu düğmeler yalnızca açık olan test hücresini değiştirir. Komşu hücrelere dokunulmaz;
// aynı mikro konu farklı günlerde bilinçli olarak tekrar seçilebilir.
function dersSirasiKutusu(si, mevcut) {
  if (!mevcut || mevcut.serbest || mevcut.anlatim ||
      (mevcut.kart && !mevcut.degisim && !mevcut.slotEk) || !Number.isInteger(mevcut.ki)) return '';
  const sube = (D.ogr[si] || {}).sube;
  const dersAd = mevcut.dersAd || konuDersAdi(mevcut.ki);
  const anahtar = planDersAnahtari(sube, dersAd);
  if (!anahtar) return '';
  const onceki = dersSirasiOnizleme(si, anahtar, mevcut.ki, -1);
  const sonraki = dersSirasiOnizleme(si, anahtar, mevcut.ki, 1);
  if (onceki.gizle && sonraki.gizle) return '';
  return '<div class="p-gunler"><div class="etiket">Bu testteki mikro konuyu değiştir</div>' +
    '<div class="mini" style="margin-bottom:7px">Yalnızca seçili <b>' + kacis(mevcut.ad) +
    '</b> testi değişir. Önceki/sonraki testler ve konu planı aynı kalır; aynı konu başka bir testte tekrar edebilir.</div>' +
    '<div class="gunSec"><button class="dugme sirakaydir" data-yon="-1" data-ki="' + mevcut.ki +
    '" data-ders="' + kacis(anahtar) + '"' + (onceki.hata ? ' disabled title="' + kacis(onceki.hata) + '"' :
      ' title="Bu testte ' + kacis(onceki.hedefAd) + ' olsun"') + '>◀ önceki konu</button>' +
    '<button class="dugme sirakaydir" data-yon="1" data-ki="' + mevcut.ki + '" data-ders="' + kacis(anahtar) +
    '"' + (sonraki.hata ? ' disabled title="' + kacis(sonraki.hata) + '"' :
      ' title="Bu testte ' + kacis(sonraki.hedefAd) + ' olsun"') + '>sonraki konu ▶</button>' +
    '<button class="dugme sonrakiEkle"' + (sonraki.hata ? ' disabled title="' + kacis(sonraki.hata) + '"' :
      ' title="' + kacis(sonraki.hedefAd) + ' için aynı güne ayrı test ekle"') + '>+ sonraki konuyu bugün ekle</button></div></div>';
}

function pencereCiz() {
  const eski = document.getElementById('ortu');
  if (eski) eski.remove();
  if (!PENCERE) {
    if (PENCERE_ONCESI && document.contains(PENCERE_ONCESI)) PENCERE_ONCESI.focus();
    PENCERE_ONCESI = null;
    return;
  }
  const si = EK.ogr, hb = haftaBasi(), p = planHesapla(si, hb);
  const { g, s } = PENCERE;
  const mevcut = p.gunler[g][s] || null;
  const ov = p.elle;
  const arama = PENCERE.arama || '';
  if (!Array.isArray(PENCERE.gunSecim)) PENCERE.gunSecim = [g];
  if (!PENCERE.kapsam) PENCERE.kapsam = 'ogrenci';
  const suSayi = kullananlar().filter(i => D.ogr[i].sube === D.ogr[si].sube).length;
  // tek başına çalışan bir öğrenci için "kime" (öğrenci/şube/sınıf) seçimi anlamsız — kendisi zaten tek muhatap

function tasi(si, hb, kaynak, hedef) {
  if (gunGecti(hb, hedef.g) || gunGecti(hb, kaynak.g)) {
    bilgiVer('Geçmiş güne iş yazılamaz — bugün ' + ggyy(bugunNo()) + '.');
    return false;
  }
  const sabit = elleAl(si, hb, false).sabit;
  if (sabit) {
    bilgiVer('Bu haftanın planı ' + ggyy(sabit) + ' tarihinde verildi/sabitlendi; kâğıttaki sıra değişmesin diye ' +
             'taşınamaz. Değiştirmek gerekiyorsa önce “Elle düzeni sıfırla”yı kullanın.');
    return false;
  }
  const p = planHesapla(si, hb);
  const x = p.gunler[kaynak.g][kaynak.s];
  if (!x) return false;
  p.gunler[kaynak.g].splice(kaynak.s, 1);
  const dizi = p.gunler[hedef.g];
  dizi.splice(Math.max(0, Math.min(hedef.s, dizi.length)), 0, x);
  dondur(si, hb, p);
  return true;
}

function planaEkle(si, hb, ki, g, s) {
  const p = planHesapla(si, hb);
  const ov = elleAl(si, hb, true);
  ov.sil = (ov.sil || []).filter(k => k !== ki);
  let oge = null;
  p.gunler.forEach(liste => {
    const i = liste.findIndex(x => x.ki === ki);
    if (i >= 0) { oge = liste[i]; liste.splice(i, 1); }
  });
  if (!oge) {
    if ((ov.ek || []).indexOf(ki) < 0) (ov.ek = ov.ek || []).push(ki);
    oge = { ki: ki, due: hb, ders: konuAl(ki)[0], kart: D.kart[si + ':' + ki], ek: true,
            soru: (ov.soru && ov.soru[ki]) || D.ayar.soru };
  }
  const dizi = p.gunler[g];
  dizi.splice(Math.max(0, Math.min(s, dizi.length)), 0, oge);
  dondur(si, hb, p);
}

// serbest satırı kalıcı konuya çevirir: karta dönüşür, FSRS takvimine girer
function konuyaCevir(si, hb, ki, ders, ad) {
  D.ekKonular = D.ekKonular || [];
  // dersEsle okul adlarını (Matematik AYT, Geometri, ...) da tanır; KISA.indexOf yalnızca
  // 10 katalog dersini tanıyordu ve okul adı seçilince hep Edebiyat'a düşüyordu.
  const dersIdx = Math.max(0, dersEsle(ders));
  D.konuDers = D.konuDers || {};
  D.ekKonular.push([dersIdx, 12, 'Kendi eklediğim konular', ad, 0, '']);
  const yeniKi = KATALOG.length + D.ekKonular.length - 1;
  D.konuDers[yeniKi] = ders;
  D.islenis[yeniKi] = Math.min(hb, bugunNo());
  const p = planHesapla(si, hb);
  let g = 0, s2 = 0;
  p.gunler.forEach((liste, gi) => { const i = liste.findIndex(x => x.ki === ki); if (i >= 0) { g = gi; s2 = i; } });
  plandanKaldir(si, hb, ki);
  planaEkle(si, hb, yeniKi, g, s2);
  return yeniKi;
}

// Konu takvimin kendi ürettiği bir tekrar mı? (kartı var ya da işlenmiş sayılıyor)
// Bir konu aynı anda hem elle eklenmiş hem de takvimden gelmiş olabilir; o yüzden
// "elle eklendiyse sil listesine yazma" varsayımı yanlıştı — takvimden gelen kopya
// planda kalıyor ve kutu silinmiyormuş gibi görünüyordu.
function takvimdenMi(si, ki) {
  if (typeof ki !== 'number') return false;                 // serbest satır (S1, S2…)
  if (D.kart[si + ':' + ki]) return true;
  const suIsl = (D.subeIslenis || {})[(D.ogr[si] || {}).sube] || {};
  const ogIsl = (D.ogrIslenis || {})[si] || {};
  return ogIsl[ki] !== undefined || suIsl[ki] !== undefined || D.islenis[ki] !== undefined;
}

function plandanKaldir(si, hb, slot) {
  const p = planHesapla(si, hb);
  let cikarilan = null;
  p.gunler.forEach(liste => {
    const i = liste.findIndex(x => String(planSlotAnahtari(x)) === String(slot));
    if (i >= 0) cikarilan = liste.splice(i, 1)[0];
  });
  if (!cikarilan) return false;
  dondur(si, hb, p);
  const ov = elleAl(si, hb, true);
  if (ov.yer) delete ov.yer[slot];
  if (ov.soru) delete ov.soru[slot];
  if (ov.serbest) delete ov.serbest[slot];
  if (ov.konuSlot) delete ov.konuSlot[slot];
  const kaynakKi = Number(slot);
  if (Number.isInteger(kaynakKi)) {
    if (ov.degisim) delete ov.degisim[kaynakKi];
    if (ov.anlatim) delete ov.anlatim[kaynakKi];
    ov.ek = (ov.ek || []).filter(k => k !== kaynakKi);
  }
  // Takvimin ürettiği her konu bu haftadan çıkarılır (sırası gelince yine gelir).
  // Yalnızca serbest satırlar tamamen silinir; onların sil listesinde işi yok.
  if (Number.isInteger(kaynakKi) && takvimdenMi(si, kaynakKi) && (ov.sil || []).indexOf(kaynakKi) < 0)
    (ov.sil = ov.sil || []).push(kaynakKi);
  return true;
}

function kopyaEkle(si, hb, ad, ders, soru, g, s, birim) {
  const ov = elleAl(si, hb, true);
  ov.serbest = ov.serbest || {};
  let n = 1;
  while (ov.serbest['S' + n]) n++;
  const id = 'S' + n;
  ov.serbest[id] = { ad: ad, ders: ders || '', soru: soru || D.ayar.soru, kopya: true, birim: birim || '' };
  const p = planHesapla(si, hb);
  let oge = null;
  p.gunler.forEach(liste => { const i = liste.findIndex(x => x.ki === id); if (i >= 0) { oge = liste[i]; liste.splice(i, 1); } });
  if (!oge) oge = { ki: id, serbest: true, kopya: true, ad: ad, dersAd: ders || '', soru: soru, birim: birim || '' };
  p.gunler[g].splice(Math.max(0, Math.min(s, p.gunler[g].length)), 0, oge);
  dondur(si, hb, p);
}

// bir öğeyi seçilen günlere dağıtır: ilk gün aslı, diğerleri "ek çözüm" kopyası
function gunlereDagit(si, hb, secim, asil) {
  const gunler = secim.filter(g => !gunGecti(hb, g)).sort((a, b) => a - b);
  if (!gunler.length) return;
  gunler.forEach((g, i) => {
    const p = planHesapla(si, hb);
    const sonSira = p.gunler[g].length;
    if (asil.tur === 'anlatim') anlatimEkle(si, hb, asil.ki, asil.kaynak, g, sonSira);
    else if (i === 0 && asil.tur === 'konu') planaEkle(si, hb, asil.ki, g, sonSira);
    else if (i === 0 && asil.tur === 'serbest') serbestEkle(si, hb, asil.ad, asil.ders, asil.soru, g, sonSira, asil.birim);
    else kopyaEkle(si, hb, asil.ad, asil.ders, asil.soru, g, sonSira, asil.birim);
  });
}

function anlatimEkle(si, hb, ki, kaynak, g, s) {
  const ov = elleAl(si, hb, true);
  ov.anlatim = ov.anlatim || {};
  ov.anlatim[ki] = { kaynak: kaynak || '' };
  ov.sil = (ov.sil || []).filter(k => k !== ki);
  const p = planHesapla(si, hb);
  let oge = null;
  p.gunler.forEach(liste => {                       // nerede durduğunu bul, çıkar
    const j = liste.findIndex(x => x.ki === ki && x.anlatim);
    if (j >= 0) { oge = liste[j]; liste.splice(j, 1); }
  });
  if (oge) {
    const hedef = p.gunler[Math.min(6, Math.max(0, g))];
    hedef.splice(Math.max(0, Math.min(s === undefined ? hedef.length : s, hedef.length)), 0, oge);
  }
  dondur(si, hb, p);
  return ki;
}
// anlatım yapıldı: o öğrenci için konu o gün işlenmiş sayılır, ilk test ayardaki gün sonra gelir
function anlatimTamam(si, ki, gun) {
  D.ogrIslenis = D.ogrIslenis || {};
  D.ogrIslenis[si] = D.ogrIslenis[si] || {};
  D.ogrIslenis[si][ki] = gun;
  Object.keys(D.elle || {}).forEach(a => {
    const par = a.split('|');
    if (+par[0] !== si) return;
    const ov = D.elle[a];
    if (ov.anlatim && ov.anlatim[ki] !== undefined) { delete ov.anlatim[ki]; if (ov.yer) delete ov.yer[ki]; }
  });
}

function serbestEkle(si, hb, ad, ders, soru, g, s, birim) {
  const ov = elleAl(si, hb, true);
  ov.serbest = ov.serbest || {};
  let n = 1;
  while (ov.serbest['S' + n]) n++;
  const id = 'S' + n;
  ov.serbest[id] = { ad: ad, ders: ders || '', soru: Math.max(1, Math.min(200, soru || D.ayar.soru)), birim: birim || '' };
  const p = planHesapla(si, hb);
  let oge = null;
  p.gunler.forEach(liste => { const i = liste.findIndex(x => x.ki === id); if (i >= 0) { oge = liste[i]; liste.splice(i, 1); } });
  if (!oge) oge = { ki: id, serbest: true, ad: ad, dersAd: ders || 'Serbest', soru: soru, birim: birim || '' };
  const dizi = p.gunler[g];
  dizi.splice(Math.max(0, Math.min(s, dizi.length)), 0, oge);
  dondur(si, hb, p);
}

// Ayarlar → geçmiş sonuçları düzelt ve kartları yeniden hesapla
// Geçmişi düzenleme düğmesi / kilit açıklaması
function duzenleDugmesi(si, hb) {
  if (ogrenciMi()) return '';
  const n = haftaSonucSayisi(si, hb);
  if (n) return '<span class="mini">· Bu haftanın <b>' + n + '</b> sonucu girildi, düzeni artık değiştirilemez ' +
                '— tekrar tarihleri bu sonuçlara göre hesaplandı.</span>';
  if (duzenlemeAcik(hb)) return '';        // şeritte zaten "düzenlemeyi bitir" var
  return '<button class="dugme" id="duzenleAc">bu haftayı düzenle</button>';
}

// ---------------------------------------------------------------- görünümler
function gorunumPlan() {
  const si = EK.ogr, hb = haftaBasi(), p = planHesapla(si, hb);
  const o = D.ogr[si];
  // hemen bir sonraki haftaya bakmak normaldir (hafta sonunda gelecek haftayı kurmak gibi) —
  // "ileri haftadasınız" uyarısı yalnızca ondan da ötesi için, aksi hep can sıkıcı bir şekilde çıkıyordu
  const gecmisHafta = hb + 6 < bugunNo(), ileriHafta = hb > buHafta() + 7;
  const dh = duzenlenenHafta();
  const atlanan = atlananHaftalar(si);
  const katilmadanOnceki = katilmadanOnceHaftaSayisi(si);
  return (dh !== null && !ogrenciMi()
      ? '<div class="uyari-serit"><b>Düzenleme açık — ' + ggyy(dh) + ' – ' + ggyy(dh + 6) + ' haftası.</b> ' +
        (dh === hb ? 'Geçmiş günlere de kutu taşıyabilir, konu ekleyip çıkarabilirsiniz. '
                   : 'Şu an başka bir haftaya bakıyorsunuz. ') +
        (dh === hb ? '' : '<button class="dugme" id="duzenleneneDon">o haftaya dön</button> ') +
        '<button class="dugme birincil" id="duzenleBitir">düzenlemeyi bitir</button></div>'
      : '') +
    (gecmisHafta
      ? (p.kayitYok
        ? '<div class="uyari-serit"><b>Bu hafta için kullanıma alınmış bir plan kaydı yok.</b> ' +
          'Bugünkü konularla geçmişi yeniden üretmek yanlış bir plan göstereceği için tablo boş bırakıldı. ' +
          '<button class="dugme birincil" data-hafta="0">bu haftaya dön</button> ' + duzenleDugmesi(si, hb) + '</div>'
        : '<div class="uyari-serit"><b>Sabitlenmiş geçmiş plana bakıyorsunuz</b> (' + ggyy(hb) + ' – ' + ggyy(hb + 6) +
          '). Bu kayıt sonraki konu veya tarih değişikliklerinden etkilenmez. ' +
          '<button class="dugme birincil" data-hafta="0">bu haftaya dön</button> ' + duzenleDugmesi(si, hb) + '</div>')
      : (p.elle && p.elle.sabit)
      // Yazdırılıp öğrenciye verilmiş bir hafta, takvimde henüz "geçmiş" sayılmasa bile
      // (ör. haftanın ilk günü) fiilen aynı durumdadır: düzen kâğıtta sabit, tek eksik
      // sonuçların girilmesi. Bunu, geçmiş-hafta uyarısıyla aynı görünürlükte göster —
      // önceden yalnızca küçük bir alt not vardı, kolayca gözden kaçıyordu.
      ? '<div class="uyari-serit"><b>Bu haftanın planı ' + ggyy(p.elle.sabit) + ' tarihinde verildi/sabitlendi.</b> ' +
        'Kâğıttaki sıra değişmez; tek beklenen, sonuçların girilmesi. ' + duzenleDugmesi(si, hb) + '</div>'
      : ileriHafta
      ? '<div class="mini" style="margin-bottom:10px">İleri bir haftaya bakıyorsunuz. Burada yalnızca <b>tarihi kesinleşmiş</b> ' +
        'tekrarlar görünür; sonucu girilmemiş bir konunun bir sonraki tarihi belli olmadığı için buraya yazılmaz. ' +
        'Sonuçları girdikçe bu hafta dolar.</div>'
      : (!p.toplam && p.devreden)
      ? '<div class="uyari-serit"><b>Bu hafta doldu.</b> Bugün ' + GUN_AD[haftaGunu(bugunNo())] + ' ' + ggyy(bugunNo()) +
        '; geçmiş günlere iş yazılmadığı için bekleyen <b>' + p.devreden + '</b> konu gelecek haftaya devredildi. ' +
